<div class="loader-new" ng-if="vm.loader"></div>
<div class="container from_wrapper new_form_wrapper">
    <h4 class="form_heading">Certificate Of Printing</h4>
    <sol-header></sol-header>
    <form name="certificateOfPrinting" role="form">


        <div class="row">
            <div class="form-group">
                <div class="col-sm-3"></div>
                <div class="col-sm-3">
                    <label class="control-label">Name of the Module</label>
                </div>
                <div class="col-sm-5">
                    <label><b>RBI Bond</b></label>
                </div>
            </div>
        </div>
        <!--Name of the Bond Scheme        -->
        <div class="row">
            <div class="form-group required">
                <div class="col-sm-3"></div>
                <div class="col-sm-3">
                    <label for="blaNo" class="control-label"
                    >Name of the Bond Scheme</label
                    >
                </div>
                <div class="col-sm-2">
                    <input type="text"
                           class="form-control"
                           id="schemeCode"
                           ng-model="vm.schemeName"
                           chars="alpha-numeric"

                           required
                    />
                </div>
                <div class="col-sm-2" style="display: flex; align-items: center; height:34px; gap:5px; padding-left:0">
          <span class="glyphicon glyphicon-search cp"
                data-bs-toggle="schemeCode" id="treasurySearch"
                ng-click="vm.getModuleName();"
          ></span>
                    <span class="glyphicon glyphicon-remove clear cp"
                          ng-click="vm.schemeName =''"
                    ></span>
                </div>
            </div>
        </div>

        <!--From Date-->
        <div class="row">
            <div class="form-group required">
                <div class="col-sm-3"></div>
                <div class="col-sm-3">
                    <label for="valueDate" class="control-label">
                        Value Date<br />(DD/MM/YYYY)</label
                    >
                </div>
                <div class="col-sm-2 inner-addon right-addon">
                    <p class="input-group">
                        <input
                                type="text"
                                class="form-control"
                                id="effFromDate1"
                                name="effFromDate"
                                ng-model="vm.valueDate"
                                uib-datepicker-popup="dd/MM/yyyy"
                                ng-init="vm.valueDate=''; vm.fromDateVal();"
                                datepicker-options="vm.dateFromOptions"
                                is-open="vm.effFromDatePicker.opened"
                                close-text="Close"
                                ng-blur="vm.textableDatePicker('effFromDate1',vm.valueDate)"
                                ng-keyup="vm.autoslashing('effFromDate1')" chars="numbers-slash"
                                required
                        />
                        <span class="input-group-btn">
              <button
                      type="button"
                      class="btn btn-secondary"
                      ng-click="vm.effFromDatePicker.opened = true"
                      id="effFromDateSearcher1"
              >
                <span class="glyphicon glyphicon-calendar"></span>
              </button>
            </span>
                    </p>
                </div>
            </div>
        </div>


        <!--Submit & Cancel Button        -->
        <div class="text-center form_submit">
            <button
                    type="submit"
                    class="btn btn-default"
                    id="submitButton"
                    ui-sref="Certificate_Printing.inquiry_details({obj:{
                            'valueDate'   : vm.valueDate,
                            'schemeName' : vm.schemeName,
                            'schemeCode' : vm.schemeCode,
                              }})"
                    ng-disabled="certificateOfPrinting.$invalid"
            >
                Submit
            </button>
            <button
                    type="button"
                    class="btn btn-cancel"
                    id="cancelButton"
                    onclick="window.location.href= '#!/rbibond_gu_functionality'"
            >
                Cancel
            </button>
        </div>
        <div class="text-center">
            <notice-message-directive></notice-message-directive>
        </div>
    </form>
</div>

<!--Bond Scheme Modal-->
<div class="modal" id="schemeModel" role="dialog">
    <div class="modal-dialog">
        <!-- Modal content-->
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-bs-dismiss="modal">
                    &times;
                </button>
                <h4 class="modal-title">SCHEME CODE</h4>
            </div>
            <div class="modal-body">
                <div class="loader_popup"></div>
                <div class="list_wrapper" ng-if="vm.schemeList.length>0">
                    <div class="col-sm-8 form_submit">
                        <div class="form-group">
                            <div class="input-group">
                                <div class="input-group-addon">
                                    <span class="glyphicon glyphicon-search"></span>
                                </div>
                                <input
                                        type="text"
                                        class="form-control"
                                        ng-model="vm.searchSolId"
                                        ng-init="vm.searchSolId = ''"
                                        placeholder="Search"
                                        ng-pattern="/^[a-zA-Z0-9]+(\s[a-zA-Z0-9]+)*$/"
                                        ng-trim="true"
                                        ng-change="vm.searchSolId = vm.searchSolId.replace(/[^a-zA-Z0-9\s]/g, '').trim().replace(/\s+/g, ' ');"
                                />
                            </div>
                        </div>
                    </div>
                    <div class="col-sm-4 form_submit"></div>
                    <div class="row">
                        <div class="col-sm-12">
                            <table class="table table-bordered list scroll sort" aria-label="Callback report table listing scheme names and details">
                                <thead ng-init="reverseOrder=false;sortedColumn = 'schemeCode'">
                                <tr>
                                    <th scope="col"
                                        ng-click="(sortedColumn == 'subDesc')?(reverseOrder=(!reverseOrder)): (reverseOrder = false);sortedColumn = 'subDesc';"
                                        ng-class="(sortedColumn == 'subDesc')?((reverseOrder)?('arrow-down') : ('arrow-up') ) : ('')"
                                    >
                                        SCHEME NAME
                                    </th>
                                    <th scope="col"
                                        ng-click="(sortedColumn == 'schemeStatus')?(reverseOrder=(!reverseOrder)): (reverseOrder = false);sortedColumn = 'schemeStatus';"
                                        ng-class="(sortedColumn == 'schemeStatus')?((reverseOrder)?('arrow-down') : ('arrow-up') ) : ('')"
                                    >
                                        SCHEME STATUS
                                    </th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr class="cp"
                                    ng-repeat="x in vm.schemeList | filter:vm.searchSolId | orderBy:sortedColumn:reverseOrder"
                                    ng-click="vm.schemeName= x.schemeName;vm.schemeCode= x.schemeCode;vm.schemeStatus= x.schemeStatus;"
                                    data-bs-dismiss="modal"
                                >
                                    <td>{{x.schemeName}}</td>
                                    <td>{{x.schemeStatus}}</td>

                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
                <div class="list_wrapper" ng-if="vm.schemeList.length==0">
                    No records found to display.
                </div>
            </div>
        </div>
    </div>
</div>
