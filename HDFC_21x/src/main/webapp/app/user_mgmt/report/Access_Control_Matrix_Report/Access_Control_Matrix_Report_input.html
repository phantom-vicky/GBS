<div class="container from_wrapper new_form_wrapper">
    <div class="loader-new" ng-if="vm.loader"></div>

    <h4 class="form_heading">Access Control Matrix Report</h4>
<!--    <div class="row">-->
<!--        <sol-header></sol-header>-->
<!--    </div>    -->
    <form name="Access_Control_Matrix_Report" role="form">
        <div class="row">
            <div class="col-sm-6 col-sm-offset-3">
                <div class="row">
                    <div class="form-group ">
                        <div class="col-sm-6">
                            <label for="branchId" class="control-label">Branch Id</label>
                        </div>
                        <div class="col-sm-6">
                            <input type="text" class="form-control" id="branchId"
                                   ng-model="vm.branchId"   maxlength="25" >
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="form-group ">
                        <div class="col-sm-6">
                            <label class="control-label">Branch Name</label>
                        </div>
                        <div class="col-sm-6">
                            <input type="text" class="form-control" id="branchDesc"
                                   ng-model="vm.branchDesc"   maxlength="25" >
                        </div>
                    </div>
                </div>

                <div class="row ">
                    <div class="form-group">
                        <div class="col-sm-6">
                            <label for="roleName" class="control-label">Role Name</label>
                        </div>
                        <div class="col-sm-4">
                            <input type="text" class="form-control" id="roleName" ng-model="vm.searchroleName" chars="only-numbers" maxlength="25" readonly>
                        </div>
                        <div class="col-sm-2">
                            <i class="glyphicon glyphicon-search cp" data-bs-toggle="modal" id="roleNameSearcher" ng-click="vm.getroleName();vm.searchroleName = '';"></i>
                            <i class="glyphicon glyphicon-remove clear cp" ng-click="vm.searchroleName='';"></i>
                        </div>

                    </div>
                </div>

                <!--Submit and Cancel Button-->
                <div class="row">
                    <div class="text-center form_submit">
                        <button type="submit" class="btn btn-default" id="submitButton" ng-disabled="Access_Control_Matrix_Report.$invalid" ui-sref="Access_Control_Matrix_Report.inquiry_details({obj:{
								branchId : vm.searchBranchId,
								branchName : vm.branchName,
								roleName : vm.searchroleName
                                }})">Submit
                        </button>
                        <button type="button" class="btn btn-cancel" id="cancel" onclick="window.location.href= '#!/report_menu_page';">Cancel</button>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>



<div class="modal" id="roleNameSearcherPopUp" role="dialog">
    <div class="modal-dialog">
        <!-- Modal content-->
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-bs-dismiss="modal">&times;</button>
                <h4 class="modal-title">Role Name</h4>
            </div>
            <div class="modal-body">
                <div class="loader_popup"></div>
                <div class="list_wrapper" ng-if="vm.roleNameList.length>0">
                    <div class="col-sm-8 form_submit">
                        <div class="form-group">
                            <div class="input-group">
                                <div class="input-group-addon">
                                    <i class="glyphicon glyphicon-search"></i>
                                </div>
                                <input type="text" class="form-control" ng-model="vm.searchroleName" ng-init="vm.searchroleName = ''" placeholder="Search"  chars="alpha-numeric"oninput="this.value = this.value.replace(/\s+/g, '').replace(/[^a-zA-Z0-9]/g, '')">
                            </div>
                        </div>
                    </div>
                    <div class="col-sm-4 form_submit"></div>
                    <div class="row">

                        <div class="col-sm-12">
                            <table class="table table-bordered list scroll">
                                <thead ng-init="reverseOrder = false; sortedColumn = 'branchId'">
                                <tr>
                                    <th class="modal-title title-case" ng-click="(sortedColumn == 'roleName')?(reverseOrder=(!reverseOrder)): (reverseOrder = false);sortedColumn = 'roleName';" ng-class="(sortedColumn == 'roleName')?((reverseOrder)?('arrow-down') : ('arrow-up') ) : ('')">Role Name</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr class="cp"
                                    ng-repeat="x in vm.roleNameList | filter:vm.searchroleName | orderBy:sortedColumn:reverseOrder"
                                    ng-click="vm.searchroleName = x.roleName;" data-bs-dismiss="modal">
                                    <td>{{x.roleName}}</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
                                <div class="list_wrapper" ng-if="vm.roleNameList.length==0">No records found to display.</div>
            </div>

        </div>
    </div>
</div>
