<div class="loader-new" ng-if="vm.loader"></div>
<dc-left-menu></dc-left-menu>
<div class="container from_wrapper new_form_wrapper">

    <h4 class="form_heading">TOC Slab Maintenance - Add</h4>
    <sol-header></sol-header>
    <form name="tocSlabMaintenanceForm" role="form">

        <div class="row">
            <div class="form-group required">
                <div class="col-sm-3"></div>
                <div class="col-sm-3">
                    <label for="moduleName" class="control-label">Module Name</label>
                </div>
                <div class="col-sm-2">
                    <select class="form-control" id="moduleName" name="moduleName"
                            ng-model="vm.moduleId"
                            ng-init="vm.getModuleName();"  ng-change="vm.checkRecordExisted();" required>
                        <option value="" >Select</option>
                        <option ng-repeat="item in vm.moduleNameList" ng-hide="item.subCode == 'ALL'" value="{{item.subCode}}">{{item.subCodeDescription}}</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="form-group required">
                <div class="col-sm-3"></div>
                <div class="col-sm-3">
                    <label for="versionNo" class="control-label">Version No</label>
                </div>
                <div class="col-sm-2">
                    <input type="text" class="form-control" id="versionNo"
                           ng-model="vm.versionNo" ng-init="vm.versionNo='00001'"readonly>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="form-group required">
                <div class="col-sm-3"></div>
                <div class="col-sm-3">
                    <label for="effFromDate" class="control-label">Effective From Date</label>
                </div>
                <div class="col-sm-2">
                    <p class="input-group">
                        <input type="text" class="form-control" id="effFromDate"
                               name="effFromDate" ng-model="vm.effFromDate"
                               uib-datepicker-popup="dd/MM/yyyy" ng-init="vm.effFromDate=''"
                               datepicker-options="vm.dateOptions"
                               is-open="vm.effFromDatePicker.opened" close-text="Close"
                               maxlength="10" readonly required>
                        <span class="input-group-btn">
                            <button type="button" class="btn btn-secondary"
                                    ng-click="vm.effFromDatePicker.opened = true"
                                    id="effFromDateSearcher">
                                <i class="glyphicon glyphicon-calendar"></i>
                            </button>
                        </span>
                    </p>
                </div>
            </div>
        </div>

        <div class="text-center form_submit">
            <button type="submit" id="submitbutton" class="btn btn-default"
                    ui-sref="common_toc_slab_maintenance.add_detail({obj:{
                                    moduleId: vm.moduleId,
                                    versionNo: vm.versionNo,
                                    effFromDate: vm.effFromDate
								}})"
                    ng-disabled="tocSlabMaintenanceForm.$invalid">Submit</button>
            <button type="button" class="btn btn-cancel" id="cancelButton"
                    onclick="window.location.href= '#!/common_toc_slab_maintenance/action/inquiry';">Cancel
            </button>
        </div>

        <div class="text-center">
            <notice-message-directive></notice-message-directive>
        </div>
    </form>
</div>
