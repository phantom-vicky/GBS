 <div class="loader-new" ng-if="vm.loader"></div>
<dc-left-menu></dc-left-menu>
<div class="container from_wrapper new_form_wrapper">
    <h4 class="form_heading">RBI Bond TOC Sharing Maintenance - Add</h4>
    <sol-header></sol-header>
    <form name="tocSharingMaintenanceForm" role="form">
        <div class="row">
            <div class="form-group">
                <div class="col-sm-3"></div>
                <div class="col-sm-3">
                    <label  class="control-label">Name of the Module</label>
                </div>
                <div class="col-sm-5">
                    <label><b>RBI Bond</b></label>
                </div>
            </div>
        </div>


        <div class="row">
            <div class="form-group">
                <div class="col-sm-3"></div>
                <div class="col-sm-3">
                    <label class="control-label">Name of the Bond Scheme</label>
                </div>
                <div class="col-sm-4">
                    <label class="text-initial">{{vm.schemeCode | getLabelFromValuesArray : vm.moduleNameDetailsLabelValue}}</label>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <div class="col-sm-3"></div>
                <div class="col-sm-3">
                    <label class="control-label">Version No</label>
                </div>
                <div class="col-sm-4">
                    <label>{{vm.versionNo}}</label>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <div class="col-sm-3"></div>
                <div class="col-sm-3">
                    <label class="control-label">Effective From Date</label>
                </div>
                <div class="col-sm-4">
                    <label>{{vm.effFromDate | date : 'dd/MM/yyyy'}}</label>
                </div>
            </div>
        </div>

        <div class="row" ng-repeat="item in vm.levelDetailsTocSharingDto">
            <div class="form-group required">
                <div class="col-sm-3"></div>
                <div class="col-sm-3">
                    <label for="sharingPercentage{{$index}}" class="control-label">Sharing of {{item.levelName}} %</label>
                </div>
                <div class="col-sm-2">
                    <input type="text" class="form-control text-right" name="sharingPercentage{{$index}}" chars="float"  id="sharingPercentage{{$index}}" ng-change="vm.calculateSum();vm.decimalConvert(item.sharingPercentage, $index, $event)" ng-model="item.sharingPercentage" maxlength="5" required>
                    <span class="alert-danger" name="errorMsg{{$index}}" ng-show="vm.errorMsg[{{$index}}]">Entered Valid Input</span>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <div class="col-sm-3"></div>
                <div class="col-sm-3">
                    <label for="total" class="control-label">Total %</label>
                </div>
                <div class="col-sm-2">
                    <input type="text" class="form-control text-right" id="total" ng-init="vm.calculateSum();"
                           chars="float" maxlength="5" ng-model="vm.total" readonly>
                </div>
            </div>
        </div>

        <div class="row" >
            <div class="form-group required">
                <div class="col-sm-3"></div>
                <div class="col-sm-3">
                    <label  class="control-label">Rounding Factor</label>
                </div>

<!--                    <select class="form-control" id="roundOff[$index]" name="roundOff"-->
<!--                            ng-model="item.roundOff" ng-init="vm.getRoundFactList();" required>-->
<!--                        <option value="">Select</option>-->
<!--                        <option ng-repeat="items in vm.roudingFactorList;" value="{{items.SUBCODE}}">{{items.DESCRIPTION}}</option>-->
<!--                    </select>-->
                    <div class="col-sm-2">
                        <select class="form-control" id="roundFactor" name="roundFactor"
                                ng-model="vm.roundOffValue" required>
                            <option value="" hidden="true">Select</option>
                            <option ng-repeat="items in vm.roudingFactorList" value="{{items.SUBCODE}}" >{{items.DESCRIPTION}}</option>
                        </select>
                    </div>

            </div>
        </div>

        <div class="text-center form_submit">
            <button type="submit" class="btn btn-default" id="submitButton"
                    ng-disabled="tocSharingMaintenanceForm.$invalid" ng-click="vm.submitAddForm()">Submit</button>
            <button type="button" id="cancelButton" class="btn btn-cancel"
                    ng-click="vm.showCancelConfirmation('rbi_bond_toc_share_maintanance.add');">Cancel
            </button>
        </div>

        <div class="text-center">
            <notice-message-directive></notice-message-directive>
        </div>


    </form>
</div>
