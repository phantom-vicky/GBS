<div class="loader-new" ng-if="vm.loader"></div>
<dc-left-menu></dc-left-menu>
<div class="container from_wrapper new_form_wrapper">
    <h4 class="form_heading">{{vm.screenModule}} TOC Sharing Maintenance - Modify</h4>
    <sol-header></sol-header>
    <form name="tocSharingMaintenanceForm" role="form">

        <div class="row">
            <div class="form-group">
                <div class="col-sm-3"></div>
                <div class="col-sm-3">
                    <label class="control-label">Module</label>
                </div>
                <div class="col-sm-4">
                    <label style="text-transform: uppercase;">{{vm.moduleId | getLabelFromValuesArray : vm.moduleNameDetailsLabelValue}}</label>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <div class="col-sm-3"></div>
                <div class="col-sm-3">
                    <label class="control-label">Version No</label>
                </div>
                <div class="col-sm-4">
                    <label>{{vm.versionNo}}</label>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="form-group required">
                <div class="col-sm-3"></div>
                <div class="col-sm-3">
                    <label class="control-label">Effective from date</label>
                </div>
                <div class="col-sm-2">
                    <p class="input-group">
                        <input type="text" class="form-control" id="effFromDate"
                               name="effFromDate" ng-model="vm.effeFromDate"
                               uib-datepicker-popup="dd/MM/yyyy" ng-init="vm.dateValidationForModify();"
                               datepicker-options="vm.effFromDateOptions"
                               is-open="vm.effFromDateOptions.opened" close-text="Close"
                               maxlength="10" readonly required>
                        <span class="input-group-btn">
                            <button type="button" class="btn btn-secondary"
                                    ng-click="vm.effFromDateOptions.opened = true"
                                    id="effFromDateSearcher">
                                <i class="glyphicon glyphicon-calendar"></i>
                            </button>
                        </span>
                    </p>
                </div>
            </div>
        </div>

        <div class="row" ng-repeat="item in vm.levelDetailsTocSharingDto">
            <div class="form-group required">
                <div class="col-sm-3"></div>
                <div class="col-sm-3">
                    <label for="sharingPercentage{{$index}}" class="control-label">Sharing of {{item.C003.oldValue}} %</label>
                </div>
                <div class="col-sm-2">
                    <input type="text" class="form-control text-right" name="sharingPercentage{{$index}}" id="sharingPercentage{{$index}}" ng-change="vm.calculateSumForModify();" chars="float" ng-blur="vm.decimalConvertForModify(item.C007.oldValue, $index, $event)" ng-model="item.C007.oldValue" maxlength="5" required>
                    <span class="alert-danger" name="errorMsg{{$index}}" ng-show="vm.errorMsg[{{$index}}]">Entered Input should not exceed 100</span>
                </div>
            </div>
        </div>



        <div class="row">
            <div class="form-group">
                <div class="col-sm-3"></div>
                <div class="col-sm-3">
                    <label for="total" class="control-label">Total %</label>
                </div>
                <div class="col-sm-2">
                    <input type="text" class="form-control text-right" id="total"
                           chars="float" maxlength="5" ng-model="vm.total" readonly>
                </div>
            </div>
        </div>

        <div class="row" >
            <div class="form-group required">
                <div class="col-sm-3"></div>
                <div class="col-sm-3">
                    <label for="roundFactor" class="control-label">Rounding Factor</label>
                </div>
                <div class="col-sm-2">
                    <select class="form-control" id="roundFactor" name="roundFactor"
                            ng-model="vm.roundOffValue" required>
                        <option value="" hidden="true">Select</option>
                        <option ng-repeat="items in vm.roundOff" value="{{items.value}}" ng-bind="items.label"></option>
                    </select>
                </div>
            </div>
        </div>
        <div class="row" >
            <div class="form-group required">
                <div class="col-sm-3"></div>
                <div class="col-sm-3">
                    <span> <b> Verify Status </b> :</span>
                </div>
                <div class="col-sm-2">
                    <span style="text-transform: uppercase;">{{vm.verifiedStatus | getLabelFromValuesArray : vm.commonYesNoMetaData}}</span>
                </div>
            </div>
        </div>
        <div class="text-center form_submit">
            <button type="submit" class="btn btn-default" id="submitButton"
                    ng-disabled="tocSharingMaintenanceForm.$invalid || tocSharingMaintenanceForm.$pristine" ng-click="vm.modifySubmit()">Submit</button>
            <button type="button" id="cancelButton" class="btn btn-cancel"
                    ng-click="vm.showCancelConfirmation();">Cancel
            </button>
        </div>

        <div class="text-center">
            <notice-message-directive></notice-message-directive>
        </div>

    </form>
</div>
