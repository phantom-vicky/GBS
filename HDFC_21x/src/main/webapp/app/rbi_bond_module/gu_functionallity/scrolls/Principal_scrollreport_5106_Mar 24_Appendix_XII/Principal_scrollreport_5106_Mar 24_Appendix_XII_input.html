<div class="loader-new" ng-if="vm.loader"></div>
<div class="container from_wrapper new_form_wrapper">

    <h4 class="form_heading">Principal scrollreport 5106 Appendix XII</h4>
    <sol-header></sol-header>
    <form name="bondPrincipalRepayFrom" role="form">



        <div class="row">
            <div class="form-group required">

                <div class="col-sm-3"></div>
                <div class="col-sm-3">
                    <label for="schemeCode" class="control-label">Name of the Bond Scheme</label>
                </div>
                <div class="col-sm-2">
                    <input type="text" class="form-control" id="schemeCode"
                           ng-model="vm.schemeName"
                           chars="alpha-numeric" readonly required>
                </div>
                <div class="col-sm-2">
                    <i class="glyphicon glyphicon-search cp" data-bs-toggle="schemeCode"
                       id="treasurySearch"
                       ng-click="vm.getModuleName();"></i> <i
                        class="glyphicon glyphicon-remove clear cp"
                        ng-click="vm.schemeCode ='';vm.schemeName =''"></i>
                </div>

            </div>
        </div>
        <div class="row">
            <div class="form-group required">
                <div class="col-sm-3"></div>
                <div class="col-sm-3">
                    <label  class="control-label">From Date (dd/mm/yyyy)</label>
                </div>
                <div class="col-sm-2">
                    <p class="input-group">
                        <input type="text" class="form-control" id="effFromDate"
                               name="effFromDate" ng-model="vm.fromDate"
                               uib-datepicker-popup="dd/MM/yyyy" ng-init="vm.fromDate='';vm.dateValidation();"
                               datepicker-options="vm.dateOptions" ng-change="vm.dateValidation();"
                               is-open="vm.effFromDatePicker.opened" close-text="Close"
                               maxlength="10"
                               data-ng-blur="vm.textableDatePicker('effFromDate',vm.fromDate)"
                               data-ng-keyup="vm.autoslashing('effFromDate')" data-chars="numbers-slash"

                               required>
                        <span class="input-group-btn">
                            <button type="button" class="btn btn-secondary"
                                    ng-click="vm.effFromDatePicker.opened = true"
                                    id="effFromDateSearcher">
                                <i class="glyphicon glyphicon-calendar"></i>
                            </button>
                        </span>
                    </p>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="form-group required">
                <div class="col-sm-3"></div>
                <div class="col-sm-3">
                    <label  class="control-label">To Date (dd/mm/yyyy)</label>
                </div>
                <div class="col-sm-2">
                    <p class="input-group">
                        <input type="text" class="form-control" id="effToDate"
                               name="effToDate" ng-model="vm.toDate"
                               uib-datepicker-popup="dd/MM/yyyy" ng-init="vm.toDate=''"
                               datepicker-options="vm.dateToOptions"
                               is-open="vm.effToDatePicker.opened" close-text="Close"
                               maxlength="10"    data-ng-blur="vm.textableDatePickerTo('effToDate',vm.toDate,vm.fromDate)"
                               data-ng-keyup="vm.autoslashing('effToDate')" data-chars="numbers-slash"
                               required>

                        <span class="input-group-btn" ng-if="vm.fromDate">
                            <button type="button" class="btn btn-secondary"
                                    ng-click="vm.effToDatePicker.opened = true"
                                    id="effToDateSearcher">
                                <i class="glyphicon glyphicon-calendar"></i>
                            </button>
                        </span>
                    </p>
                </div>
            </div>
        </div>






        <div class="text-center form_submit">
            <button type="submit" id="submitbutton" class="btn btn-default"
                    ui-sref="Principal_scrollreport_5106_Mar_24_Appendix_XII.inquiry_details({obj:{
                            schemeCode:vm.schemeCode,
                            schemeName:vm.schemeName,
                            fromDate :vm.fromDate,
                            toDate :vm.toDate
                        }})"
                    ng-disabled="bondPrincipalRepayFrom.$invalid">Submit</button>
            <button type="button" class="btn btn-cancel" id="cancelButton"
                    onclick="window.location.href= '#!/rbibond_gu_functionality';">Cancel
            </button>
        </div>

        <div class="text-center">
            <notice-message-directive></notice-message-directive>
        </div>
    </form>
</div>

<div class="modal" id="schemeModel" role="dialog">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-bs-dismiss="modal" data-ng-click="vm.modalSearch = ''">&times;</button>
                <h4 class="modal-title">Scheme Code</h4>
            </div>
            <div class="modal-body">
                <div class="loader_popup"></div>
                <div class="list_wrapper" data-ng-if="vm.schemeList.length>0">
                    <div class="col-sm-8 form_submit">
                        <div class="form-group">
                            <div class="input-group">
                                <div class="input-group-addon">
                                    <span class="glyphicon glyphicon-search"></span>
                                </div>
                                <input type="text" class="form-control" data-ng-model="vm.modalSearch" data-ng-init="vm.modalSearch = ''" placeholder="Search" oninput="this.value = this.value.replace(/^\s+/, '').replace(/\s{2,}/g, ' ')"/>
                            </div>
                        </div>
                    </div>
                    <div class="col-sm-4 form_submit"></div>
                    <div class="row">
                        <div class="col-sm-12">
                            <table class="table table-bordered list scroll sort" aria-label="">
                                <thead data-ng-init="reverseOrder=true;sortedColumn = 'schemeName'">
                                <tr>
                                    <th
                                            scope="col"
                                            data-ng-click="(sortedColumn == 'schemeName')?(reverseOrder=(!reverseOrder)): (reverseOrder = false);sortedColumn = 'schemeName';"
                                            data-ng-class="(sortedColumn == 'schemeName')?((reverseOrder)?('arrow-down') : ('arrow-up') ) : ('')">
                                        SCHEME NAME
                                    </th>
                                    <th
                                            scope="col"
                                            data-ng-click="(sortedColumn == 'schemeStatus')?(reverseOrder=(!reverseOrder)): (reverseOrder = false);sortedColumn = 'schemeStatus';"
                                            data-ng-class="(sortedColumn == 'schemeStatus')?((reverseOrder)?('arrow-down') : ('arrow-up') ) : ('')">
                                        STATUS
                                    </th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr
                                        class="cp"
                                        data-ng-repeat="x in vm.schemeList | filter:vm.modalSearch | orderBy:sortedColumn:reverseOrder"
                                        data-ng-click="vm.schemeCode = x.schemeCode; vm.schemeName = x.schemeName; vm.schemeStatus = x.schemeStatus"
                                        data-bs-dismiss="modal">
                                    <td>{{x.schemeName}}</td>
                                    <td>{{x.schemeStatus}}</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
                <div class="list_wrapper" data-ng-if="vm.schemeList.length==0">No records found to display.</div>
            </div>
        </div>
    </div>
</div>
