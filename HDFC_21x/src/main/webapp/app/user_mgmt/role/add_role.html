<user-left-menu></user-left-menu>
<div class="loader">
</div>
<div class="container from_wrapper">
    <h4 class="form_heading">Add Role</h4>
    <form name="addRoleForm" role="form" ng-submit="vm.addRoleConfirmation()" novalidate>
        <notice-message-directive></notice-message-directive>
        <div class="row">
            <div class="form-group required">
                <div class="col-sm-3"></div>
                <label for="name" class="control-label col-sm-3">Role Name</label>
                <div class="col-sm-3">
                    <input type="text" class="form-control" name="name" id="name" ng-model="vm.role.name" maxlength="30" chars="only-letters" required>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="form-group">
                <div class="col-sm-3"></div>
                <label for="description" class="control-label col-sm-3">Role Description</label>
                <div class="col-sm-3">
                   <textarea class="form-control" id="description" name="description" ng-model="vm.role.description" maxlength="80"></textarea>
                </div>
            </div>
        </div>
        <div class="col-sm-offset-5 col-sm-8 form_submit">
            <button type="submit" id="submit" name="submit" class="btn btn-default" ng-disabled="addRoleForm.$invalid">Submit</button>
            <button type="button" id="cancel" name="cancel" class="btn btn-cancel" ng-click="vm.showCancelConfirmation()">Cancel</button>
        </div>
    </form>
</div>
