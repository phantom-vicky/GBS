<div class="loader-new" ng-if="vm.loader"></div>
<cbs-left-menu></cbs-left-menu>
<div class="container from_wrapper">
	<h4 class="form_heading  feature-heading">
		CBS Integration Bulk Upload
		</h4>
		<form name="cbsBulkUploadForm" role="form" enctype="multipart/form-data" novalidate>
			<div class="row">
				<div class="form-group required">
					<div class="col-sm-3"></div>
					<label for="functionality" class="control-label col-sm-3">Functionality</label>
					<div class="col-sm-3">
						<select class="form-control" id="functionality"
							name="functionality" ng-model="vm.cbsBulkUpload.functionality"
							ng-dropdown required>
							<option value="">Select Functionality</option>
							<option value="bankbranch">Branches of the Bank</option>
<!--							<option value="officeaccountplaceholder">Office account-->
<!--								Placeholder</option>-->
<!--							<option value="instruments">Instrument Details</option>-->
<!--							<option value="transactioncodes">List of Transaction-->
<!--								Codes</option>-->
							<option value="otherbankdetails">Other Bank details</option>
							<option value="otherbankbranches">Branches of Other Bank</option>
							<option value="calendarentries">Maintenance of Calendar
								Entries</option>
<!--							<option value="schemecodes">Scheme Codes</option>-->
<!--							<option value="userdetails">User Work Class Information</option>-->
<!--							<option value="branchifscdetails">Branch IFSC Codes</option>-->
						</select>
					</div>
				</div>
			</div>
			<div class="row">
				<div class="form-group required">
					<div class="col-sm-3"></div>
					<label for="hierarchyFile" class="control-label col-sm-3">Upload
						File Name</label>
					<div class="col-sm-3">
						<input id="file" name="file" type="file"
							ng-model="vm.cbsBulkUpload.file" file-model="vm.file"
							   accept=".xls, .xlsx, application/vnd.ms-excel, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" runat="server" required
							valid-file>
						<!-- <input type="file" class="form-control" id="file" name="file" ng-model="hierarchyBulkUpload.file"  required>
				          <button type="submit" class="btn btn-default">Browse</button>   -->
					</div>
				</div>
			</div>

			<div class="col-sm-offset-5 col-sm-8 form_submit">
				<button type="submit" class="btn btn-default" id="uploadButton"
					ng-disabled="cbsBulkUploadForm.$invalid"
					ng-click="vm.uploadFile();">Upload</button>
				<button type="submit" class="btn btn-cancel" id="cancelButton"
					 ng-click="vm.showCancelConfirmation('cbs_bulk_upload.list');">Cancel</button>
			</div>
			<div class="text-center">
				<notice-message-directive></notice-message-directive>
			</div>
		</form>
</div>
