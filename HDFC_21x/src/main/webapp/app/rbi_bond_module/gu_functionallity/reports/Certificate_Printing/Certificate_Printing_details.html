<div class="loader-new" ng-if="vm.loader"></div>
<div class="container">
    <div class="container from_wrapper new_form_wrapper">
        <div class="text-right form_submit">
            <button type="submit" class="btn btn-default"
                    onclick="window.location.href ='#!/';" id="homeButton">Home
            </button>
            <button type="button" id="cancel_Button" class="btn btn-cancel"
                    onclick="window.location.href= '#!/Certificate_Printing/action/inquiry';"
            >Back
            </button>
        </div>
        <div class="row">
            <h4 class="form_heading">Certificate Of Printing</h4>
            <sol-header></sol-header>
            <table style="width:100%" class="table table-bordered" style="padding: 10px"
                   aria-label="Call back report name table">
                <tr>



                    <th scope="" style="width:25%">Name of the Module</th>
                    <td style="width:25%">{{vm.moduleName}}</td>

                    <th scope="" style="width:25%">Name of the Bond Scheme</th>
                    <td style="width:45%">{{vm.schemeName}}</td>

                </tr>
                <tr>

                    <th scope="" style="width:20%">Value Date</th>
                    <td style="width:20%">{{vm.valueDate | date:'dd/MM/yyyy'}}</td>
                    <th scope="" style="width:25%">Total Count of Records</th>
                    <td style="width:35%">{{vm.dataList}}</td>
                </tr>
<!--                <tr>-->
<!--                    <td colspan="4">-->
<!--                        <button type="button" class="btn btn-default"  style="text-align:left;" ng-click=" vm.getDetails('D')">Download</button>-->
<!--                        <button type="button" class="btn btn-default"  style="text-align:right;"ng-click=" vm.getDetails('S')">SFTP</button>-->
<!--                    </td>-->
<!--                </tr>-->

                <tr>
                    <td colspan="4">


                            <div class="text-center form_submit">

                            <button type="button"
                                    class="btn btn-default"
                                    ng-click="vm.getDetails('D')">
                                Download
                            </button>

                            <button type="button"
                                    class="btn btn-success"
                                    ng-click="vm.getDetails('S')">
                                SFTP
                            </button>

                        </div>

                    </td>
                </tr>
            </table>
        </div>


    </div>
</div>
<div class="container" ng-if="vm.noDataFound">
    <div class="list_wrapper no_records_message">
        <h4 class="form_heading">Call Back Report</h4>
        No records found to display.
        <center>
            <button type="button" class="btn btn-default"
                    onclick="window.location.href= '#!/callback_report/action/inquiry';">
                Back
            </button>
        </center>
    </div>
</div>
