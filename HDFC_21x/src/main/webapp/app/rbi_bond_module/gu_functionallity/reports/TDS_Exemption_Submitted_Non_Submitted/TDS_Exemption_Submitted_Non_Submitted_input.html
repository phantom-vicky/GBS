<div class="loader-new" data-ng-if="vm.loader"></div>
<div class="container from_wrapper new_form_wrapper">
  <h4 class="form_heading">TDS Exemption Submitted / Non-Submitted Report</h4>
  <sol-header></sol-header>
  <form name="TDSExemptionSubmitForm" role="form">

    <div class="row">
      <div class="form-group">
        <div class="col-sm-3"></div>
        <div class="col-sm-3">
          <label class="control-label">Name of the Module</label>
        </div>
        <div class="col-sm-5">
          <label><b>RBI Bond</b></label>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="form-group">
        <div class="col-sm-3"></div>
        <div class="col-sm-3"><label>BOD Date</label></div>
        <div class="col-sm-2">
          <label><strong>{{vm.solDate}}</strong></label>
        </div>
      </div>
    </div>

    <div class="row">
      <div class="form-group">
        <div class="col-sm-3"></div>
        <div class="col-sm-3"><label for="panNum" class="control-label">PAN No</label></div>
        <div class="col-sm-2">
          <input
            type="text"
            class="form-control"
            id="panNum"
            data-ng-model="vm.panNumber"
            data-ng-init="vm.panNumber= ''; "
            data-chars="alpha-numeric"
            minlength="4"
            maxlength="10"
            oninput="this.value = this.value.replace(/\s+/g, '').replace(/[^a-zA-Z0-9]/g, '')"
          />
        </div>

        <div class="col-sm-2" style="display: flex; align-items: center; height: 34px; gap: 5px; padding-left: 0">
          <span class="glyphicon glyphicon-search cp" data-bs-toggle="modal" id="panTreasurySearch" data-ng-click="vm.getPanNumber();"></span>
          <span class="glyphicon glyphicon-remove clear cp" data-ng-click="vm.panNumber ='';"></span>
        </div>
      </div>
    </div>

    <div class="row">
      <div class="form-group required">
        <div class="col-sm-3"></div>
        <div class="col-sm-3">
          <label class="control-label">Status</label>
        </div>
        <div class="col-sm-2">
          <select class="form-control" id="status" name="status" data-ng-model="vm.status" data-ng-init="vm.status=''" data-ng-change="vm.statusDescription = vm.getStatusDescription(vm.status)" required>
            <option value="">Select</option>
            <option value="S">Submitted List</option>
            <option value="NS">Non-Submitted List</option>
            <option value="A">All</option>
          </select>
        </div>
      </div>
    </div>

    <div class="row">
      <div class="form-group required">
        <div class="col-sm-3"></div>
        <div class="col-sm-3"><label class="control-label">From Date</label></div>
        <div class="col-sm-2">
          <p class="input-group">
            <input
              type="text"
              class="form-control"
              id="effFromDate1"
              name="effFromDate"
              data-ng-model="vm.fromDate"
              data-uib-datepicker-popup="dd/MM/yyyy"
              data-ng-init="vm.fromDate=''; vm.fromDateVal()"
              data-ng-change="vm.toDateVal(vm.fromDate); vm.toDate=''"
              data-datepicker-options="vm.fromDateOptions"
              data-is-open="vm.effFromDatePicker.opened"
              data-close-text="Close"
              maxlength="10"
              ng-blur="vm.textableDatePicker('effFromDate1',vm.fromDate)"
              ng-keyup="vm.autoslashing('effFromDate1')" chars="numbers-slash"
              required
            />
            <span class="input-group-btn">
              <button type="button" class="btn btn-secondary" data-ng-click="vm.effFromDatePicker.opened = true" id="effFromDateSearcher1">
                <span class="glyphicon glyphicon-calendar"></span>
              </button>
            </span>
          </p>
        </div>
      </div>
    </div>

    <div class="row">
      <div class="form-group required">
        <div class="col-sm-3"></div>
        <div class="col-sm-3"><label class="control-label">To Date</label></div>
        <div class="col-sm-2">
          <p class="input-group">
            <input
              type="text"
              class="form-control"
              id="effToDate"
              name="effToDate"
              data-ng-model="vm.toDate"
              data-uib-datepicker-popup="dd/MM/yyyy"
              data-ng-init="vm.toDate=''"
              data-datepicker-options="vm.toDateOptions"
              data-is-open="vm.effToDatePicker.opened"
              data-close-text="Close"
              maxlength="10"
              ng-blur="vm.textableDatePicker('effToDate',vm.toDate)"
              ng-keyup="vm.autoslashing('effToDate')" chars="numbers-slash"
              required
            />
            <span class="input-group-btn" data-ng-if="vm.fromDate">
              <button type="button" class="btn btn-secondary" data-ng-click="vm.effToDatePicker.opened = true" id="effToDateSearcher">
                <span class="glyphicon glyphicon-calendar"></span>
              </button>
            </span>
          </p>
        </div>
      </div>
    </div>

    <div class="text-center form_submit">
      <button
        type="submit"
        id="submitButton"
        class="btn btn-default"
        data-ui-sref="TDS_Exemption_Submitted_Non_Submitted.inquiry_details({obj:{
                            panNumber           :   vm.panNumber,
                            status              :   vm.status,
                            statusDescription   :   vm.statusDescription,
                            fromDate            :   vm.fromDate,
                            toDate              :   vm.toDate
                        }})"
        data-ng-disabled="TDSExemptionSubmitForm.$invalid"
      >
        Submit
      </button>
      <button type="button" class="btn btn-cancel" id="cancelButton" onclick="window.location.href= '#!/rbibond_gu_functionality';">Cancel</button>
    </div>
    <div class="text-center">
      <notice-message-directive></notice-message-directive>
    </div>
  </form>
</div>

<div class="modal" id="panModel" role="dialog">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <button type="button" class="close" data-bs-dismiss="modal" data-ng-click="vm.PANSearch=''">&times;</button>
        <h4 class="modal-title">PAN No</h4>
      </div>
      <div class="modal-body">
        <div class="loader_popup"></div>
        <div class="list_wrapper" data-ng-if="vm.PanTorch.length>0">
          <div class="col-sm-8 form_submit">
            <div class="form-group">
              <div class="input-group">
                <div class="input-group-addon">
                  <span class="glyphicon glyphicon-search"></span>
                </div>
                <input type="text" class="form-control" data-ng-model="vm.PANSearch" data-ng-init="vm.PANSearch = ''" placeholder="Search" data-chars="alpha-numeric" oninput="this.value = this.value.replace(/^\s+/, '').replace(/\s{2,}/g, ' ')" />
              </div>
            </div>
          </div>
          <div class="col-sm-4 form_submit"></div>
          <div class="row">
            <div class="col-sm-12">
              <table class="table table-bordered list scroll sort" aria-label="TDS">
                <thead data-ng-init="reverseOrder=false;sortedColumn = 'panNum'">
                  <tr>
                    <th
                      scope="col"
                      data-ng-click="(sortedColumn == 'panNumber')?(reverseOrder=(!reverseOrder)): (reverseOrder = false);sortedColumn = 'panNumber';"
                      data-ng-class="(sortedColumn == 'panNumber')?((reverseOrder)?('arrow-down') : ('arrow-up') ) : ('')">
                      PAN No
                    </th>
                    <th
                      scope="col"
                      data-ng-click="(sortedColumn == 'holderName')?(reverseOrder=(!reverseOrder)): (reverseOrder = false);sortedColumn = 'holderName';"
                      data-ng-class="(sortedColumn == 'holderName')?((reverseOrder)?('arrow-down') : ('arrow-up') ) : ('')">
                      Holder Name
                    </th>
                  </tr>
                </thead>
                <tbody>
                  <tr class="cp" data-ng-repeat="x in vm.PanTorch | filter:vm.PANSearch | orderBy:sortedColumn:reverseOrder" data-ng-click="vm.panNumber= x.panNumber; vm.bondHolderName= x.holderName;" data-bs-dismiss="modal">
                    <td>{{x.panNumber}}</td>
                    <td>{{x.customerName}}</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
        <div class="list_wrapper" data-ng-if="vm.PanTorch.length==0">No records found to display.</div>
      </div>
    </div>
  </div>
</div>
