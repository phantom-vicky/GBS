<div class="container from_wrapper" data-ng-repeat="item in childMenuParams | orderBy: 'item.orderId'">
	<h4 class="form_heading">{{item.linkName}}</h4>
	<ul>
		<li data-ng-repeat="items in item.children | orderBy: 'items.orderId'"><strong>{{items.linkName}}</strong>
			<ul>
				<li data-ng-repeat="menus in items.children | orderBy: 'menus.orderId'">
					<a ui-sref="{{menus.menuUrl}}">{{menus.linkName}}</a>
				</li>
			</ul>
<!--			<ul>-->
<!--				<li >-->
<!--					<a ui-sref="User_Activity_Report.inquiry">User Activity Report</a>-->
<!--				</li>-->
<!--			</ul>-->
		</li>
	</ul>
</div>
