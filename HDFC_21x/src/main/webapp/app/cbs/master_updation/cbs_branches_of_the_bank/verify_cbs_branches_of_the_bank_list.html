<div class="loader-new" ng-if="vm.loader"></div>
<cbs-left-menu></cbs-left-menu>
<div class="container from_wrapper new_form_wrapper">
	<h4 class="form_heading  feature-heading">Branches Of the Bank -
		Verify/Reject</h4>
	<form name="branchesOfTheBankForm" role="form">

		<div class="row">
			<div class="form-group required">
				<div class="col-sm-3">	</div>

				<label for="solId" class="control-label col-sm-3">Sol ID</label>
				<div class="col-sm-2">
					<input type="text" class="form-control" id="solId"
						   ng-model="vm.solId"  readonly required>
				</div>
				<div class="col-sm-1">
					<i class="glyphicon glyphicon-search cp" data-bs-toggle="modal"
					   id="roleSearch"
					   ng-click="vm.getVerDelDetails();"></i> <i
						class="glyphicon glyphicon-remove clear cp"
						ng-click="vm.solId='';"></i>
				</div>
			</div>
		</div>

			<div class="text-center form_submit">
				<button   ng-disabled="branchesOfTheBankForm.$invalid" type="submit" class="btn btn-default" id="submitButton"
						  ui-sref="cbs_branches_of_the_bank.verify_detail({obj:{
                                    solId: vm.solId
								}})">Submit</button>
				<button type="button" class="btn btn-cancel"
						onclick="window.location.href= '#!/cbs_branches_of_the_bank/action/inquiry';" id="cancelButton">Cancel</button>
			</div>
			<div class="text-center">
				<notice-message-directive></notice-message-directive>
			</div>

	</form>
</div>


<div class="modal" id="solIdModal" role="dialog">
	<div class="modal-dialog">
		<!-- Modal content-->
		<div class="modal-content">
			<div class="modal-header">
				<button type="button" class="close" data-bs-dismiss="modal">&times;</button>
				<h4 class="modal-title">SolId</h4>
			</div>
			<div class="modal-body">
				<div class="loader_popup"></div>
				<div class="list_wrapper" ng-if="vm.result.length>0">
					<div class="col-sm-8 form_submit">
						<div class="form-group">
							<div class="input-group">
								<div class="input-group-addon">
									<i class="glyphicon glyphicon-search"></i>
								</div>
								<input type="text" class="form-control"
									   ng-model="vm.solId" ng-init="vm.solId = ''"
									   placeholder="Search">
							</div>
						</div>
					</div>
					<div class="col-sm-4 form_submit"></div>
					<div class="row">
						<div class="col-sm-12">
							<table class="table table-bordered list scroll">
								<thead ng-init="reverseOrder = false; sortedColumn = 'scssCustomerId'">
								<tr>
									<!--                                    <th class="modal-title title-case" ng-click="(sortedColumn == 'roleId')?(reverseOrder=(!reverseOrder)): (reverseOrder = false);sortedColumn = 'roleId';" ng-class="(sortedColumn == 'roleId')?((reverseOrder)?('arrow-down') : ('arrow-up') ) : ('')">Id</th>-->
									<th class="modal-title title-case" ng-click="(sortedColumn == 'solId')?(reverseOrder=(!reverseOrder)): (reverseOrder = false);sortedColumn = 'solId';" ng-class="(sortedColumn == 'solId')?((reverseOrder)?('arrow-down') : ('arrow-up') ) : ('')">Sol ID</th>
									<th class="modal-title title-case" ng-click="(sortedColumn == 'solDesc')?(reverseOrder=(!reverseOrder)): (reverseOrder = false);sortedColumn = 'solDesc';" ng-class="(sortedColumn == 'solDesc')?((reverseOrder)?('arrow-down') : ('arrow-up') ) : ('')">Sol Description</th>
								</tr>
								</thead>
								<tbody>
								<tr class="cp"
									ng-repeat="x in vm.result | filter:vm.solId | orderBy:sortedColumn:reverseOrder"
									ng-click="vm.solId = x.solId;" data-bs-dismiss="modal">
									<!--                                    <td>{{x.roleId}}</td>-->
									<td>{{x.solId}}</td>
									<td>{{x.solDesc}}</td>
								</tr>
								</tbody>
							</table>
						</div>
					</div>
				</div>
				<div class="list_wrapper" ng-if="vm.result.length==0">No records found to display.</div>
			</div>
		</div>
	</div>
</div>
