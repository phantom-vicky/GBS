<div class="loader-new" ng-if="vm.loader"></div>
<div class="container from_wrapper new_form_wrapper">
    <h4 class="form_heading">Tax Waiver Documents Report</h4>
    <sol-header></sol-header>
    <form name="TaxWaiverDocumentsReportForm" role="form">
        <div class="row">
            <div class="form-group">
                <div class="col-sm-3"></div>
                <div class="col-sm-3">
                    <label class="control-label">Name of the Module</label>
                </div>
                <div class="col-sm-5">
                    <label><b>RBI Bond</b></label>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="form-group required">
                <div class="col-sm-3"></div>
                <div class="col-sm-3">
                    <label for="moduleName" class="control-label">Name of the Bond Scheme</label>
                </div>
                <div class="col-sm-2">
                    <input type="text" class="form-control" id="moduleName" ng-model="vm.schemeName" required readonly
                           oninput="this.value = this.value.replace(/^\s+/, '').replace(/[^a-zA-Z\s]/g, '').replace(/\s{2,}/g, ' ')"
                    />
                </div>
                <div class="col-sm-2">
                    <i class="glyphicon glyphicon-search cp" data-bs-toggle="schemeName" id="treasurySearch" ng-click="vm.getModuleName();"></i> <i class="glyphicon glyphicon-remove clear cp" ng-click="vm.schemeCode ='';vm.schemeName =''"></i>
                </div>
            </div>
        </div>

        <div class="row" >
            <div class="form-group required">
                <div class="col-sm-3"></div>
                <div class="col-sm-3">
                    <label class="control-label">From Date(DD/MM/YYYY)</label>
                </div>
                <div class="col-sm-2">
                    <p class="input-group">
                        <input
                                type="text"
                                class="form-control"
                                id="effFromDate"
                                name="effFromDate"
                                ng-model="vm.fromDate"
                                uib-datepicker-popup="dd/MM/yyyy"
                                ng-init="vm.fromDate='';vm.dateValidation();"
                                datepicker-options="vm.dateOptions"
                                ng-change="vm.dateValidation();"
                                is-open="vm.effFromDatePicker.opened"
                                close-text="Close"
                                maxlength="10"
                                ng-blur="vm.textableDatePicker('effFromDate',vm.fromDate)"
                                ng-keyup="vm.autoslashing('effFromDate')" chars="numbers-slash"
                                required
                        />
                        <span class="input-group-btn">
              <button type="button" class="btn btn-secondary" ng-click="vm.effFromDatePicker.opened = true" id="effFromDateSearcher">
                <i class="glyphicon glyphicon-calendar"></i>
              </button>
            </span>
                    </p>
                </div>
            </div>
        </div>

        <div class="row" >
            <div class="form-group required">
                <div class="col-sm-3"></div>
                <div class="col-sm-3">
                    <label class="control-label">To Date(DD/MM/YYYY)</label>
                </div>
                <div class="col-sm-2">
                    <p class="input-group">
                        <input
                                type="text"
                                class="form-control"
                                id="effToDate"
                                name="effToDate"
                                ng-model="vm.toDate"
                                ng-change="vm.dateValidation();"
                                uib-datepicker-popup="dd/MM/yyyy"
                                ng-init="vm.toDate=''; vm.dateValidation();"
                                ng-keyup="vm.autoslashing('effToDate')"
                                datepicker-options="vm.dateToOptions"
                                is-open="vm.effToDatePicker.opened"
                                close-text="Close"
                                maxlength="10"   chars="numbers-slash"
                                required
                        />


                        <span class="input-group-btn" ng-if="vm.fromDate">
              <button type="button" class="btn btn-secondary" ng-click="vm.effToDatePicker.opened = true" id="effToDateSearcher">
                <i class="glyphicon glyphicon-calendar"></i>
              </button>
            </span>
                    </p>
                </div>
            </div>
        </div>


        <div class="text-center form_submit">
            <button
                    id="submitbutton"
                    class="btn btn-default"
                    ui-sref="pan_wise_interest_report.inquiry_details({obj:{
                            schemeCode:vm.schemeCode,
                            schemeName:vm.schemeName,
                            fromDate: vm.fromDate,
                            toDate:vm.toDate,
      }})"
                    ng-disabled="TaxWaiverDocumentsReportForm.$invalid"
            >
                Submit
            </button>
            <button type="button" class="btn btn-cancel" id="cancelButton" onclick="window.location.href= '#!/rbibond_gu_functionality';">Cancel</button>
        </div>

        <div class="text-center">
            <notice-message-directive></notice-message-directive>
        </div>
    </form>
</div>




<!--//bond scheme name-->
<div class="modal" id="schemeModel" role="dialog">
    <div class="modal-dialog">
        <!-- Modal content-->
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-bs-dismiss="modal" ng-click="vm.modalSearch=''">&times;</button>
                <h4 class="modal-title">Scheme Code</h4>
            </div>
            <div class="modal-body">
                <div class="loader_popup"></div>
                <div class="list_wrapper" ng-if="vm.schemeList.length>0">
                    <div class="col-sm-8 form_submit">
                        <div class="form-group">
                            <div class="input-group">
                                <div class="input-group-addon">
                                    <i class="glyphicon glyphicon-search"></i>
                                </div>
                                <input type="text" class="form-control" ng-model="vm.modalSearch" ng-init="vm.modalSearch = ''" placeholder="Search"
                                       oninput = "this.value = this.value.replace(/^\s+/, '').replace(/\s{2,}/g, ' ')"
                                />
                            </div>
                        </div>
                    </div>
                    <div class="col-sm-4 form_submit"></div>
                    <div class="row">
                        <div class="col-sm-12">
                            <table class="table table-bordered list scroll sort">
                                <thead ng-init="reverseOrder=true;sortedColumn = 'schemeName'">
                                <tr>
                                    <th scope="col" class="modal-title title-case" ng-show="false">Scheme Code</th>
                                    <th scope="col"
                                        class="modal-title title-case"
                                        ng-click="(sortedColumn == 'schemeName')?(reverseOrder=(!reverseOrder)): (reverseOrder = false);sortedColumn = 'schemeName';"
                                        ng-class="(sortedColumn == 'schemeName')?((reverseOrder)?('arrow-down') : ('arrow-up') ) : ('')"
                                    >
                                        Scheme Name
                                    </th>
                                    <th scope="col"
                                        class="modal-title title-case"
                                        ng-click="(sortedColumn == 'schemeStatus')?(reverseOrder=(!reverseOrder)): (reverseOrder = false);sortedColumn = 'schemeStatus';"
                                        ng-class="(sortedColumn == 'schemeStatus')?((reverseOrder)?('arrow-down') : ('arrow-up') ) : ('')"
                                    >
                                        Status
                                    </th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr class="cp" ng-repeat="x in vm.schemeList | filter:vm.modalSearch | orderBy:sortedColumn:reverseOrder" ng-click="vm.schemeCode = x.schemeCode; vm.schemeName = x.schemeName; vm.schemeStatus = x.SCHEME_STATUS" data-bs-dismiss="modal">
                                    <td style="display: none">{{x.
                                        schemeCode
                                        }}</td>
                                    <td>{{x.
                                        schemeName
                                        }}</td>
                                    <td>{{x.schemeStatus
                                        }}</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
                <div class="list_wrapper" ng-if="vm.schemeList.length==0">No records found to display.</div>
            </div>
        </div>
    </div>
</div>
