<div class="loader-new" ng-if="vm.loader"></div>
<dc-left-menu></dc-left-menu>
<div class="container from_wrapper new_form_wrapper">

    <h4 class="form_heading">Drop Down Master - Modify </h4>
    <sol-header></sol-header>

    <form name="vm.bondNominationsForm" role="form">
        <table class="table table-bordered">
            <tbody>
            <tr>
                <td width="15%">Name of the Module</td>
                <td width="20%">
                    <label class="data-bind" id="moduleName">RBI Bond</label>
                </td>
                <td width="20%">Drop Down Selected</td>
                <td width="40%">
                    <label class="data-bind" id="dropDownSelected">
                        {{ vm.dropDownType ? vm.dropDownType.DESCRIPTION : 'No selection' }}
                    </label>
                </td>
            </tr>

            </tbody>
        </table>

        <div class="col-sm-12 text-right form_submit">
            <div class="row">
                <a data-href="#" type="button" name="addBtn" class="btn btn-primary" ng-click="vm.modifyRange()">
                    <span class="glyphicon glyphicon-plus"></span>&nbsp;ADD
                </a>
            </div>
        </div>

        <table class="table table-bordered table-striped">
            <tbody ng-repeat="item in vm.dropAddDownListElements">
<!--            <tr>-->
<!--                <td colspan="4"><h4 class="form_heading">{{ vm.dropDownType ? vm.dropDownType.DESCRIPTION : 'No selection' }}  {{$index+1}}</h4></td>-->
<!--            </tr>-->
            <tr>
                <td width="25%" class="form-group required">
                    <label for="nomineeFName[$index]" class="required control-label">Drop down Field Name </label>
                </td>
                <td class="form-group">
                    <input type="text" class="form-control" id="nomineeFName[$index]"
                           limit-to="20" name="dropDownFieldName"
                           ng-model="item.fieldName"
                           oninput="this.value = this.value.replace(/[^a-zA-Z\s]/g, '').replace(/^\s/, '')"  required   ng-disabled="item.fieldName">
                </td>
                <td>
                    <a data-href="#" type="button" name="removeBtn" class="btn btn-delete"
                       ng-click="vm.removeModRange($index)">
                        <span class="glyphicon glyphicon-trash"></span>
                    </a>
                </td>
            </tr>
            </tbody>
        </table>

        <table class="table table-bordered table-striped">

            <tbody ng-repeat="item in vm.dropDownListElements">
            <tr>
                <td colspan="4"><h4 class="form_heading">{{ vm.dropDownType ? vm.dropDownType.DESCRIPTION : 'No selection' }}  {{$index+1}}</h4></td>
            </tr>
            <tr>
                <td width="25%" class="form-group required">
                    <label for="nomineeFName[$index]" class="required control-label">Drop down Field Name </label>
                </td>
                <td class="form-group">
                    <input type="text" class="form-control" id="nomineeFName[$index]"
                           limit-to="20" name="dropDownFieldName"
                           ng-model="item.fieldName"
                           oninput="this.value = this.value.replace(/[^a-zA-Z0-9\s]/g, '').replace(/^\s/, '')"  required leading-space>
                </td>
                <td>
                    <a data-href="#" type="button" name="removeBtn" class="btn btn-delete"
                       ng-click="vm.removeRange($index)">
                        <span class="glyphicon glyphicon-trash"></span>
                    </a>
                </td>
            </tr>

            </tbody>
        </table>
        <table class="table table-bordered table-striped list old-new-value-table">
            <tbody width="100%">
            <tr>
                <th width="50%">Rejection Remarks</th>
                <td width="50%">{{vm.rejectionRemarks}}</td>
            </tr>


            </tbody>
        </table>

        <div class="text-center form_submit">
            <button type="submit" class="btn btn-default" id="submitButton"
                    ng-disabled="vm.bondNominationsForm.$invalid"
                    ng-click="vm.modifySubmit()">Submit
            </button>
            <button type="button" class="btn btn-cancel" id="cancelButton"
                    onclick="window.location.href= '#!/drop_down_master/action/inquiry';">Cancel
            </button>
        </div>
        <div class="text-center">
            <notice-message-directive></notice-message-directive>
        </div>
    </form>
</div>
