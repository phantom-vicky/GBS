<div class="loader-new" ng-if="vm.loader"></div>
<cbs-left-menu></cbs-left-menu>
<div class="container from_wrapper new_form_wrapper">

	<h4 class="form_heading  feature-heading">Branch IFSC Codes - Add</h4>

	<form name="vm.branchIfscCodeForm" role="form"
		ng-submit="vm.submitForm(branchIfscCodeForm.$valid)" novalidate>
		<div class="row">
			<div class="form-group">
				<div class="col-sm-3"></div>
				<div class="col-sm-3 required">
				<label for="bankCode" class="control-label">Bank
					code</label>
					</div>
				<div class="col-sm-3">
					<input type="text" class="form-control" name="bankCode"
						id="bankCode" ng-model="vm.branchIfscCode.bankCode" maxlength="15"
						chars="alpha-numeric" required>

				</div>
			</div>
		</div>
		<div class="row">
			<div class="form-group">
				<div class="col-sm-3"></div>
				<div class="col-sm-3 required">
				<label for="branchCode" class="control-label">Branch
					code</label>
					</div>
				<div class="col-sm-3">
					<input type="text" class="form-control" name="branchCode"
						id="branchCode" ng-model="vm.branchIfscCode.branchCode"
						maxlength="15" chars="alpha-numeric" required>

				</div>
			</div>
		</div>
		<div class="row">
			<div class="form-group">
				<div class="col-sm-3"></div>
				<div class="col-sm-3 required">
				<label for="bankIdentifier" class="control-label">Branch IFSC code</label>
					</div>
				<div class="col-sm-3">
					<input type="text" class="form-control" name="bankIdentifier"
						id="bankIdentifier" ng-model="vm.branchIfscCode.bankIdentifier"
						 maxlength="11" chars="alpha-numeric"
						   ng-pattern="'^[a-zA-Z]{4}[0-9]{1}[a-zA-Z0-9]{6}$'" required>

				</div>
			</div>
		</div>
		<div class="row">
			<div class="form-group">
				<div class="col-sm-3"></div>
				<div class="col-sm-3 ">
				<label for="paysysId" class="control-label">Payment
					System Id (RTGS)</label>
					</div>
				<div class="col-sm-3">
					<input type="text" class="form-control" name="paysysId"
						id="paysysId" ng-model="vm.branchIfscCode.paysysId" maxlength="15"
						chars="alpha-numeric" >

				</div>
			</div>
		</div>
		<div class="row">
			<div class="form-group">
				<div class="col-sm-3"></div>
				<div class="col-sm-3">
				<label for="additionalText1" class="control-label">Additional
					Text1</label>
					</div>
				<div class="col-sm-3">
					<input type="text" class="form-control" name="additionalText1"
						id="additionalText1" ng-model="vm.branchIfscCode.additionalText1"
						maxlength="40" chars="alpha-numeric">

				</div>
			</div>
		</div>
		<div class="row">
			<div class="form-group">
				<div class="col-sm-3"></div>
				<div class="col-sm-3">
				<label for="additionalText2" class="control-label">Additional
					Text2</label>
					</div>
				<div class="col-sm-3">
					<input type="text" class="form-control" name="additionalText2"
						id="additionalText2" ng-model="vm.branchIfscCode.additionalText2"
						maxlength="40" chars="alpha-numeric">

				</div>
			</div>
		</div>
		<div class="row">
			<div class="form-group">
				<div class="col-sm-3"></div>
				<div class="col-sm-3">
				<label for="additionalText3" class="control-label">Additional
					Text3</label>
					</div>
				<div class="col-sm-3">
					<input type="text" class="form-control" name="additionalText3"
						id="additionalText3" ng-model="vm.branchIfscCode.additionalText3"
						maxlength="40" chars="alpha-numeric">

				</div>
			</div>
		</div>
		<div class="row">
			<div class="col-sm-offset-5 col-sm-8 form_submit">

				<button type="submit" class="btn btn-default" id="submitButton"
					ng-disabled="vm.branchIfscCodeForm.$invalid" ng-click="vm.add()">Submit</button>
				<button type="button" class="btn btn-cancel" id="cancelButton"
					ng-click="vm.showCancelConfirmation('branch_ifsc_codes.list');">Cancel</button>
			</div>
		</div>
		<div class="text-center">
			<notice-message-directive></notice-message-directive>
		</div>
	</form>
</div>
