<div class="loader-new" ng-if="vm.loader"></div>
<dc-left-menu></dc-left-menu>
<div class="container from_wrapper new_form_wrapper">
    <h4 class="form_heading">StateWise SGST Master For Brokerage - ADD</h4>
    <sol-header></sol-header>
    <form name="stateWiseSgstForm" role="form">
        <div class="col-sm-6 col-sm-offset-3">
            <div class="row">
                <div class="form-group required">
                    <div class="col-sm-6">
                        <label for="moduleName" class="control-label">Name of the Module</label>
                    </div>
                    <div class="col-sm-4">
                        <label><b>RBI Bond</b></label>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="form-group required">
                    <div class="col-sm-6">
                        <label class="control-label">Scheme Name</label>
                    </div>
                    <div class="col-sm-4">
                        <input type="text" class="form-control" id="schemeName"
                               name="schemeName" ng-model="vm.schemeName" readonly required>
                    </div>
                    <div class="col-sm-2">
                        <i class="glyphicon glyphicon-search cp" data-bs-toggle="modal"
                           id="schemeNameSearcher"
                           ng-click="vm.getAddDetails('schemeTorch');vm.searchlevelName = '';"></i>
                        <i class="glyphicon glyphicon-remove clear cp"
                           ng-click="vm.schemeName='';vm.stateName='';vm.schemeCode='';vm.stateCode='';"></i>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="form-group required">
                    <div class="col-sm-6">
                        <label for="StateName" class="control-label">State Name</label>
                    </div>
                    <div class="col-sm-4">
                        <input type="text" class="form-control" id="stateName"
                               ng-model="vm.stateName"  readonly required>
                    </div>
                    <div class="col-sm-2" ng-if="vm.schemeName">
                        <i class="glyphicon glyphicon-search cp" data-bs-toggle="modal"
                           id="stateNameSearch"
                           ng-click="vm.getAddDetails('stateTorch');vm.searchStateName = ''; "></i>
                        <i class="glyphicon glyphicon-remove clear cp"
                           ng-click="vm.stateName='';vm.stateCode='';"></i>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="form-group required">
                    <div class="col-sm-6">
                        <label class="control-label">SGST Rate on Brokerage (%)</label>
                    </div>
                    <div class="col-sm-4">
                        <input type="text" class="form-control" id="sgstRate"
                               ng-model="vm.sgstRate" chars="float"
                               ng-change="vm.firstCharDot(vm.sgstRate);" ng-blur="vm.formatPercentage(vm.sgstRate,'A');"
                               ng-keypress="vm.percentageCheckNew($event);" maxlength="6"
                               oninput="this.value = this.value.replace(/[^0-9.]/g, '').replace(/(\..*)\./g, '$1').replace(/^(\d{1,3}(\.\d{0,2})?).*$/, '$1')"
                               required>
                    </div>
                </div>
            </div>
            <div class="text-center form_submit">
                <button type="submit" class="btn btn-default" id="submitButton"
                        ng-disabled="stateWiseSgstForm.$invalid"  ng-click="vm.addSubmitForm();"> Submit</button>
                <button type="button" class="btn btn-cancel" id="cancelButton"
                        onclick="window.location.href= '#!/state_wise_sgst_master_for_brokerage/action/inquiry';">Cancel</button>
            </div>
            <div class="text-center">
                <notice-message-directive></notice-message-directive>
            </div>

        </div>

    </form>
</div>
<div class="modal" id="StateNameModal" role="dialog">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-bs-dismiss="modal">&times;</button>
                <h4 class="modal-title">State Name</h4>
            </div>
            <div class="modal-body">
                <div class="loader_popup"></div>
                <div class="list_wrapper" ng-if="vm.stateNameList.length>0">
                    <div class="col-sm-8 form_submit">
                        <div class="form-group">
                            <div class="input-group">
                                <div class="input-group-addon">
                                    <i class="glyphicon glyphicon-search"></i>
                                </div>
                                <input type="text" class="form-control" chars="alpha-numeric"
                                       ng-model="vm.searchStateName" ng-init="vm.searchStateName = ''"
                                       placeholder="Search">
                            </div>
                        </div>
                    </div>
                    <div class="col-sm-4 form_submit"></div>
                    <div class="row">
                        <div class="col-sm-12">
                            <table class="table table-bordered list scroll">
                                <thead ng-init="reverseOrder = false; sortedColumn = 'stateName'">
                                <tr>
                                    <!--
                                                                        <th class="modal-title title-case" ng-click="(sortedColumn == 'stateCode')?(reverseOrder=(!reverseOrder)): (reverseOrder = false);sortedColumn = 'stateCode';" ng-class="(sortedColumn == 'stateCode')?((reverseOrder)?('arrow-down') : ('arrow-up') ) : ('')">State Code</th>
                                    -->
                                    <th class="modal-title title-case" ng-click="(sortedColumn == 'stateName')?(reverseOrder=(!reverseOrder)): (reverseOrder = false);sortedColumn = 'stateName';" ng-class="(sortedColumn == 'stateName')?((reverseOrder)?('arrow-down') : ('arrow-up') ) : ('')">State Name</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr class="cp"
                                    ng-repeat="x in vm.stateNameList | filter:vm.searchStateName | orderBy:sortedColumn:reverseOrder"
                                    ng-click="vm.stateName=x.stateName;vm.stateCode=x.stateCodeId;"  data-bs-dismiss="modal">
                                    <td>{{x.stateName}}</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
                <div class="list_wrapper" ng-if="vm.stateNameList.length==0">No records found to display.</div>
            </div>
        </div>
    </div>
</div>
<div class="modal" id="levelNameModal" role="dialog">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-bs-dismiss="modal">&times;</button>
                <h4 class="modal-title">Scheme Master Name</h4>
            </div>
            <div class="modal-body">
                <div class="loader_popup"></div>
                <div class="list_wrapper" ng-if="vm.schemeNameList.length>0">
                    <div class="col-sm-8 form_submit">
                        <div class="form-group">
                            <div class="input-group">
                                <div class="input-group-addon">
                                    <i class="glyphicon glyphicon-search"></i>
                                </div>
                                <input type="text" class="form-control" chars="alpha-numeric"
                                       ng-model="vm.searchlevelName" ng-init="vm.searchlevelName = ''"
                                       placeholder="Search">
                            </div>
                        </div>
                    </div>
                    <div class="col-sm-4 form_submit"></div>
                    <div class="row">
                        <div class="col-sm-12">
                            <table class="table table-bordered list scroll">
                                <thead ng-init="reverseOrder = false; sortedColumn = 'schemeName'">
                                <tr>
                                    <th class="modal-title title-case" ng-click="(sortedColumn == 'schemeName')?(reverseOrder=(!reverseOrder)): (reverseOrder = false);sortedColumn = 'schemeName';" ng-class="(sortedColumn == 'schemeName')?((reverseOrder)?('arrow-down') : ('arrow-up') ) : ('')">Scheme Name</th>
                                    <th class="modal-title title-case" ng-click="(sortedColumn == 'schemeStatus')?(reverseOrder=(!reverseOrder)): (reverseOrder = false);sortedColumn = 'schemeStatus';" ng-class="(sortedColumn == 'schemeStatus')?((reverseOrder)?('arrow-down') : ('arrow-up') ) : ('')">Status</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr class="cp"
                                    ng-repeat="x in vm.schemeNameList | filter:vm.searchlevelName | orderBy:sortedColumn:reverseOrder"
                                    ng-click="vm.schemeName=x.schemeName;vm.schemeCode=x.schemeCode;vm.schemeStatus=x.schemeStatus;"  data-bs-dismiss="modal">
                                    <td>{{x.schemeName}}</td>
                                    <td>{{x.schemeStatus}}</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
                <div class="list_wrapper" ng-if="vm.schemeNameList.length==0">No records found to display.</div>
            </div>
        </div>
    </div>
</div>
