<div class="loader-new" ng-if="vm.loader"></div>
<!--<dc-left-menu></dc-left-menu>-->
<div class="container from_wrapper new_form_wrapper">

    <h4 class="form_heading">CAFU File Download</h4>
    <sol-header></sol-header>
    <form name="cafuFileDownload" role="form">



        <div class="row">
            <div class="form-group">
                <div class="col-sm-3"></div>
                <div class="col-sm-3">
                    <label  class="control-label">Name of the Module</label>
                </div>
                <div class="col-sm-5">
                    <label><b>RBI Bond</b></label>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="form-group required">
                <div class="col-sm-3"></div>
                <div class="col-sm-3">
                    <label for="moduleName" class="control-label">Name of the Bond Scheme</label>
                </div>
                <div class="col-sm-2">
                    <input type="text" class="form-control" id="moduleName" ng-model="vm.subCodeDesc" required readonly>
                </div>
                <div class="col-sm-2">
                    <i class="glyphicon glyphicon-search cp" data-bs-toggle="schemeName"
                       id="treasurySearch"
                       ng-click="vm.getModuleName();"></i> <i
                        class="glyphicon glyphicon-remove clear cp"
                        ng-click="vm.schemeCode ='';vm.schemeName =''"></i>
                </div>
            </div>
            </div>


        <div class="row" >
            <div class="form-group required">
                <div class="col-sm-3"></div>
                <div class="col-sm-3">
                    <label class="control-label">File Name</label>
                </div>
                <div class="col-sm-2">
                    <select class="form-control" id="fileType" name="fileType"
                            ng-model="vm.fileType"  required>
                        <option value="">Select</option>
                        <option value="TBNB">TBNB</option>
                        <option value="TBNB_BB">TBNB_BB</option>
                        <option value="TBNB_SAKSHAM">TBNB_SAKSHAM</option>
                        <option value="TBNB_NOVOPAY">TBNB_NOVOPAY</option>
<!--                        <option ng-repeat="item in vm.schemeList" value="{{item.subCode}}" ng-bind="item.subCodeDescription"></option>-->
                    </select>
                </div>
            </div>
        </div>
        <div class="row" >
            <div class="form-group required">
                <div class="col-sm-3"></div>
                <div class="col-sm-3">
                    <label class="control-label">File Mode</label>
                </div>
                <div class="col-sm-2">
                    <select class="form-control" id="fileMode" name="fileMode"
                            ng-model="vm.fileMode"  required>
                        <option value="">Select</option>
                        <option value="O">CASH-IN</option>
                        <option value="N">FCM</option>
                         </select>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="form-group required">
                <div class="col-sm-3"></div>
                <div class="col-sm-3">
                    <label  class="control-label">Liquidation Date(dd/mm/yyyy)</label>
                </div>
                <div class="col-sm-2">
                    <p class="input-group">
                        <input type="text" class="form-control" id="liquidationDate"
                               name="effFromDate" ng-model="vm.liquidationDate"
                               uib-datepicker-popup="dd/MM/yyyy" ng-init="vm.dateValidation();"
                               datepicker-options="vm.dateOptions"
                               is-open="vm.effFromDatePicker.opened" close-text="Close"
                               maxlength="10"  ng-blur="vm.textableDatePicker('liquidationDate',vm.liquidationDate);vm.futureNotAllowed('liquidationDate',vm.liquidationDate)"
                               ng-keyup="vm.autoslashing('liquidationDate')" chars="numbers-slash"  required>
                        <span class="input-group-btn">
                            <button type="button" class="btn btn-secondary"
                                    ng-click="vm.effFromDatePicker.opened = true"
                                    id="effFromDateSearcher">
                                <i class="glyphicon glyphicon-calendar"></i>
                            </button>
                        </span>
                    </p>
                </div>
            </div>
        </div>




        <div class="text-center form_submit">
            <button type="submit" id="submitbutton" class="btn btn-default"
                    ui-sref="cafu_file_download.inquiry_details({obj:{
                            schemeName:vm.schemeName,
                            subCode:vm.subCode,
                            fileType:vm.fileType,
                            liquidationDate:vm.liquidationDate
                       }})"
                    ng-disabled="cafuFileDownload.$invalid" ng-click="vm.downloadSelectedFiles();">Submit</button>
            <button type="button" class="btn btn-cancel" id="cancelButton"
                    onclick="window.location.href= '#!/rbibond_gu_functionality';">Cancel
            </button>
        </div>

        <div class="text-center">
            <notice-message-directive></notice-message-directive>
        </div>
    </form>
</div>

<!--//bond scheme name-->
<div class="modal" id="schemeModel" role="dialog">
    <div class="modal-dialog">
        <!-- Modal content-->
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-bs-dismiss="modal">&times;</button>
                <h4 class="modal-title">Scheme Code</h4>
            </div>
            <div class="modal-body">
                <div class="loader_popup"></div>
                <div class="list_wrapper" ng-if="vm.schemeList.length>0">
                    <div class="col-sm-8 form_submit">
                        <div class="form-group">
                            <div class="input-group">
                                <div class="input-group-addon">
                                    <i class="glyphicon glyphicon-search"></i>
                                </div>
                                <input type="text" class="form-control"
                                       ng-model="vm.modalSearch" ng-init="vm.modalSearch = ''"
                                       placeholder="Search">
                            </div>
                        </div>
                    </div>
                    <div class="col-sm-4 form_submit"></div>
                    <div class="row">

                        <div class="col-sm-12">

                            <table class="table table-bordered list scroll sort">
                                <thead ng-init="reverseOrder=true;sortedColumn = 'subCodeDesc'">

                                <tr>
                                    <!--                                    <th class="modal-title title-case" ng-click="(sortedColumn == 'schemeCode')?(reverseOrder=(!reverseOrder)): (reverseOrder = false);sortedColumn = 'schemeCode';" ng-class="(sortedColumn == 'schemeCode')?((reverseOrder)?('arrow-down') : ('arrow-up') ) : ('')">Scheme Code</th>-->
                                    <th class="modal-title title-case" ng-show="false">Scheme Code</th>
                                    <th class="modal-title title-case" ng-click="(sortedColumn == 'subCodeDesc')?(reverseOrder=(!reverseOrder)): (reverseOrder = false);sortedColumn = 'subCodeDesc';" ng-class="(sortedColumn == 'subCodeDesc')?((reverseOrder)?('arrow-down') : ('arrow-up') ) : ('')">Scheme Name</th>
                                    <th class="modal-title title-case" ng-click="(sortedColumn == 'schemeStatus')?(reverseOrder=(!reverseOrder)): (reverseOrder = false);sortedColumn = 'schemeStatus';" ng-class="(sortedColumn == 'schemeStatus')?((reverseOrder)?('arrow-down') : ('arrow-up') ) : ('')">Status</th>

                                </tr>
                                </thead>
                                <tbody>
                                <tr class="cp"
                                    ng-repeat="x in vm.schemeList | filter:vm.modalSearch | orderBy:sortedColumn:reverseOrder"
                                    ng-click="vm.subCode = x.subCode; vm.subCodeDesc = x.subCodeDesc; vm.schemeStatus = x.schemeStatus"
                                    data-bs-dismiss="modal">
                                    <!--                                    <td>{{x.subCode}}</td>-->
                                    <td style="display: none;">{{x.subCode}}</td>
                                    <td>{{x.subCodeDesc}}</td>
                                    <td>{{x.schemeStatus}}</td>

                                </tr>
                                </tbody>
                            </table>
                        </div>

                    </div>
                </div>
                <div class="list_wrapper" ng-if="vm.schemeList.length==0">No records found to display.</div>
            </div>

        </div>
    </div>
</div>
