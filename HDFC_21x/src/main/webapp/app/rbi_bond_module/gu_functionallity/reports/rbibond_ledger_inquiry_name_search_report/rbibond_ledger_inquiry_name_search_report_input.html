<div class="loader-new" ng-if="vm.loader"></div>
<!--<dc-left-menu></dc-left-menu>-->
<div class="container from_wrapper new_form_wrapper">

    <h4 class="form_heading">Bond Ledger Inquiry – Name Search</h4>
    <sol-header></sol-header>
    <form name="bondPrincipalRepayFrom" role="form">

        <div class="row">
            <div class="form-group">
                <div class="col-sm-3"></div>
                <div class="col-sm-3">
                    <label class="control-label">Name of the Module</label>
                </div>
                <div class="col-sm-5">
                    <label><b>RBI Bond</b></label>
                </div>
            </div>
        </div>

        <div class="row" ng-init="vm.getModuleName();">
            <div class="form-group required">
                <div class="col-sm-3"></div>
                <div class="col-sm-3">
                    <label for="schemeCode" class="control-label">Name of the Bond Scheme</label>
                </div>
                <div class="col-sm-2">
                    <select class="form-control" id="schemeCode" name="schemCode"
                            ng-model="vm.schemeCode"  ng-change="vm.alert(vm.schemeCode)" required>
                        <option value="">Select</option>
                        <option ng-repeat="item in vm.schemeList" value="{{item.subCode}}" ng-bind="item.subCodeDescription"></option>
                    </select>
                </div>
            </div>
        </div>

        <div class="row" ng-if ="vm.schemeCode">
            <div class="form-group">
                <div class="col-sm-3"></div>
                <div class="col-sm-3">
                    <label for="schemeCode" class="control-label">Bond Ledger Account Number</label>
                </div>
                <div class="col-sm-2">
                    <input type="text" class="form-control" id="blaAccNo" ng-init="vm.blaAccNo=''"
                           ng-model="vm.blaAccNo"    readonly>
                </div>
                <div class="col-sm-2">
                    <i class="glyphicon glyphicon-search cp" data-bs-toggle="modal"
                       id="versionNoSearch"
                       ng-click="vm.getBlaAccNo();vm.searchSolId='';"></i> <i
                        class="glyphicon glyphicon-remove clear cp"
                        ng-click="vm.blaAccNo = '';"></i>
                </div>
            </div>
        </div>


        <div class="row" >
            <div class="form-group">
                <div class="col-sm-3"></div>
                <div class="col-sm-3">
                    <label for="schemeCode" class="control-label">Bond Holder First Name</label>
                </div>
                <div class="col-sm-2">
                    <input type="text" class="form-control" id="bondFirstName" ng-init="vm.bondFirstName=''"
                           ng-model="vm.bondFirstName">
                </div>
            </div>
        </div>

            <div class="row" >
                <div class="form-group">
                    <div class="col-sm-3"></div>
                    <div class="col-sm-3">
                        <label for="schemeCode" class="control-label">Bond Holder Middle Name</label>
                    </div>
                    <div class="col-sm-2">
                        <input type="text" class="form-control" id="bondMiddleName" ng-init="vm.bondMiddleName=''"
                               ng-model="vm.bondMiddleName">
                    </div>
                </div>
            </div>


                <div class="row" >
                <div class="form-group">
                    <div class="col-sm-3"></div>
                    <div class="col-sm-3">
                        <label for="schemeCode" class="control-label">Bond Holder Last Name</label>
                    </div>
                    <div class="col-sm-2">
                        <input type="text" class="form-control" id="bondLastName" ng-init="vm.bondLastName=''"
                               ng-model="vm.bondLastName">
                    </div>
                </div>
                </div>

                <div class="row" >
                    <div class="form-group">
                        <div class="col-sm-3"></div>
                        <div class="col-sm-3">
                            <label for="schemeCode" class="control-label">Address</label>
                        </div>
                        <div class="col-sm-2">
                            <input type="text" class="form-control" id="address" ng-init="vm.address=''"
                                   ng-model="vm.address">
                        </div>
                    </div>
                </div>










                    <div class="text-center form_submit">
            <button type="submit" id="submitbutton" class="btn btn-default"
                    ui-sref="rbibond_ledger_inquiry_name_search_report.inquiry_details({obj:{
                            schemeCode:vm.schemeCode,
                            blaNo:vm.blaAccNo,
                            firstNameHolder:vm.bondFirstName,
                            middleNameHolder :vm.bondMiddleName,
                            lastNameHolder :vm.bondLastName,
                            address:vm.address,
                            schemeName:vm.schemeName

                        }})"
                    ng-disabled="bondPrincipalRepayFrom.$invalid">Submit</button>
            <button type="button" class="btn btn-cancel" id="cancelButton"
                    onclick="window.location.href= '#!/rbibond_gu_functionality';">Cancel
            </button>
        </div>

        <div class="text-center">
            <notice-message-directive></notice-message-directive>
        </div>
    </form>
</div>

<!--BLA  NUMBER TORCH-->
<div class="modal" id="blaAccNoModal" role="dialog">
    <div class="modal-dialog">
        <!-- Modal content-->
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-bs-dismiss="modal">&times;</button>
                <h4 class="modal-title">Bond Ledger Account Number</h4>
            </div>
            <div class="modal-body">
                <div class="loader_popup"></div>
                <div class="list_wrapper" ng-if="vm.blaAccNoList.length>0">
                    <div class="col-sm-8 form_submit">
                        <div class="form-group">
                            <div class="input-group">
                                <div class="input-group-addon">
                                    <i class="glyphicon glyphicon-search"></i>
                                </div>
                                <input type="text" class="form-control"
                                       ng-model="vm.searchSolId" ng-init="vm.searchSolId = ''"
                                       placeholder="Search">
                            </div>
                        </div>
                    </div>
                    <div class="col-sm-4 form_submit"></div>
                    <div class="row">

                        <div class="col-sm-12">
                            <table class="table table-bordered list scroll sort">
                                <thead ng-init="reverseOrder=true;sortedColumn = 'blaAccNo'">
                                <tr>
                                    <th ng-click="(sortedColumn == 'blaAccNo')?(reverseOrder=(!reverseOrder)): (reverseOrder = false);sortedColumn = 'blaAccNo';" ng-class="(sortedColumn == 'blaAccNo')?((reverseOrder)?('arrow-down') : ('arrow-up') ) : ('')">Bond Ledger Account Number</th>
                                    <th ng-click="(sortedColumn == 'modeOfHolding')?(reverseOrder=(!reverseOrder)): (reverseOrder = false);sortedColumn = 'modeOfHolding';" ng-class="(sortedColumn == 'modeOfHolding')?((reverseOrder)?('arrow-down') : ('arrow-up') ) : ('')">Mode Of Holding</th>
                                    <th ng-click="(sortedColumn == 'holderName')?(reverseOrder=(!reverseOrder)): (reverseOrder = false);sortedColumn = 'holderName';" ng-class="(sortedColumn == 'holderName')?((reverseOrder)?('arrow-down') : ('arrow-up') ) : ('')">HolderName</th>
                                    <!--                                    <th ng-click="(sortedColumn == 'holderType')?(reverseOrder=(!reverseOrder)): (reverseOrder = false);sortedColumn = 'holderType';" ng-class="(sortedColumn == 'holderType')?((reverseOrder)?('arrow-down') : ('arrow-up') ) : ('')">Holder Type</th>-->
                                </tr>
                                </thead>
                                <tbody>
                                <tr class="cp"
                                    ng-repeat="x in vm.blaAccNoList | filter:vm.searchSolId | orderBy:sortedColumn:reverseOrder"
                                    ng-click="vm.blaAccNo = x.blaNo" data-bs-dismiss="modal">
                                    <td>{{x.blaNo}}</td>
                                    <td>{{x.modeOfHolding}}</td>
                                    <td>{{x.holderName}}</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
                <div class="list_wrapper" ng-if="vm.blaAccNoList.length==0">No records found to display.</div>
            </div>

        </div>
    </div>
</div>
