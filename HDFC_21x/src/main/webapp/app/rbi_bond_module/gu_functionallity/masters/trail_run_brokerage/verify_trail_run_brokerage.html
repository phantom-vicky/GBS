<div class="loader-new" ng-if="vm.loader"></div>
<dc-left-menu></dc-left-menu>
<div class="container from_wrapper new_form_wrapper" ng-init="vm.getSubCodeList();">

    <h4 class="form_heading">RBI BOND Trial run for Brokerage - Verify/Reject</h4>
    <sol-header></sol-header>
    <form name="trailRunBrokerageForm" role="form">


        <div class="row">
            <div class="form-group required">
                <div class="col-sm-3"></div>
                <div class="col-sm-3">
                    <label class="control-label">BOD Date</label>
                </div>
                <div class="col-sm-2">
                    <label class="form-control">{{vm.solDate | date : 'dd/MM/yyyy'}}</label>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="form-group">
                <div class="col-sm-3"></div>
                <div class="col-sm-3">
                    <label for="moduleName" class="control-label">Name of the Module</label>
                </div>
                <div class="col-sm-4">
                    <label><b>RBI Bond</b></label>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="form-group required">
                <div class="col-sm-3"></div>
                <div class="col-sm-3">
                    <label for="moduleName" class="control-label">Name of the Bond Scheme </label>
                </div>
                <div class="col-sm-2">
                    <input type="text" class="form-control" id="moduleName" ng-model="vm.schemeName" required readonly>
                </div>
                <div class="col-sm-2">
                    <i class="glyphicon glyphicon-search cp" data-bs-toggle="modal" id="schemeNameSearcher" ng-click="vm.getTrailRunVerDetail('torch'); vm.schemeCode = '';"></i>
                    <i class="glyphicon glyphicon-remove clear cp" ng-click="vm.schemeName='';"></i>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="form-group">
                <div class="col-sm-3"></div>
                <div class="col-sm-3">
                    <label for="moduleName" class="control-label">Trial run type</label>
                </div>
                <div class="col-sm-4">
                    <label><b>Brokerage</b></label>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="form-group">
                <div class="col-sm-3"></div>
                <div class="col-sm-3">
                    <label class="control-label">Agency Code</label>
                </div>
                <div class="col-sm-2">
                    <input type="text" class="form-control" id="agencyCode"
                           ng-model="vm.brokerName"
                           chars="alpha-numeric" disabled >
                </div>
                <div class="col-sm-2">
                    <i class="glyphicon glyphicon-search cp" data-bs-toggle="modal"
                       id="treasurySearch"
                       ng-click="vm.getAgencyCodeVerTor();"></i> <i
                        class="glyphicon glyphicon-remove clear cp"
                        ng-click="vm.agencyCode ='';vm.brokerName=''"></i>
                </div>
            </div>
        </div>



        <div class="text-center form_submit">
            <button type="submit" class="btn btn-default" id="submitButton"
                    ui-sref="rbibond_trail_run_brokerage.verify_detail({obj:{
                               schemeCode: vm.schemeCode,
								agencyCode: vm.agencyCode,
								schemeName: vm.schemeName

								}})"
                    ng-disabled="trailRunBrokerageForm.$invalid">Submit</button>
            <button type="button" class="btn btn-cancel" id="cancelButton"
                    onclick="window.location.href= '#!/rbibond_trail_run_brokerage/add';">Cancel</button>
        </div>
        <div class="text-center">
            <notice-message-directive></notice-message-directive>
        </div>
    </form>
</div>


<!--Scheme Name-->
<div class="modal" id="schemeNameSearcherPopUp" role="dialog">
    <div class="modal-dialog">
        <!-- Modal content-->
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-bs-dismiss="modal">&times;</button>
                <h4 class="modal-title">Name of the bond scheme</h4>
            </div>
            <div class="modal-body">
                <div class="loader_popup"></div>
                <div class="list_wrapper" ng-if="vm.schemeNameList.length>0">
                    <div class="col-sm-8 form_submit">
                        <div class="form-group">
                            <div class="input-group">
                                <div class="input-group-addon">
                                    <i class="glyphicon glyphicon-search"></i>
                                </div>
                                <input type="text" class="form-control" ng-model="vm.schemeCode" ng-init="vm.schemeCode = ''" chars="alpha-numeric" placeholder="Search" >
                            </div>
                        </div>
                    </div>
                    <div class="col-sm-4 form_submit"></div>
                    <div class="row">

                        <div class="col-sm-12">
                            <table class="table table-bordered list scroll">
                                <thead ng-init="reverseOrder = false; sortedColumn = 'schemeName'">
                                <tr>
                                    <th class="modal-title title-case" ng-click="(sortedColumn == 'schemeName')?(reverseOrder=(!reverseOrder)): (reverseOrder = false);sortedColumn = 'schemeName';" ng-class="(sortedColumn == 'schemeName')?((reverseOrder)?('arrow-down') : ('arrow-up') ) : ('')">Scheme Name</th>
                                    <th class="modal-title title-case" ng-click="(sortedColumn == 'schemeStatus')?(reverseOrder=(!reverseOrder)): (reverseOrder = false);sortedColumn = 'schemeStatus';" ng-class="(sortedColumn == 'schemeStatus')?((reverseOrder)?('arrow-down') : ('arrow-up') ) : ('')">Scheme Status</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr class="cp"
                                    ng-repeat="x in vm.schemeNameList | filter:vm.schemeCode | orderBy:sortedColumn:reverseOrder"
                                    ng-click="vm.schemeCode=x.schemeCode;vm.schemeName=x.schemeName"  data-bs-dismiss="modal">
                                    <td>{{x.schemeName}}</td>
                                    <td>{{x.schemeStatus}}</td>
                                </tr>
                                <!--                                <tr class="cp" ng-repeat="x in vm.branchIdList" ng-click="vm.searchBranchId = x.branchId;vm.branchName = x.branchName;vm.crn.no=x.crn.no;" data-bs-dismiss="modal">-->
                                <!--                                    <td>{{x.branchId}}</td>-->
                                <!--                                    <td>{{x.branchName}}</td>-->
                                <!--                                </tr>-->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
                <div class="list_wrapper" ng-if="vm.schemeNameList.length==0">No records found to display.</div>
            </div>
        </div>
    </div>
</div>
<!--brokerModal Modal-->
<div class="modal" id="AgencyCodeModal" role="dialog">
    <div class="modal-dialog">
        <!-- Modal content-->
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-bs-dismiss="modal">&times;</button>
                <h4 class="modal-title">Agency Code</h4>
            </div>
            <div class="modal-body">
                <div class="loader_popup"></div>
                <div class="list_wrapper" ng-if="vm.AgencyCodeTorchList.length>0">
                    <div class="col-sm-8 form_submit">
                        <div class="form-group">
                            <div class="input-group">
                                <div class="input-group-addon">
                                    <i class="glyphicon glyphicon-search"></i>
                                </div>
                                <input type="text" class="form-control" chars="alpha-numeric"
                                       ng-model="vm.searchCustomerId" ng-init="vm.searchCustomerId = ''"
                                       placeholder="Search">
                            </div>
                        </div>
                    </div>
                    <div class="col-sm-4 form_submit"></div>
                    <div class="row">
                        <div class="col-sm-12">
                            <table class="table table-bordered list scroll">
                                <thead ng-init="reverseOrder = false; sortedColumn = 'scssCustomerId'">
                                <tr>
                                    <th class="modal-title title-case" ng-click="(sortedColumn == 'agencyCode')?(reverseOrder=(!reverseOrder)): (reverseOrder = false);sortedColumn = 'agencyCode';" ng-class="(sortedColumn == 'agencyCode')?((reverseOrder)?('arrow-down') : ('arrow-up') ) : ('')">Agency Code</th>
                                    <th class="modal-title title-case" ng-click="(sortedColumn == 'brokerName')?(reverseOrder=(!reverseOrder)): (reverseOrder = false);sortedColumn = 'brokerName';" ng-class="(sortedColumn == 'brokerName')?((reverseOrder)?('arrow-down') : ('arrow-up') ) : ('')">Broker Name</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr class="cp"
                                    ng-repeat="x in vm.AgencyCodeTorchList | filter:vm.searchCustomerId | orderBy:sortedColumn:reverseOrder"
                                    ng-click="vm.agencyCode = x.agencyCode;vm.brokerName = x.brokerName;" data-bs-dismiss="modal">
                                    <td>{{x.agencyCode}}</td>
                                    <td>{{x.brokerName}}</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
                <div class="list_wrapper" ng-if="vm.brokerTorchList.length==0">No records found to display.</div>
            </div>
        </div>
    </div>
</div>
