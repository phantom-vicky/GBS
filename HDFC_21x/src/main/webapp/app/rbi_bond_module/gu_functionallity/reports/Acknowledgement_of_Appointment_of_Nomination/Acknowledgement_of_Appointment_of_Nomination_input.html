<div class="loader-new" data-ng-if="vm.loader"></div>
<div class="container from_wrapper new_form_wrapper">
    <h4 class="form_heading">Acknowledgement of Appointment of Nomination</h4>
    <sol-header></sol-header>

    <form name="accountOpeningForm" role="form">

        <!--Module name-->
        <div class="row">
            <div class="form-group">
                <div class="col-sm-3"></div>
                <div class="col-sm-3">
                    <label class="control-label">Name of the Module</label>
                </div>
                <div class="col-sm-2">
                    <label><b>RBI Bond</b></label>
                </div>
            </div>
        </div>

        <!--Scheme name-->
        <div class="row">
            <div class="form-group required">
                <div class="col-sm-3"></div>
                <div class="col-sm-3">
                    <label class="control-label">Name of the Bond Scheme</label>
                </div>
                <div class="col-sm-2">
                    <input type="text" class="form-control" id="schemeCode" ng-model="vm.schemeName" readonly required/>
                </div>
                <div class="col-sm-2">
                    <i class="glyphicon glyphicon-search cp" data-bs-toggle="schemeName" id="treasurySearcher" ng-click="vm.schemeCode ='';vm.getModuleName();"></i>
                    <i class="glyphicon glyphicon-remove clear cp" ng-click="vm.schemeCode ='';vm.schemeName =''; vm.schemeStatus='';
            vm.fromdate=''; vm.todate='';"></i>
                </div>
            </div>
        </div>


        <!--FROM DATE-->
        <div class="row">
            <div class="form-group required">
                <div class="col-sm-3"></div>
                <div class="col-sm-3"><label class="control-label">From Date</label></div>
                <div class="col-sm-2">
                    <p class="input-group">
                        <input
                                type="text"
                                class="form-control"
                                id="effFromDate"
                                name="effFromDate"
                                data-ng-model="vm.fromdate"
                                data-uib-datepicker-popup="dd/MM/yyyy"
                                data-ng-init="vm.fromdate=''; vm.fromDateVal()"
                                data-ng-change="vm.toDateVal(vm.fromdate); vm.toDate=''"
                                data-datepicker-options="vm.fromDateOptions"
                                data-is-open="vm.effFromDatePicker.opened"
                                data-close-text="Close"
                                maxlength="10"
                                ng-blur="vm.textableDatePicker('effFromDate',vm.fromdate)"
                                ng-keyup="vm.autoslashing('effFromDate')" chars="numbers-slash"
                                required
                        />
                        <span class="input-group-btn">
              <button type="button" class="btn btn-secondary" data-ng-click="vm.effFromDatePicker.opened = true" id="effFromDateSearcher1">
                <i class="glyphicon glyphicon-calendar"></i>
              </button>
            </span>
                    </p>
                </div>
            </div>
        </div>

        <!--TO DATE-->
        <div class="row">
            <div class="form-group required">
                <div class="col-sm-3"></div>
                <div class="col-sm-3"><label class="control-label">To Date</label></div>
                <div class="col-sm-2">
                    <p class="input-group">
                        <input
                                type="text"
                                class="form-control"
                                id="efftoDate"
                                name="efftoDate"
                                ng-model="vm.todate"
                                uib-datepicker-popup="dd/MM/yyyy"
                                ng-init="vm.todate=''"
                                datepicker-options="vm.toDateOptions"
                                is-open="vm.efftoDatePicker.opened"
                                close-text="Close"
                                maxlength="10"
                                ng-blur="vm.textableDatePicker('efftoDate',vm.todate)"
                                ng-keyup="vm.autoslashing('efftoDate')" chars="numbers-slash"
                                required
                        />
                        <span class="input-group-btn">
              <button type="button" class="btn btn-secondary" ng-click="vm.efftoDatePicker.opened = true" id="efftoDateSearcher">
                <i class="glyphicon glyphicon-calendar"></i>
              </button>
            </span>
                    </p>
                </div>
            </div>
        </div>

        <div class="text-center form_submit">
            <button
                    type="button"
                    class="btn btn-default"
                    id="submitButton"
                    ng-click="vm.acknowledgementDetails()"
                    ng-disabled="accountOpeningForm.$invalid"
            >
                Submit
            </button>


            <button
                    type="button"
                    class="btn btn-cancel"
                    id="cancelButton"
                    onclick="window.location.href= '#!/rbibond_gu_functionality';"
            >
                Cancel
            </button>
        </div>

        <div class="text-center">
            <notice-message-directive></notice-message-directive>
        </div>

    </form>
</div>

<!--Scheme Name  and Status Model-->
<div class="modal" id="schemeModel" role="dialog">
    <div class="modal-dialog">
        <!-- Modal content-->
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-bs-dismiss="modal" ng-click="vm.modalSearch=''">&times;</button>
                <h4 class="modal-title">Scheme Code</h4>
            </div>
            <div class="modal-body">
                <div class="loader_popup"></div>
                <div class="list_wrapper" ng-if="vm.schemeList.length>0">
                    <div class="col-sm-8 form_submit">
                        <div class="form-group">
                            <div class="input-group">
                                <div class="input-group-addon">
                                    <i class="glyphicon glyphicon-search"></i>
                                </div>
                                <input type="text" class="form-control" ng-model="vm.modalSearch" ng-init="vm.modalSearch = ''" placeholder="Search"
                                       oninput = "this.value = this.value.replace(/^\s+/, '').replace(/\s{2,}/g, ' ')"
                                />
                            </div>
                        </div>
                    </div>
                    <div class="col-sm-4 form_submit"></div>
                    <div class="row">
                        <div class="col-sm-12">
                            <table class="table table-bordered list scroll sort">
                                <thead ng-init="reverseOrder=true;sortedColumn = 'schemeName'">
                                <tr>

                                    <th scope="col"
                                            class="modal-title title-case"
                                            ng-click="(sortedColumn == 'schemeName')?(reverseOrder=(!reverseOrder)): (reverseOrder = false);sortedColumn = 'schemeName';"
                                            ng-class="(sortedColumn == 'schemeName')?((reverseOrder)?('arrow-down') : ('arrow-up') ) : ('')"
                                    >
                                        Scheme Name
                                    </th>
                                    <th scope="col"
                                            class="modal-title title-case"
                                            ng-click="(sortedColumn == 'schemeStatus')?(reverseOrder=(!reverseOrder)): (reverseOrder = false);sortedColumn = 'schemeStatus';"
                                            ng-class="(sortedColumn == 'schemeStatus')?((reverseOrder)?('arrow-down') : ('arrow-up') ) : ('')"
                                    >
                                        Status
                                    </th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr
                                        class="cp"
                                        ng-repeat="x in vm.schemeList | filter:vm.modalSearch | orderBy:sortedColumn:reverseOrder"
                                        ng-click="vm.schemeCode = x.schemeCode; vm.schemeName = x.schemeName; vm.schemeStatus = x.schemeStatus"
                                        data-bs-dismiss="modal"
                                >

                                    <td>{{x.schemeName}}</td>
                                    <td>{{x.schemeStatus}}</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
                <div class="list_wrapper" ng-if="vm.schemeList.length==0">No records found to display.</div>
            </div>
        </div>
    </div>
</div>
