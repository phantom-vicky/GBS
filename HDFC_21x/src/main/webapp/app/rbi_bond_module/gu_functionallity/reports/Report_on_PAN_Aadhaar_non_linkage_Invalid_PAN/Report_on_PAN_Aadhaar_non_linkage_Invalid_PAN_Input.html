<div class="loader-new" data-ng-if="vm.loader"></div>
<div class="container from_wrapper new_form_wrapper">
    <h4 class="form_heading">Report on PAN-Aadhaar non-linkage/Invalid PAN</h4>
    <sol-header></sol-header>
    <form name="PanAadharForm" role="form">

        <div class="row">
            <div class="form-group">
                <div class="col-sm-3"></div>
                <div class="col-sm-3">
                    <label class="control-label">Name of the Module</label>
                </div>
                <div class="col-sm-5">
                    <label><b>RBI Bond</b></label>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <div class="col-sm-3"></div>
                <div class="col-sm-3">
                    <label class="control-label">BOD Date</label>
                </div>
                <div class="col-sm-4">
                    <label>{{vm.solDate | date : 'dd/MM/yyyy'}}</label>
                </div>
            </div>
        </div>

        <div class="row" data-ng-init="vm.getFinancialYears()">
            <div class="form-group required">
                <div class="col-sm-3"></div>
                <div class="col-sm-3">
                    <label class="control-label">Financial Year</label>
                </div>
                <div class="col-sm-2">
                    <select
                            class="form-control"
                            id="financial-year"
                            name="financial-year"
                            data-ng-model="vm.financialYear"
                    required >
                        <option value="" disabled selected>Select</option>
                        <option data-ng-repeat="year in vm.financialYears" value="{{year.financialYear}}" data-ng-bind="year.financialYear">
                        </option>
                    </select>

                </div>
            </div>
        </div>

        <div class="text-center form_submit">
            <button
                    type="submit"
                    id="submitButton"
                    class="btn btn-default"
                    data-ui-sref="report_on_pan_aadhar.inquiry_details({obj:{
                         financialYear : vm.financialYear
                        }})"
                    data-ng-disabled="PanAadharForm.$invalid"
            >
                Submit
            </button>
            <button type="button" class="btn btn-cancel" id="cancelButton" onclick="window.location.href= '#!/rbibond_gu_functionality';">Cancel</button>
        </div>

        <div class="text-center">
            <notice-message-directive></notice-message-directive>
        </div>
    </form>
</div>
