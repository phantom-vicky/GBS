<user-left-menu></user-left-menu>
<div class="loader-new" ng-if="vm.loader"></div>
<div class="container from_wrapper">
    <h4 class="form_heading  feature-heading">User - Modify</h4>
    <notice-message-directive></notice-message-directive>
    <form name="userModifyForm" role="form"  novalidate>
        <div class="row">
            <div class="form-group required">
                <label for="firstName" class="control-label col-sm-3 required">First Name</label>
                <div class="col-sm-2 inner-addon right-addon">
                    <input type="text" class="form-control" id="firstName" name="firstName" ng-model="vm.userDetails.firstName"  readonly>
                </div>
                <div class="col-sm-2"></div>
                <label for="lastName" class="control-label col-sm-3">Last Name</label>
                <div class="col-sm-2">
                    <input type="text" class="form-control" id="lastName" name="lastName" ng-model="vm.userDetails.lastName"  readonly>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="form-group required">
                <label for="solId" class="control-label col-sm-3">Sol ID</label>
                <div class="col-sm-2">
                    <input type="text" class="form-control" id="solId" name="solId" ng-model="vm.userDetails.solId" maxlength="8" required>
                </div>
                <div class="col-sm-2"></div>
                <label for="empCode" class="control-label col-sm-3">Employee Code</label>
                <div class="col-sm-2">
                    <input type="text" class="form-control" id="empCode" name="empCode" ng-model="vm.userDetails.employeeCode" readonly>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="form-group required">
                <label for="applicationName" class="control-label col-sm-3">Application Name</label>
                <div class="col-sm-2">
                    <select class="form-control" id="applicationName" name="applicationName" ng-model="vm.userDetails.applicationName" required>
                        <option value="">Select </option>
                        <option value="GU">GU</option>
                        <option value="DC">DC</option>
                    </select>
                </div>
                <div class="col-sm-2"></div>
                <label for="locationCode" class="control-label col-sm-3">Location Code</label>
                <div class="col-sm-2">
                    <input type="text" class="form-control" id="locationCode" name="locationCode" ng-model="vm.userDetails.locationCode" required>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="form-group">
                <label for="supervisorCode" class="control-label col-sm-3">Supervision Code</label>
                <div class="col-sm-2">
                    <input type="text" class="form-control" id="supervisorCode" name="supervisorCode" ng-model="vm.userDetails.supervisorCode" maxlength="15">
                </div>
                <div class="col-sm-2"></div>
                <label for="departmentCode" class="control-label col-sm-3">Department Code</label>
                <div class="col-sm-2">
                    <input type="text" class="form-control" id="departmentCode" name="departmentCode" ng-model="vm.userDetails.departmentCode">
                </div>
            </div>
        </div>
        <div class="row">
            <div class="form-group required">
                <label for="userType" class="control-label col-sm-3">User Type</label>
                <div class="col-sm-2">
                    <select class="form-control" id="userType" name="userType" ng-model="vm.userDetails.userType" required>
                        <option value="">Select </option>
                        <option value="B">Bank</option>
                        <option value="C">Contract</option>
                    </select>
                </div>
                <div class="col-sm-2"></div>
                <label ng-if="vm.userDetails.userType == 'C'" for="userPasswordExpiryDate" class="control-label col-sm-3">User Account Expiry Date</label>
                <div class="col-md-2">
                    <p class="input-group" ng-if="vm.userDetails.userType == 'C'">
                        <input type="text" class="form-control" id="userPasswordExpiryDate" uib-datepicker-popup="{{format}}" ng-model="vm.userDetails.userExpiryDate"
                               is-open="popup1.opened" datepicker-options="dateOptions" ng-required="true" close-text="Close" />
                        <span class="input-group-btn">
                            <button type="button" class="btn btn-secondary" ng-click="popup1.opened = true"><i class="glyphicon glyphicon-calendar"></i></button>
                        </span>
                    </p>
                </div>

            </div>
        </div>
        <div class="row">
            <div class="form-group required">
                <label class="control-label col-sm-3">Disable </label>
                <div class="col-sm-2" ng-init="vm.userDetails.userDisableStatus">
                        <ng-container ng-repeat="item in vm.commonYesNoMetaData">
                            <input type="radio" name="userDisableStatus" id="userDisableStatus{{$index}}"
                                   ng-model="vm.userDetails.userDisableStatus" ng-value="item.value" required>{{item.label}}
                        </ng-container>
                </div>
<!--            </div>-->
<!--            <div class="form-group"  ng-class="{'required': vm.userDetails.userStatus== 'Y'}">-->
                <div class="col-sm-2" ng-if="vm.userDetails.userDisableStatus=='Y'"></div>
                <label class="control-label col-sm-3" for="disableTill" ng-if="vm.userDetails.userDisableStatus=='Y'">Disable Till</label>
                <div class="col-md-2" ng-if="vm.userDetails.userDisableStatus=='Y'">
                    <p class="input-group">
                        <input type="text" class="form-control" id="disableTill" ng-init="vm.userDetails.userDisabledTill"
                               uib-datepicker-popup="dd/MM/yyyy" ng-model="vm.userDetails.userDisabledTill"
                               is-open="popup.opened" datepicker-options="vm.disableDateOptions" close-text="Close" required readonly />
                        <span class="input-group-btn">
                        <button type="button" class="btn btn-secondary" ng-click="popup.opened = true"><i class="glyphicon glyphicon-calendar"></i></button>
                    </span>
                    </p>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="form-group required">
                <label for="username" class="control-label col-sm-3">Username</label>
                <div class="col-sm-2">
                    <input type="text" class="form-control" id="username" name="username" ng-model="vm.userDetails.username" readonly>
                </div>
            </div>
        </div>
        <div class="col-sm-offset-5 col-sm-8 form_submit">
            <button type="submit" class="btn btn-default" ng-click="vm.editModifySubmit()" id="submitButton"
                    ng-disabled="userModifyForm.$invalid || userModifyForm.$pristine">Submit</button>
            <button type="button" class="btn btn-cancel" ng-click="vm.showCancelConfirmation()" id="cancelButton">Cancel</button>
        </div>
    </form>
</div>
