<div class="container from_wrapper">
		<left-menu-directive></left-menu-directive>
		<form name="systemParameterForm" role="form" ng-submit="submitForm(systemParameterForm.$valid, this)" novalidate>
			<h4 class="form_heading">System Parameter - Modify</h4>
			
			<notice-message-directive ></notice-message-directive>
			<div class="row" ng-repeat="systemParameter in systemParameters">
				<div class="form-group required">
					<div class="col-sm-2"></div>
					<label for="" class="control-label col-sm-5">{{systemParameter.parameterDesc}}</label>
					<div class="col-sm-3">
						<select class="form-control" ng-if="systemParameter.parameterType == 'N'" id="{{systemParameter.parameterId}}" name= "{{systemParameter.parameterId}}" ng-model="systemParameterScope[systemParameter.parameterId]">
							<option  
								ng-selected= "{{item.parameterValues == systemParameter.parameterValue}}" 
								ng-repeat="item in systemParametersDetails" 
								ng-if="item.parameterId == systemParameter.parameterId " 
								value="{{item.parameterValues}}" >
								{{item.parameterValDesc}}
							</option>
						</select>
						<input type="text" ng-if="systemParameter.parameterType == 'Y' && systemParameter.parameterId=='BNK_CODE'" class="form-control"  id="{{systemParameter.parameterId}}"  name= "{{systemParameter.parameterId}}" ng-model="systemParameterScope[systemParameter.parameterId]"  required  string-to-number allow-only-numbers maxlength='3'>
						<input type="text" ng-if="systemParameter.parameterType == 'Y' && systemParameter.parameterId=='DEF_PEN'" class="form-control"  id="{{systemParameter.parameterId}}"  name= "{{systemParameter.parameterId}}" ng-model="systemParameterScope[systemParameter.parameterId]"  required  string-to-number allow-only-numbers maxlength='4'>
						<input type="text" ng-if="systemParameter.parameterType == 'Y' && systemParameter.parameterId=='REC_PAY'" class="form-control"  id="{{systemParameter.parameterId}}"  name= "{{systemParameter.parameterId}}" ng-model="systemParameterScope[systemParameter.parameterId]"  required  string-to-number allow-only-numbers maxlength='5'>
						<input type="text" ng-if="systemParameter.parameterType == 'Y' && systemParameter.parameterId=='NPS_HIGHVL'" class="form-control"  id="{{systemParameter.parameterId}}"  name= "{{systemParameter.parameterId}}" ng-model="systemParameterScope[systemParameter.parameterId]"  required  string-to-number allow-only-numbers maxlength='5'>
						<input type="text" ng-if="systemParameter.parameterType == 'Y' && systemParameter.parameterId=='VER_CLASS'" class="form-control"  id="{{systemParameter.parameterId}}"  name= "{{systemParameter.parameterId}}" ng-model="systemParameterScope[systemParameter.parameterId]"  required  string-to-number allow-only-numbers maxlength='3'>
						
						
					  	<!--<p ng-show="systemParameterForm.min_num_contr.$invalid && !systemParameterForm.min_num_contr.$pristine" class="help-block alert alert-danger">Bank_Code_errormsg</p>-->
					</div>
				</div>
			</div>
				
			<div class="col-sm-offset-5 col-sm-8 form_submit">
				 <button type="submit" class="btn btn-default" id="submitButton" ng-disabled="systemParameterForm.$invalid">Update</button>
				 <button type="button" class="btn btn-cancel" id="cancelButton" ng-click="moveTo()">Cancel</button>
			</div>
		</form>

</div>
<!-- /.container-fluid -->
