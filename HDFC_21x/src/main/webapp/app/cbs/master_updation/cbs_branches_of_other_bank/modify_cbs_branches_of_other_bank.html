<div class="loader-new" ng-if="vm.loader"></div>
<div class="container from_wrapper">
	<cbs-left-menu></cbs-left-menu>	
	<h4 class="form_heading  feature-heading">Branches of Other Bank - Modify </h4>
	
		<notice-message-directive ></notice-message-directive>

	<form name="branchesOfOtherBankForm" role="form" ng-submit="submitForm(branchesOfOtherBankForm.$valid)" novalidate>
	<div class="row">
		 <div class="form-group" ng-class="requiredClass">
		  	<label for="branchCode" class ="control-label col-sm-3">Branch Code</label>
			<div class="col-sm-2">
					<input type="text" class="form-control" id="branchCode" name="branchCode" ng-model="vm.cbsBranchesOfOtherBank.branchCode" maxlength="5"  required>
			</div>
	       <div class="col-sm-2"></div>
		  	<label for="bankCode" class ="control-label col-sm-3">Bank Code</label>
			<div class="col-sm-2">
					<input type="text" class="form-control" id="bankCode" name="bankCode" ng-model="vm.cbsBranchesOfOtherBank.bankCode" maxlength="5"  required>
			</div>
		 </div>
	   </div>
	   <div class="row">
		 <div class="form-group ">
	    	<label for="micrCentreCode" class ="control-label col-sm-3">MICR Center Code</label>
			<div class="col-sm-2">
				<input type="text" class="form-control" id="micrCentreCode" name="micrCentreCode" ng-model="vm.cbsBranchesOfOtherBank.micrCentreCode" maxlength="3" >
			</div>
		    <div class="col-sm-2"></div>
		  	<label for="micrBankCode" class ="control-label col-sm-3">MICR Bank Code</label>
			<div class="col-sm-2">
				<input type="text" class="form-control" id="micrBankCode" name="micrBankCode" ng-model="vm.cbsBranchesOfOtherBank.micrBankCode" maxlength="3" >
			</div>
		 </div>
	   </div>
	   
	   <div class="row">
		 <div class="form-group ">
		  	<label for="micrBranchCode" class ="control-label col-sm-3">MICR Branch Code</label>
			<div class="col-sm-2">
				<input type="text" class="form-control" id="micrBranchCode" name="micrBranchCode" ng-model="vm.cbsBranchesOfOtherBank.micrBranchCode" maxlength="3" >
			</div>
		    <div class="col-sm-2"></div>
		  	<label for="branchName" class ="control-label col-sm-3">Branch Name</label>
				<div class="col-sm-2">
					<input type="text" class="form-control" id="branchName" name="branchName" ng-model="vm.cbsBranchesOfOtherBank.branchName" maxlength="20" >
			</div>
		</div>
	   </div>	
	  
	   <div class="row">
		 <div class="form-group">
		   <label for="branchAddr1" class ="control-label col-sm-3">Branch Address1</label>
			<div class="col-sm-2">
			 <input type="text" class="form-control" id="branchAddr1" name="branchAddr1" ng-model="vm.cbsBranchesOfOtherBank.branchAddr1" maxlength="45" >
			</div>
		    <div class="col-sm-2"></div>
		      	<label for="branchAddr2" class ="control-label col-sm-3">Branch Address2</label>
			<div class="col-sm-2">
			   <input type="text" class="form-control" id="branchAddr2" name="branchAddr2" ng-model="vm.cbsBranchesOfOtherBank.branchAddr2" maxlength="45" >
			</div>
		  </div>
	   </div>
	   <div class="row">
		 <div class="form-group ">
		 	<label for="branchAddr3" class ="control-label col-sm-3">Branch Address3</label>
			<div class="col-sm-2">
			    <input type="text" class="form-control" id="branchAddr3" name="branchAddr3" ng-model="vm.cbsBranchesOfOtherBank.branchAddr3" maxlength="45" >
			</div>
		   <div class="col-sm-2"></div>
		  	<label for="branchCityCode" class ="control-label col-sm-3">Branch City Code</label>
			<div class="col-sm-2">
				<input type="text" class="form-control" id="branchCityCode" name="branchCityCode" ng-model="vm.cbsBranchesOfOtherBank.branchCityCode" maxlength="5" >
			</div>
		 </div>
	   </div>
	  	<div class="row">
		  <div class="form-group ">
		  	<label for="branchStateCode" class ="control-label col-sm-3">Branch State Code</label>
			<div class="col-sm-2">
				<input type="text" class="form-control" id="branchStateCode" name="branchStateCode" ng-model="vm.cbsBranchesOfOtherBank.branchStateCode" maxlength="5" >
			</div>
		    <div class="col-sm-2"></div>
		  	<label for="branchPinCode" class ="control-label col-sm-3">Branch Pin Code</label>
			<div class="col-sm-2">
				<input type="text" class="form-control" id="branchPinCode" name="branchPinCode" ng-model="vm.cbsBranchesOfOtherBank.branchPinCode" maxlength="10"  allow-only-numbers>
			</div>
		 </div>
	   </div>
	   <div class="row">
			<div class="form-group">
			<label for="additionalText1" class="control-label col-sm-3">Additional Text1</label>
			 <div class="col-sm-2">
				<input type="text" class="form-control" name="additionalText1" id="additionalText1" ng-model="vm.cbsBranchesOfOtherBank.additionalText1" maxlength="40" >
				</div>
			<div class="col-sm-2"></div>
				<label for="additionalText2" class="control-label col-sm-3">Additional Text2</label>
				<div class="col-sm-2">
				  <input type="text" class="form-control" name="additionalText2" id="additionalText2" ng-model="vm.cbsBranchesOfOtherBank.additionalText2" maxlength="40" >
				</div>
			</div>
		</div>
		<div class="row">
		  <div class="form-group">
			<label for="additionalText3" class="control-label col-sm-3">Additional Text3</label>
				<div class="col-sm-2">
					<input type="text" class="form-control" name="additionalText3" id="additionalText3" ng-model="vm.cbsBranchesOfOtherBank.additionalText3" maxlength="40" >
				</div>
			</div>
		</div>
<div class="row">
			 <div class="col-sm-offset-5 col-sm-8 form_submit">
				 <button type="submit" class="btn btn-default" id="submitButton" ng-disabled="branchesOfOtherBankForm.$invalid">Update</button>
				 <button type="button" class="btn btn-cancel" id="cancelButton" ng-click="cancelOperation(action)" >Cancel</button>
			</div>
		</div>
	</form>
</div>



</div>
