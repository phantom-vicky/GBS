<div class="loader-new" data-ng-if="vm.loader"></div>
<div class="container from_wrapper new_form_wrapper">
    <h4 class="form_heading">Appendix IV </h4>
    <sol-header></sol-header>
    <form name="AppendixIV805Form" role="form">
        <div class="row">
            <div class="form-group required">
                <div class="col-sm-3"></div>
                <div class="col-sm-3">
                    <label for="moduleName" class="control-label">Name of the Bond Scheme</label>
                </div>
                <div class="col-sm-2">
                    <input type="text" class="form-control" id="moduleName" data-ng-model="vm.schemeName" required
                        readonly />
                </div>
                <div class="col-sm-2"
                    style="display: flex; align-items: center; height: 34px; gap: 5px; padding-left:0;">
                    <span class="glyphicon glyphicon-search cp" data-toggle="schemeName" id="treasurySearch"
                        data-ng-click="vm.getSchemeName();"></span>
                    <span class="glyphicon glyphicon-remove clear cp"
                        data-ng-click="vm.schemeCode =''; vm.schemeName=''; vm.fromDate=''; vm.toDate='';"></span>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="form-group required">
                <div class="col-sm-3"></div>
                <div class="col-sm-3">
                    <label class="control-label">From Date</label>
                </div>
                <div class="col-sm-2">
                    <p class="input-group">
                        <input
                                type="text"
                                class="form-control"
                                id="effFromDate1"
                                name="effFromDate"
                                data-ng-model="vm.fromDate"
                                data-uib-datepicker-popup="dd/MM/yyyy"
                                data-ng-init="vm.fromDate=''; vm.fromDateVal()"
                                data-ng-change="vm.toDateVal(vm.fromDate); vm.toDate=''"
                                data-datepicker-options="vm.fromDateOptions"
                                data-is-open="vm.effFromDatePicker.opened"
                                data-close-text="Close"
                                maxlength="10"
                                ng-blur="vm.textableDatePicker('effFromDate1',vm.fromDate)"
                                ng-keyup="vm.autoslashing('effFromDate1')" chars="numbers-slash"
                                required
                        />
                        <span class="input-group-btn" data-ng-if="vm.schemeCode">
                            <button type="button" class="btn btn-secondary"
                                data-ng-click="vm.effFromDatePicker.opened = true" id="effFromDateSearcher1">
                                <span class="glyphicon glyphicon-calendar"></span>
                            </button>
                        </span>
                    </p>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="form-group required">
                <div class="col-sm-3"></div>
                <div class="col-sm-3">
                    <label class="control-label">To Date</label>
                </div>
                <div class="col-sm-2">
                    <p class="input-group">
                        <input
                                type="text"
                                class="form-control"
                                id="effToDate"
                                name="effToDate"
                                data-ng-model="vm.toDate"
                                data-uib-datepicker-popup="dd/MM/yyyy"
                                data-ng-init="vm.toDate=''"
                                data-datepicker-options="vm.toDateOptions"
                                data-is-open="vm.effToDatePicker.opened"
                                data-close-text="Close"
                                maxlength="10"
                                ng-blur="vm.textableDatePicker('effToDate',vm.toDate)"
                                ng-keyup="vm.autoslashing('effToDate')" chars="numbers-slash"
                                required
                        />
                        <span class="input-group-btn" data-ng-if="vm.fromDate">
                            <button type="button" class="btn btn-secondary"
                                data-ng-click="vm.effToDatePicker.opened = true" id="effToDateSearcher">
                                <span class="glyphicon glyphicon-calendar"></span>
                            </button>
                        </span>
                    </p>
                </div>
            </div>
        </div>

        <div class="text-center form_submit">
            <button type="submit" id="submitButton" class="btn btn-default" data-ui-sref="Appendix_IV_805_Mar_2024.inquiry_details({obj:{
                        schemeCode      : vm.schemeCode,
                        fromDate        : vm.fromDate,
                        toDate          : vm.toDate,
                        schemeName      : vm.schemeName
                        }})" data-ng-disabled="AppendixIV805Form.$invalid">
                Submit
            </button>
            <button type="button" class="btn btn-cancel" id="cancelButton"
                onclick="window.location.href= '#!/rbibond_gu_functionality';">Cancel</button>
        </div>

        <div class="text-center">
            <notice-message-directive></notice-message-directive>
        </div>
    </form>
</div>
<div class="modal" id="schemeModel" role="dialog">
    <div class="modal-dialog">        <!-- Modal content-->
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-bs-dismiss="modal" data-ng-click="vm.searchSolId=''">&times;</button>
                <h4 class="modal-title">SCHEME CODE</h4></div>
            <div class="modal-body">
                <div class="loader_popup"></div>
                <div class="list_wrapper" ng-if="vm.schemeList.length>0">
                    <div class="col-sm-8 form_submit">
                        <div class="form-group">
                            <div class="input-group">
                                <div class="input-group-addon"><i class="glyphicon glyphicon-search"></i></div>
                                <input type="text" class="form-control" ng-model="vm.searchSolId" ng-init="vm.searchSolId = ''" placeholder="Search">
                            </div>
                        </div>
                    </div>
                    <div class="col-sm-4 form_submit"></div>
                    <div class="row">
                        <div class="col-sm-12">
                            <table class="table table-bordered list scroll sort">
                                <thead ng-init="reverseOrder=false;sortedColumn = 'subCode'">
                                <tr>
                                    <th class="modal-title title-case" ng-show="false">Scheme Code</th>
                                    <th ng-click="(sortedColumn == 'schemeName')?(reverseOrder=(!reverseOrder)): (reverseOrder = false);sortedColumn = 'schemeName';" ng-class="(sortedColumn == 'schemeName')?((reverseOrder)?('arrow-down') : ('arrow-up') ) : ('')">SCHEME NAME</th>
                                    <th ng-click="(sortedColumn == 'schemeStatus')?(reverseOrder=(!reverseOrder)): (reverseOrder = false);sortedColumn = 'schemeStatus';" ng-class="(sortedColumn == 'schemeStatus')?((reverseOrder)?('arrow-down') : ('arrow-up') ) : ('')">STATUS</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr class="cp" ng-repeat="x in vm.schemeList | filter:vm.searchSolId | orderBy:sortedColumn:reverseOrder" ng-click="vm.schemeCode= x.schemeCode;vm.schemeName= x.schemeName;" data-bs-dismiss="modal">
                                    <td>{{x.schemeName}}</td>
                                    <td>{{x.schemeStatus}}</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
                <div class="list_wrapper" ng-if="vm.schemeList.length==0">No records found to display.</div>
            </div>
        </div>
    </div>
</div>
