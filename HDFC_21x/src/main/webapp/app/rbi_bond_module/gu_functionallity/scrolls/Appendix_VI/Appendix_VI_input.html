<div class="loader-new" data-ng-if="vm.loader"></div>
<div class="container from_wrapper new_form_wrapper">
    <h4 class="form_heading">Appendix VI - Statement of Bonds Issued/Repaid for the Month</h4>
    <sol-header></sol-header>
    <form name="appendixVIForm" role="form">

        <div class="row">
            <div class="form-group">
                <div class="col-sm-3"></div>
                <div class="col-sm-3">
                    <label class="control-label">Branch Id</label>
                </div>
                <div class="col-sm-2">
                    <input type="text" class="form-control" id="branchId" data-ng-model="vm.branchId" readonly/>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <div class="col-sm-3"></div>
                <div class="col-sm-3">
                    <label class="control-label">Branch Name</label>
                </div>
                <div class="col-sm-2">
                    <input type="text" class="form-control" id="branchName" data-ng-model="vm.branchName" readonly/>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <div class="col-sm-3"></div>
                <div class="col-sm-3">
                    <label for="moduleName" class="control-label">Name of the Module</label>
                </div>
                <div class="col-sm-2">
                    <input type="text" class="form-control" id="moduleName" data-ng-model="vm.moduleName" data-ng-init="vm.moduleName='RBI Bond'" readonly/>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="form-group required">
                <div class="col-sm-3"></div>
                <div class="col-sm-3">
                    <label for="schemeName" class="control-label">Name of Scheme</label>
                </div>
                <div class="col-sm-2">
                    <input type="text" class="form-control" id="schemeName" data-ng-model="vm.schemeName" required readonly/>
                </div>
                <div class="col-sm-2" style="display: flex; align-items: center; height: 34px; gap: 5px; padding-left:0;">
                    <span class="glyphicon glyphicon-search cp" id="schemeSearch" data-ng-click="vm.getSchemeName();"></span>
                    <span class="glyphicon glyphicon-remove clear cp" data-ng-click="vm.schemeCode=''; vm.schemeName=''; vm.schemeStatus=''; vm.fromDate=''; vm.toDate='';"></span>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="form-group required">
                <div class="col-sm-3"></div>
                <div class="col-sm-3">
                    <label class="control-label">From Date (dd/mm/yyyy)</label>
                </div>
                <div class="col-sm-2">
                    <p class="input-group">
                        <input type="text" class="form-control" id="effFromDate"
                               name="effFromDate" ng-model="vm.fromDate"
                               uib-datepicker-popup="dd/MM/yyyy" ng-init="vm.fromDate=''; vm.dateValidation();"
                               datepicker-options="vm.dateOptions" ng-change="vm.dateValidation();"
                               is-open="vm.effFromDatePicker.opened" close-text="Close"
                               maxlength="10" readonly required>
                        <span class="input-group-btn" ng-if="vm.schemeName">
                            <button type="button" class="btn btn-secondary"
                                    ng-click="vm.effFromDatePicker.opened = true"
                                    id="effFromDateSearcher">
                                <i class="glyphicon glyphicon-calendar"></i>
                            </button>
                        </span>
                    </p>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="form-group required">
                <div class="col-sm-3"></div>
                <div class="col-sm-3">
                    <label class="control-label">To Date (dd/mm/yyyy)</label>
                </div>
                <div class="col-sm-2">
                    <p class="input-group">
                        <input type="text" class="form-control" id="effToDate"
                               name="effToDate" ng-model="vm.toDate"
                               uib-datepicker-popup="dd/MM/yyyy" ng-init="vm.toDate=''"
                               datepicker-options="vm.dateToOptions"
                               is-open="vm.effToDatePicker.opened" close-text="Close"
                               maxlength="10" readonly required>
                        <span class="input-group-btn" ng-if="vm.fromDate">
                            <button type="button" class="btn btn-secondary"
                                    ng-click="vm.effToDatePicker.opened = true"
                                    id="effToDateSearcher">
                                <i class="glyphicon glyphicon-calendar"></i>
                            </button>
                        </span>
                    </p>
                </div>
            </div>
        </div>

        <div class="text-center form_submit">
            <button type="submit" id="submitButton"
                    ui-sref="appendix_vi.inquiry_details({obj:{
                        schemeCode: vm.schemeCode,
                        schemeName: vm.schemeName,
                        fromDate: vm.fromDate,
                        toDate: vm.toDate
                    }})"
                    class="btn btn-default"
                    data-ng-disabled="appendixVIForm.$invalid">
                Submit
            </button>
            <button type="button" class="btn btn-cancel" id="cancelButton"
                    onclick="window.location.href= '#!/rbibond_gu_functionality';">
                Cancel
            </button>
        </div>

        <div class="text-center">
            <notice-message-directive></notice-message-directive>
        </div>
    </form>
</div>

<div class="modal" id="schemeModel" role="dialog">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-bs-dismiss="modal" data-ng-click="vm.modalSearch = ''">&times;</button>
                <h4 class="modal-title">Scheme Code</h4>
            </div>
            <div class="modal-body">
                <div class="loader_popup"></div>
                <div class="list_wrapper" data-ng-if="vm.schemeList.length>0">
                    <div class="col-sm-8 form_submit">
                        <div class="form-group">
                            <div class="input-group">
                                <div class="input-group-addon">
                                    <span class="glyphicon glyphicon-search"></span>
                                </div>
                                <input type="text" class="form-control" data-ng-model="vm.modalSearch" data-ng-init="vm.modalSearch = ''" placeholder="Search" oninput="this.value = this.value.replace(/^\s+/, '').replace(/\s{2,}/g, ' ')"/>
                            </div>
                        </div>
                    </div>
                    <div class="col-sm-4 form_submit"></div>
                    <div class="row">
                        <div class="col-sm-12">
                            <table class="table table-bordered list scroll sort" aria-label="">
                                <thead data-ng-init="reverseOrder=true;sortedColumn = 'schemeName'">
                                <tr>
                                    <th scope="col"
                                        data-ng-click="(sortedColumn == 'schemeName')?(reverseOrder=(!reverseOrder)): (reverseOrder = false);sortedColumn = 'schemeName';"
                                        data-ng-class="(sortedColumn == 'schemeName')?((reverseOrder)?('arrow-down') : ('arrow-up') ) : ('')">
                                        SCHEME NAME
                                    </th>
                                    <th scope="col"
                                        data-ng-click="(sortedColumn == 'schemeStatus')?(reverseOrder=(!reverseOrder)): (reverseOrder = false);sortedColumn = 'schemeStatus';"
                                        data-ng-class="(sortedColumn == 'schemeStatus')?((reverseOrder)?('arrow-down') : ('arrow-up') ) : ('')">
                                        STATUS
                                    </th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr class="cp"
                                    data-ng-repeat="x in vm.schemeList | filter:vm.modalSearch | orderBy:sortedColumn:reverseOrder"
                                    data-ng-click="vm.selectScheme(x)"
                                    data-bs-dismiss="modal">
                                    <td>{{x.schemeName || x.subCodeDescription}}</td>
                                    <td>{{x.schemeStatus || x.status || '-'}}</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
                <div class="list_wrapper" data-ng-if="vm.schemeList.length==0">No records found to display.</div>
            </div>
        </div>
    </div>
</div>
