<div class="loader-new" ng-if="vm.loader"></div>
<dc-left-menu></dc-left-menu>
<div class="container from_wrapper new_form_wrapper">
    <h4 class="form_heading">RBI Bond Scheme Parameters - Inquiry</h4>
    <sol-header></sol-header>
    <form name="cbdtSchemeParameterCreationForm" role="form">
        <div class="col-sm-9 col-sm-offset-3">
            <div class="row">
                <div class="form-group">
                    <div class="col-sm-4">
                        <label class="control-label">Name of the Module</label>
                    </div>
                    <div class="col-sm-6">
                        <label><b>RBI Bond</b></label>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="form-group">
                    <div></div>
                    <div class="col-sm-4">
                        <label class="control-label">Name of the Scheme</label>
                    </div>
                    <div class="col-sm-3">
                        <input type="text" class="form-control" id="moduleName" ng-model="vm.schemeName" required readonly>
                    </div>
                    <div class="col-sm-2">
                        <i class="glyphicon glyphicon-search cp" data-bs-toggle="modal" id="schemeNameSearcher" ng-click="vm.getInquiryVersionTourch();vm.schemeCode = '';"></i>
                        <i class="glyphicon glyphicon-remove clear cp" ng-click="vm.schemeName='';"></i>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="form-group required">
                    <div class="col-sm-4">
                        <label for="versionNo" class="control-label">Version No</label>
                    </div>
                    <div class="col-sm-3">
                        <input type="text" class="form-control" id="versionNo" ng-init="vm.versionNo=''"
                               ng-model="vm.versionNo" required readonly>
                    </div>
                    <div class="col-sm-2" ng-if="vm.schemeCode">
                        <i class="glyphicon glyphicon-search cp" data-bs-toggle="modal"
                           id="versionNoSearch"
                           ng-click="vm.getInquiryDetails('versionNo')"></i> <i
                            class="glyphicon glyphicon-remove clear cp"
                            ng-click="vm.versionNo = vm.effFromDate = ''"></i>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="form-group required">
                    <div class="col-sm-4">
                        <label for="effFromDate" class="control-label">Parameter Effective From Date</label>
                    </div>
                    <div class="col-sm-3">
                        <input type="text" class="form-control" id="effFromDate"
                               name="effFromDate"
                               ng-model="vm.effFromDate" required readonly>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-sm-6 col-sm-offset-3">
            <div class="text-center form_submit">
                <button type="submit" class="btn btn-default" id="submitButton"
                        ui-sref="rbibond_scheme_parameter.inquiry_detail({obj:{
                                versionNo: vm.versionNo,
                                effFromDate : vm.effFromDate,
                                schemeCode : vm.schemeCode,
                                schemeName : vm.schemeName,
                            }})" ng-disabled="cbdtSchemeParameterCreationForm.$invalid">Submit</button>
                <button type="button" class="btn btn-cancel" id="cancelButton"
                        onclick="window.location.href= '#!/dc_rbi_bond_menu';">Cancel</button>
            </div>
            <div class="text-center">
                <notice-message-directive></notice-message-directive>
            </div>
        </div>

    </form>
</div>
<!-- Version Details -->
<div class="modal" id="versionNoModal" role="dialog">
    <div class="modal-dialog">
        <!-- Modal content-->
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-bs-dismiss="modal">&times;</button>
                <h4 class="modal-title">Versions List</h4>
            </div>
            <div class="modal-body">
                <div class="loader_popup"></div>
                <div class="list_wrapper" ng-if="vm.versionNoList.length>0">
                    <div class="col-sm-8 form_submit">
                        <div class="form-group">
                            <div class="input-group">
                                <div class="input-group-addon">
                                    <i class="glyphicon glyphicon-search"></i>
                                </div>
                                <input type="text" class="form-control"
                                       ng-model="vm.versionNoSearch"
                                       placeholder="Search"  chars="alpha-numeric">
                            </div>
                        </div>
                    </div>
                    <div class="col-sm-4 form_submit"></div>
                    <div class="row">

                        <div class="col-sm-12">
                            <table class="table table-bordered list scroll sort">
                                <thead ng-init="reverseOrder=true;sortedColumn = 'versionNo'">
                                <tr>
                                    <th ng-click="(sortedColumn == 'versionNo')?(reverseOrder=(!reverseOrder)): (reverseOrder = false);sortedColumn = 'versionNo';" ng-class="(sortedColumn == 'versionNo')?((reverseOrder)?('arrow-down') : ('arrow-up') ) : ('')">Version No</th>
                                    <th ng-click="(sortedColumn == 'effFromDate')?(reverseOrder=(!reverseOrder)): (reverseOrder = false);sortedColumn = 'effFromDate';" ng-class="(sortedColumn == 'effFromDate')?((reverseOrder)?('arrow-down') : ('arrow-up') ) : ('')">Parameter Effective From Date</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr class="cp"
                                    ng-repeat="x in vm.versionNoList | filter:vm.versionNoSearch | orderBy:sortedColumn:reverseOrder"
                                    ng-click="vm.versionNo = x.versionNo; vm.effFromDate = x.effFromDate" data-bs-dismiss="modal">
                                    <td>{{x.versionNo}}</td>
                                    <td>{{x.effFromDate}}</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
                <div class="list_wrapper" ng-if="vm.versionNoList.length==0">No records found to display.</div>
            </div>
        </div>
    </div>
</div>
<!-- Treasury Details - End -->
<div class="modal" id="schemeNameSearcherPopUp" role="dialog">
    <div class="modal-dialog">
        <!-- Modal content-->
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-bs-dismiss="modal">&times;</button>
                <h4 class="modal-title">Name of the bond scheme</h4>
            </div>
            <div class="modal-body">
                <div class="loader_popup"></div>
                <div class="list_wrapper" ng-if="vm.schemeNameList.length>0">
                    <div class="col-sm-8 form_submit">
                        <div class="form-group">
                            <div class="input-group">
                                <div class="input-group-addon">
                                    <i class="glyphicon glyphicon-search"></i>
                                </div>
                                <input type="text"  class="form-control" ng-model="vm.schemeCode" ng-init="vm.schemeCode = ''" placeholder="Search">
                            </div>
                        </div>
                    </div>
                    <div class="col-sm-4 form_submit"></div>
                    <div class="row">

                        <div class="col-sm-12">
                            <table class="table table-bordered list scroll">
                                <thead ng-init="reverseOrder = false; sortedColumn = 'schemeName'">
                                <tr>
                                    <th class="modal-title title-case" ng-click="(sortedColumn == 'schemeName')?(reverseOrder=(!reverseOrder)): (reverseOrder = false);sortedColumn = 'schemeName';" ng-class="(sortedColumn == 'schemeName')?((reverseOrder)?('arrow-down') : ('arrow-up') ) : ('')">Scheme Name</th>
                                    <th class="modal-title title-case" ng-click="(sortedColumn == 'schemeStatus')?(reverseOrder=(!reverseOrder)): (reverseOrder = false);sortedColumn = 'schemeStatus';" ng-class="(sortedColumn == 'schemeStatus')?((reverseOrder)?('arrow-down') : ('arrow-up') ) : ('')">Scheme Status</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr class="cp"
                                    ng-repeat="x in vm.schemeNameList | filter:vm.schemeCode | orderBy:sortedColumn:reverseOrder"
                                    ng-click="vm.schemeCode=x.schemeCode;vm.schemeName=x.schemeName"  data-bs-dismiss="modal">
                                    <td>{{x.schemeName}}</td>
                                    <td>{{x.schemeStatus}}</td>
                                </tr>
                                <!--                                <tr class="cp" ng-repeat="x in vm.branchIdList" ng-click="vm.searchBranchId = x.branchId;vm.branchName = x.branchName;vm.crn.no=x.crn.no;" data-bs-dismiss="modal">-->
                                <!--                                    <td>{{x.branchId}}</td>-->
                                <!--                                    <td>{{x.branchName}}</td>-->
                                <!--                                </tr>-->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
                <div class="list_wrapper" ng-if="vm.schemeNameList.length==0">No records found to display.</div>
            </div>
        </div>
    </div>
</div>
