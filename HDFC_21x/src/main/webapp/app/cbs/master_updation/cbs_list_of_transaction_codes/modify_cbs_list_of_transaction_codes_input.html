<div class="loader-new" ng-if="vm.loader"></div>
<cbs-left-menu></cbs-left-menu>
<div class="container from_wrapper new_form_wrapper">

    <h4 class="form_heading">List Of Transaction
        Codes - Modify</h4>
    <sol-header></sol-header>
    <form name="listofTransactionCodesModifyForm" role="form">
        <div class="col-sm-6 col-sm-offset-3">

            <div class="row">
                <div class="form-group required">
                    <div class="col-sm-6">
                        <label for="clearingTransactionCode" class="control-label">Clearing Transaction Code</label>
                    </div>
                    <div class="col-sm-4">
                        <input type="text" class="form-control" id="clearingTransactionCode"
                               ng-model="vm.clearingTransactionCode" readonly required>
                    </div>
                    <div class="col-sm-2">
                        <i class="glyphicon glyphicon-search cp" data-bs-toggle="modal"
                           id="clearingTransactionCodeSearch"
                           ng-click="vm.modifyTorch();"></i> <i
                            class="glyphicon glyphicon-remove clear cp"
                            ng-click="vm.clearingTransactionCode ='';vm.typeOfInstrument='';"></i>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="form-group required">
                    <div class="col-sm-6">
                        <label for="clgTranCodeDesc" class="control-label">Transaction Code Description</label>
                    </div>
                    <div class="col-sm-4">
                        <input type="text" class="form-control" id="clgTranCodeDesc"
                               ng-model="vm.clearingTransactionCodeDescription" readonly required  ng-disabled="true">
                    </div>
                </div>
            </div>
            <div class="text-center form_submit">
                <button type="submit" class="btn btn-default" id="submitButton"
                        ui-sref="cbs_list_of_transaction_codes.modify_form({obj:{
								clearingTransactionCode: vm.clearingTransactionCode,
								clearingTransactionCodeDescription: vm.clearingTransactionCodeDescription,
								modifyLists : vm.modifyLists,
								}})"
                        ng-disabled="listofTransactionCodesModifyForm.$invalid">Submit</button>
                <button type="button" class="btn btn-cancel" id="cancelButton"
                        onclick="window.location.href = '#!/cbs_master_updation'">Cancel</button>
            </div>
            <div class="text-center">
                <notice-message-directive></notice-message-directive>
            </div>
        </div>
    </form>
</div>


<!-- Clearing Transaction Code Start-->
<div class="modal" id="modifyModel1" role="dialog">
    <div class="modal-dialog">
        <!-- Modal content-->
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-bs-dismiss="modal">&times;</button>
                <h4 class="modal-title">Clearing Transaction Code</h4>
            </div>
            <div class="modal-body">
                <div class="loader_popup"></div>
                <div class="list_wrapper" ng-if="vm.modifyLists.length>0">
                    <div class="col-sm-8 form_submit">
                        <div class="form-group">
                            <div class="input-group">
                                <div class="input-group-addon">
                                    <i class="glyphicon glyphicon-search"></i>
                                </div>
                                <input type="text" class="form-control"
                                       ng-model="vm.searchSolId" ng-init="vm.searchSolId = ''"
                                       placeholder="Search">
                            </div>
                        </div>
                    </div>
                    <div class="col-sm-4 form_submit"></div>
                    <div class="row">

                        <div class="col-sm-12">
                            <table class="table table-bordered list scroll sort">
                                <thead ng-init="reverseOrder=false;sortedColumn = 'clearingTransactionCode'">
                                <tr>
                                    <th width="27%" ng-click="(sortedColumn == 'clearingTransactionCode')?(reverseOrder=(!reverseOrder)): (reverseOrder = false);sortedColumn = 'bankCode';" ng-class="(sortedColumn == 'clearingTransactionCode')?((reverseOrder)?('arrow-down') : ('arrow-up') ) : ('')">Clearing Transaction Code</th>
                                    <th width="27%" ng-click="(sortedColumn == 'clearingTransactionCode')?(reverseOrder=(!reverseOrder)): (reverseOrder = false);sortedColumn = 'bankCode';" ng-class="(sortedColumn == 'clearingTransactionCode')?((reverseOrder)?('arrow-down') : ('arrow-up') ) : ('')">Transaction Code Description</th>
                                </thead>
                                <tbody>
                                <tr class="cp"
                                    ng-repeat="x in vm.modifyLists | filter:vm.searchSolId | orderBy:sortedColumn:reverseOrder"
                                    ng-click="vm.clearingTransactionCode= x.clgTranCode;vm.clearingTransactionCodeDescription=x.clgTranCodeDesc;vm.modifyTorch();" data-bs-dismiss="modal">
                                    <td width="27%">{{x.clgTranCode}}</td>
                                    <td width="27%">{{x.clgTranCodeDesc}}</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
                <div class="list_wrapper" ng-if="vm.modifyLists.length==0">No records found to display.</div>
            </div>

        </div>
    </div>
</div>
<!-- Clearing Transaction Code End-->
