<div class="loader-new" ng-if="vm.loader"></div>
<dc-left-menu></dc-left-menu>
<div class="container from_wrapper new_form_wrapper">

    <h4 class="form_heading">Broker Master Maintenance - Verify/Reject</h4>
    <sol-header></sol-header>
    <form name="tdsparameter" role="form">

        <div class="row">
            <div class="form-group">
                <div class="col-sm-3"></div>
                <div class="col-sm-3">
                    <label for="moduleName" class="control-label">Name of the Module</label>
                </div>
                <div class="col-sm-4">
                    <label><b>RBI Bond</b></label>
                </div>
            </div>
        </div>


        <div class="row">
            <div class="form-group required">
                <div class="col-sm-3"></div>
                <div class="col-sm-3">
                    <label for="rbiCode" class="control-label">Broker Agency Code</label>
                </div>
                <div class="col-sm-2">
                    <input type="text" class="form-control" id="rbiCode"
                           ng-model="vm.brokerAgencyCode" chars="alpha-numeric" required readonly>
                </div>
                <div class="col-sm-1">
                    <div>
                        <i class="glyphicon glyphicon-search cp" data-bs-toggle="modal"
                           id="branchIdSearch"
                           ng-click="vm.getVerifyDeleteTorch('torch');"></i> <i
                            class="glyphicon glyphicon-remove clear cp"
                            ng-click="vm.brokerAgencyCode='';"></i>
                    </div>
                </div>
            </div>
        </div>


        <div class="text-center form_submit">
            <button type="submit" id="submitbutton" class="btn btn-default"
                    ui-sref="broker_master_rbi_bond.verify_detail({obj:{
                                    brokerAgencyCode: vm.brokerAgencyCode,
								}})"
                    ng-disabled="tdsparameter.$invalid">Submit</button>
            <button type="button" class="btn btn-cancel" id="cancelButton"
                    onclick="window.location.href= '#!/broker_master_rbi_bond/action/inquiry';">Cancel
            </button>
        </div>

        <div class="text-center">
            <notice-message-directive></notice-message-directive>
        </div>
    </form>
</div>






<div class="modal" id="rbiCodeModal" role="dialog">
    <div class="modal-dialog">
        <!-- Modal content-->
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-bs-dismiss="modal">&times;</button>
                <h4 class="modal-title">Broker Agency Code List</h4>
            </div>
            <div class="modal-body">
                <div class="loader_popup"></div>
                <div class="list_wrapper" ng-if="vm.rbiCodeList.length>0">
                    <div class="col-sm-8 form_submit">
                        <div class="form-group">
                            <div class="input-group">
                                <div class="input-group-addon">
                                    <i class="glyphicon glyphicon-search"></i>
                                </div>
                                <input type="text" class="form-control" ng-keypress="allowAlphaNumericSlash($event);"
                                       ng-model="vm.searchSolId" ng-init="vm.searchSolId = ''"
                                       placeholder="Search">
                            </div>
                        </div>
                    </div>
                    <div class="col-sm-4 form_submit"></div>
                    <div class="row">

                        <div class="col-sm-12">

                            <table class="table table-bordered list scroll">
                                <thead ng-init="reverseOrder = false; sortedColumn = 'tdsCode'">
                                <tr>
                                    <th class="modal-title title-case" ng-click="(sortedColumn == 'brokerAgencyCode')?(reverseOrder=(!reverseOrder)): (reverseOrder = false);sortedColumn = 'brokerAgencyCode';" ng-class="(sortedColumn == 'brokerAgencyCode')?((reverseOrder)?('arrow-down') : ('arrow-up') ) : ('')">Broker Agency Code</th>
                                    <th class="modal-title title-case" ng-click="(sortedColumn == 'brokerName')?(reverseOrder=(!reverseOrder)): (reverseOrder = false);sortedColumn = 'brokerName';" ng-class="(sortedColumn == 'brokerName')?((reverseOrder)?('arrow-down') : ('arrow-up') ) : ('')">Broker Name</th>
<!--                                    <th class="modal-title title-case" ng-click="(sortedColumn == 'operativeBranchId')?(reverseOrder=(!reverseOrder)): (reverseOrder = false);sortedColumn = 'operativeBranchId';" ng-class="(sortedColumn == 'operativeBranchId')?((reverseOrder)?('arrow-down') : ('arrow-up') ) : ('')">Branch Id</th>-->
                                    <th class="modal-title title-case" ng-click="(sortedColumn == 'verifiedStatus')?(reverseOrder=(!reverseOrder)): (reverseOrder = false);sortedColumn = 'verifiedStatus';" ng-class="(sortedColumn == 'verifiedStatus')?((reverseOrder)?('arrow-down') : ('arrow-up') ) : ('')">Verified Status</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr class="cp"
                                    ng-repeat="x in vm.rbiCodeList | filter:vm.searchSolId | orderBy:sortedColumn:reverseOrder"
                                    ng-click="vm.brokerAgencyCode=x.brokerAgencyCode;"  data-bs-dismiss="modal">
                                    <td>{{x.brokerAgencyCode}}</td>
                                    <td>{{x.brokerName}}</td>
<!--                                    <td>{{x.operativeBranchId}}</td>-->
                                    <td>{{x.verifiedStatus | getLabelFromValuesArray : vm.commonYesNoMetaData}}</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>

                    </div>
                </div>
                <div class="list_wrapper" ng-if="vm.rbiCodeList.length==0">No records found to display.</div>
            </div>

        </div>
    </div>
</div>
