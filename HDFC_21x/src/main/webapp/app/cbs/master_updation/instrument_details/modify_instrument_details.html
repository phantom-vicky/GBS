<div class="loader-new" ng-if="vm.loader"></div>
	<cbs-left-menu></cbs-left-menu>
<div class="container from_wrapper">
	<h4 class="form_heading  feature-heading">Instrument Details - Modify</h4>
	<div  >
		<notice-message-directive ></notice-message-directive>
	</div>
	<form name="instrumentDetailsForm" role="form" ng-submit="submitForm(instrumentDetailsForm.$valid)" novalidate>
		<div class="row">
			<div class="form-group required">
				<div class="col-sm-3"></div>
				<label for="drCrIndicator" class="control-label col-sm-3">Debit or Credit Indicator</label>
				<div class="col-sm-3">
					<select class="form-control" id="drCrIndicator" name="drCrIndicator" ng-model="vm.instrumentDetails.drCrIndicator"  required>
						<option ng-selected= "{{vm.instrumentDetails.drCrIndicator == ''}}" value="">Select</option>
						<option ng-selected= "{{vm.instrumentDetails.drCrIndicator == 'C'}}" value="C">Credit</option>
						<option ng-selected= "{{vm.instrumentDetails.drCrIndicator == 'D'}}" value="D">Debit</option>
					</select>					
				</div>
			</div>
		</div>
		<div class="row">
			<div class="form-group required">
			<div class="col-sm-3"></div>
				<label for="instrumentType" class="control-label col-sm-3">Type of Instrument</label>
				<div class="col-sm-3">
					<select class="form-control" id="instrumentType" name="instrumentType" ng-init="vm.instrumentDetails.instrumentType = typeOfInstrumentList[0]" ng-model="vm.instrumentDetails.instrumentType"  required>
						<option ng-selected = "{{vm.instrumentDetails.instrumentType == ''}}" value="">Select</option>
						<option  ng-selected= "{{x == vm.instrumentDetails.instrumentType}}" ng-repeat="(x,y) in typeOfInstrumentList" value="{{x}}">{{y}}</option>
					</select>
				</div>
			</div>
		</div>
		<div class="row">
			<div class="form-group required">
			<div class="col-sm-3"></div>
				<label for="schemeCode" class="control-label col-sm-3">Scheme Code</label>
				<div class="col-sm-3">
					<input type="text" class="form-control" name="schemeCode" id="schemeCode" chars="alpha-numeric" ng-model="vm.instrumentDetails.schemeCode" maxlength="5"  required>
				</div>
			</div>
		</div>
		<div class="row">
			<div class="form-group">
			<div class="col-sm-3"></div>
				<label for="additionalText1" class="control-label col-sm-3">Additional Text1</label>
				<div class="col-sm-3">
					<input type="text" class="form-control" name="additionalText1" id="additionalText1" ng-model="vm.instrumentDetails.additionalText1" maxlength="40" >
				</div>
			</div>
		</div>
		<div class="row">
			<div class="form-group">
			<div class="col-sm-3"></div>
				<label for="additionalText2" class="control-label col-sm-3">Additional Text2</label>
				<div class="col-sm-3">
					<input type="text" class="form-control" name="additionalText2" id="additionalText2" ng-model="vm.instrumentDetails.additionalText2" maxlength="40" >
				</div>
			</div>
		</div>
		<div class="row">
			<div class="form-group">
			<div class="col-sm-3"></div>
				<label for="additionalText3" class="control-label col-sm-3">Additional Text3</label>
				<div class="col-sm-3">
					<input type="text" class="form-control" name="additionalText3" id="additionalText3" ng-model="vm.instrumentDetails.additionalText3" maxlength="40" >
				</div>
			</div>
		</div>
		<div class="row">
			 <div class="col-sm-offset-5 col-sm-8 form_submit">
				 <button type="submit" class="btn btn-default" id="submitButton" ng-disabled="instrumentDetailsForm.$invalid" ng-click="vm.modify()" >Update</button>
				<button type="button" class="btn btn-cancel" id="cancelButton" onclick="window.location.href = '#!/'" >Cancel</button>
			</div>
		</div>
	</form>
</div>
