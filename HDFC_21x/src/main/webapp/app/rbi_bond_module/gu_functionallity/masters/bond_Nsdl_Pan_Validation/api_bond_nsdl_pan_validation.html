<div class="loader-new" ng-if="vm.loader"></div>
<dc-left-menu></dc-left-menu>
<div class="container from_wrapper new_form_wrapper">
    <h4 class="form_heading">NSDL Pan Validation - API</h4>
    <sol-header></sol-header>
    <form name="bondNsdlPanValidationForm" role="form">
        <div class="col-sm-6 col-sm-offset-3">
            <div class="row">
                <div class="form-group required">
                    <div class="col-sm-6">
                        <label for="moduleName" class="control-label">Name of the module</label>
                    </div>
                    <div class="col-sm-4">
                        <input type="text" class="form-control" id="moduleName" ng-model="vm.moduleName"
                               required readonly>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="form-group required">
                    <div class="col-sm-6">
                        <label class="control-label">Scheme Name</label>
                    </div>
                    <div class="col-sm-4">
                        <input type="text" class="form-control" id="schemeName"
                               name="schemeName" ng-model="vm.schemeName" readonly required>
                    </div>
                    <div class="col-sm-2">
                        <i class="glyphicon glyphicon-search cp" data-bs-toggle="modal"
                           id="levelNameSearcher"
                           ng-click="vm.getModuleName();vm.searchlevelName = ''"></i>
                        <i class="glyphicon glyphicon-remove clear cp"
                           ng-click="vm.schemeName='';vm.halfYear='';"></i>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="form-group required">
                    <div class="col-sm-6">
                        <label class="control-label">Interest for the Half Year</label>
                    </div>
                    <div class="col-sm-4">
                        <input type="text" class="form-control" id="halfYear"
                               name="halfYear" ng-model="vm.halfYear" readonly required>
                    </div>
                    <div class="col-sm-2" ng-if="vm.schemeName">
                        <i class="glyphicon glyphicon-search cp" data-bs-toggle="modal"
                           id="levelNameSearcher1"
                           ng-click="vm.getHalfYearList();vm.searchlevelName1 = ''"></i>
                        <i class="glyphicon glyphicon-remove clear cp"
                           ng-click="vm.halfYear='';vm.schemeName='';vm.schemeCode='';"></i>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="form-group required">
                    <div class="col-sm-6">
                        <label for="year" class="control-label">Year</label>
                    </div>
                        <div class="col-sm-4">
                            <input type="text" class="form-control" id="year" ng-model="vm.year"
                                   required readonly>
                        </div>
                    </div>
                </div>
            <div class="text-center form_submit">
                <button type="submit" class="btn btn-default" id="submitButton" ng-click="vm.apiPanTriggerSubmit();"
                        ng-disabled="bondNsdlPanValidationForm.$invalid">Trigger</button>
                <button type="button" class="btn btn-cancel" id="cancelButton"
                        onclick="window.location.href= '#!/bond_nsdl_pan_validation/action/inquiry'">Cancel</button>
            </div>
            <div class="text-center">
                <notice-message-directive></notice-message-directive>
            </div>
        </div>
    </form>
</div>

<div class="modal" id="halfYearModal" role="dialog">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-bs-dismiss="modal">&times;</button>
                <h4 class="modal-title">Half Year List</h4>
            </div>
            <div class="modal-body">
                <div class="loader_popup"></div>
                <div class="list_wrapper" ng-if="vm.halfYearList.length>0">
                    <div class="col-sm-8 form_submit">
                        <div class="form-group">
                            <div class="input-group">
                                <div class="input-group-addon">
                                    <i class="glyphicon glyphicon-search"></i>
                                </div>
                                <input type="text" class="form-control"
                                       ng-model="vm.searchlevelName1" ng-init="vm.searchlevelName1 = ''"
                                       placeholder="Search">
                            </div>
                        </div>
                    </div>
                    <div class="col-sm-4 form_submit"></div>
                    <div class="row">
                        <div class="col-sm-12">
                            <table class="table table-bordered list scroll">
                                <thead ng-init="reverseOrder = false; sortedColumn = 'halfYear'">
                                <tr>
                                    <th class="modal-title title-case" ng-click="(sortedColumn == 'halfYear')?(reverseOrder=(!reverseOrder)): (reverseOrder = false);sortedColumn = 'halfYear';" ng-class="(sortedColumn == 'halfYear')?((reverseOrder)?('arrow-down') : ('arrow-up') ) : ('')">Month</th>
                                    <th class="modal-title title-case" ng-click="(sortedColumn == 'schemeStatus')?(reverseOrder=(!reverseOrder)): (reverseOrder = false);sortedColumn = 'schemeStatus';" ng-class="(sortedColumn == 'schemeStatus')?((reverseOrder)?('arrow-down') : ('arrow-up') ) : ('')">Year</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr class="cp"
                                    ng-repeat="x in vm.halfYearList | filter:vm.searchlevelName1 | orderBy:sortedColumn:reverseOrder"
                                    ng-click="vm.halfYear=x.halfYear;vm.year=x.year"  data-bs-dismiss="modal">
                                    <td>{{x.halfYear}}</td>
                                    <td>{{x.year}}</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
                <div class="list_wrapper" ng-if="vm.halfYearList.length==0">No records found to display.</div>
            </div>
        </div>
    </div>
</div>
<div class="modal" id="levelNameModal" role="dialog">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-bs-dismiss="modal">&times;</button>
                <h4 class="modal-title">Scheme Master Name</h4>
            </div>
            <div class="modal-body">
                <div class="loader_popup"></div>
                <div class="list_wrapper" ng-if="vm.schemeNameList.length>0">
                    <div class="col-sm-8 form_submit">
                        <div class="form-group">
                            <div class="input-group">
                                <div class="input-group-addon">
                                    <i class="glyphicon glyphicon-search"></i>
                                </div>
                                <input type="text" class="form-control"
                                       ng-model="vm.searchlevelName" ng-init="vm.searchlevelName = ''"
                                       placeholder="Search">
                            </div>
                        </div>
                    </div>
                    <div class="col-sm-4 form_submit"></div>
                    <div class="row">
                        <div class="col-sm-12">
                            <table class="table table-bordered list scroll">
                                <thead ng-init="reverseOrder = false; sortedColumn = 'schemeName'">
                                <tr>
                                    <th class="modal-title title-case" ng-click="(sortedColumn == 'schemeName')?(reverseOrder=(!reverseOrder)): (reverseOrder = false);sortedColumn = 'schemeName';" ng-class="(sortedColumn == 'schemeName')?((reverseOrder)?('arrow-down') : ('arrow-up') ) : ('')">Scheme Name</th>
                                    <th class="modal-title title-case" ng-click="(sortedColumn == 'schemeStatus')?(reverseOrder=(!reverseOrder)): (reverseOrder = false);sortedColumn = 'schemeStatus';" ng-class="(sortedColumn == 'schemeStatus')?((reverseOrder)?('arrow-down') : ('arrow-up') ) : ('')">schemeStatus</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr class="cp"
                                    ng-repeat="x in vm.schemeNameList | filter:vm.searchlevelName | orderBy:sortedColumn:reverseOrder"
                                    ng-click="vm.schemeName=x.schemeName;vm.schemeCode=x.schemeCode;vm.schemeStatus=x.schemeStatus"  data-bs-dismiss="modal">
                                    <td>{{x.schemeName}}</td>
                                    <td>{{x.schemeStatus}}</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
                <div class="list_wrapper" ng-if="vm.schemeNameList.length==0">No records found to display.</div>
            </div>
        </div>
    </div>
</div>
