<div class="loader-new" ng-if="vm.loader"></div>
<cbs-left-menu></cbs-left-menu>
<div class="container from_wrapper new_form_wrapper">
	<h4 class="form_heading  feature-heading">Office Account Place
		Holder - Delete</h4>

	<table class="table table-bordered table-striped list">
		<thead>
	    	<tr>
	        	<th>Particular</th>
	        	<th ng-if="!vm.newValueDisplay">Value</th>
	        	<th ng-if="vm.newValueDisplay">New Value</th>
	        	<th ng-if="vm.newValueDisplay">Old Value</th>
	        </tr>
	    </thead>
		<tbody>
			<tr>
				<td>
					<label for="bacid" class="control-label">Place Holder</label>
				</td>
				<td ng-if="vm.newValueDisplay">
					<label class="data-bind" id="bacid_New">{{vm.officeAccountPlaceHolderNewScope.bacid}}</label>
				</td>
				<td>
					<label class="data-bind" id="bacid">{{vm.officeAccountPlaceHolder.bacid}}</label>
				</td>
			</tr>
			<tr>	
				<td>
					<label for="bacidDesc" class="control-label">Placeholder
					Description</label>
				</td>
				<td ng-if="vm.newValueDisplay">
					<label class="data-bind" id="bacidDesc_New">{{vm.officeAccountPlaceHolderNewScope.bacidDesc}}</label>
				</td>
				<td>
					<label class="data-bind" id="bacidDesc">{{vm.officeAccountPlaceHolder.bacidDesc}}</label>
				</td>
			</tr>
			<tr>
				<td>
					<label for="schmType" class="control-label">Type of Scheme</label>
				</td>
				<td ng-if="vm.newValueDisplay">
					<label class="data-bind" id="schmType_New">{{vm.officeAccountPlaceHolderNewScope.schmType}}</label>
				</td>
				<td>
					<label class="data-bind" id="schmType">{{vm.officeAccountPlaceHolder.schmType}}</label>
				</td>
			</tr>
			<tr>
				<td>
					<label for="additionalText1" class="control-label">Additional Text1</label>
				</td>
				<td ng-if="vm.newValueDisplay">
					<label class="data-bind" id="additionalText1_New">{{vm.officeAccountPlaceHolderNewScope.additionalText1}}</label>
				</td>
				<td>
					<label class="data-bind" id="additionalText1">{{vm.officeAccountPlaceHolder.additionalText1}}</label>
				</td>
			</tr>
			<tr>
				<td>
					<label for="additionalText2" class="control-label">Additional Text2</label>
				</td>
				<td ng-if="vm.newValueDisplay">
					<label class="data-bind" id="additionalText2_New">{{vm.officeAccountPlaceHolderNewScope.additionalText2}}</label>
				</td>
				<td>
					<label class="data-bind" id="additionalText2">{{vm.officeAccountPlaceHolder.additionalText2}}</label>
				</td>
			</tr>
			<tr>
				<td>
					<label for="additionalText3" class="control-label">Additional Text3</label>
				</td>
				<td ng-if="vm.newValueDisplay">
					<label class="data-bind" id="additionalText3_New">{{vm.officeAccountPlaceHolderNewScope.additionalText3}}</label>
				</td>
				<td>
					<label class="data-bind" id="additionalText3">{{vm.officeAccountPlaceHolder.additionalText3}}</label>
				</td>
			</tr>
		</tbody>
	</table>
	
	<div class="row" ng-if="vm.officeAccountPlaceHolderNewScope">
		<div class="col-sm-7"></div>
		<label  ng-if="!vm.verified" class="control-label col-sm-5"><b>Verify Status : Y</b></label>
		<label  ng-if="vm.verified" class="control-label col-sm-5"><b>Verify Status : N</b></label>
	</div>

		<div class="row">
			<div class="text-center form_submit">
			<button type="button" class="btn btn-default" id="submitButton"
					ng-click="vm.deleteOffice(vm.officeAccountPlaceHolder.id)"
					ng-disabled="!vm.officeAccountPlaceHolderNewScope">Delete</button>
			<button type="button" class="btn btn-cancel" id="cancelButton"
				ui-sref="office_account_place_holder.delete">Cancel</button></div>
		</div>
	</div>
