<div class="loader-new" ng-if="vm.loader"></div>
<dc-left-menu></dc-left-menu>
<div class="container from_wrapper new_form_wrapper">

    <h4 class="form_heading">BOND INTEREST PAYMENT MIS REPORT - SOL WISE</h4>
    <sol-header></sol-header>
    <form name="bondIneterestPayMisReportForm" role="form">
        <div class="col-sm-6 col-sm-offset-3">

            <div class="row" >
                <div class="form-group ">
                    <div class="col-sm-6">
                        <label for="bodDate" class="control-label">BOD Date</label>
                    </div>
                    <div class="col-sm-4">
                        <input type="text" class="form-control" id="bodDate"
                               ng-model="vm.subsDate"
                               chars="alpha-numeric"  readonly >
                    </div>
                </div>
            </div>



            <div class="row" >
                <div class="form-group ">
                    <div class="col-sm-6">
                        <label for="moduleName" class="control-label">Name of the module</label>
                    </div>
                    <div class="col-sm-4">
                        <input type="text" class="form-control" id="moduleName"
                               ng-model="vm.moduleName" ng-init="vm.moduleName='RBI BOND'"
                               chars="alpha-numeric"  readonly >
                    </div>
                </div>
            </div>

            <div class="row" ng-init="vm.getModuleName();">
                <div class="form-group required">
                    <div class="col-sm-6">
                        <label for="schemeCode" class="control-label">Name of the Bond Scheme</label>
                    </div>
                    <div class="col-sm-4">
                        <select class="form-control" id="schemeCode" name="schemeCode"
                                ng-model="vm.schemeCode" required>
                            <option value="">Select</option>
                            <option ng-repeat="item in vm.schemeList" value="{{item.subCode}}" ng-bind="vm.schemeName=item.subCodeDescription"></option>
                        </select>
                    </div>
                </div>
            </div>


            <div class="row" >
                <div class="form-group required">
                    <div class="col-sm-6">
                        <label for="paidMonth" class="control-label">Interest paid for</label>
                    </div>
                    <div class="col-sm-4">
                        <select class="form-control" id="paidMonth" name="paidMonth"
                                ng-model="vm.paidMonth" required>
                            <option value="">Select</option>
                            <option value="JAN-JUN">JAN-JUN</option>
                            <option value="JUL-DEC">JUL-DEC</option>
                        </select>
                    </div>
                </div>
            </div>


            <div class="row" ng-init="vm.getFinancialYear()">
                <div class="form-group required">
                    <div class="col-sm-6">
                        <label for="financialYear" class="control-label">Financial Year</label>
                    </div>
                    <div class="col-sm-4">
                        <select class="form-control" id="financialYear" name="financialYear"
                                ng-model="vm.financialYear"  required>
                            <option value="">Select</option>
                            <option value={{vm.financialyearData}}>{{vm.financialyearData}}</option>
                            <option value={{vm.financialyearData1}}>{{vm.financialyearData1}}</option>
                            </option>
                        </select>
                    </div>
                </div>
            </div>


            <div class="text-center form_submit">
                <button type="submit" class="btn btn-default" id="submitButton"
                        ui-sref="bond_interest_payment_mis_report_sol_wise.inquiry_details({obj:{
								paidMonth : vm.paidMonth,
								financialYear : vm.financialYear,
								schemeName : vm.schemeName,
								schemeCode : vm.schemeCode
								}})"
                        ng-disabled="bondIneterestPayMisReportForm.$invalid">Submit</button>
                <button type="button" class="btn btn-cancel" id="cancelButton"
                        onclick="window.location.href= '#!/rbibond_gu_functionality'">Cancel</button>
            </div>
            <div class="text-center">
                <notice-message-directive></notice-message-directive>
            </div>
        </div>
    </form>
</div>
