<div class="loader-new" ng-if="vm.loader"></div>
<cbs-left-menu></cbs-left-menu>
<div class="container from_wrapper">
	<h4 class="form_heading">CBS Integration Bulk Upload Delete</h3>
	<form name="cbsVerifyForm" role="form" enctype="multipart/form-data">
			<div class="row">
				<div class="form-group required">
				  	<div class="col-sm-3"></div>
				  	<label for="functionality" class ="control-label col-sm-3">Functionality</label>
					<div class="col-sm-3">
						<select class="form-control" name="functionality" ng-model="vm.cbsVerify.functionality" ng-dropdown required ng-change="vm.getUnverifiedFiles()" >
							<option value="">Select Functionality</option>
							<option value="bankbranch">Branches of the Bank</option>
<!--							<option value="officeaccountplaceholder">Office account Placeholder</option>-->
<!--							<option value="instruments">Instrument Details</option>-->
<!--							<option value="transactioncodes">List of Transaction Codes</option>	-->
							<option value="otherbankdetails">Other Bank details </option>
							<option value="otherbankbranches">Branches of Other Bank</option>
							<option value="calendarentries">Maintenance of Calendar Entries</option>
<!--							<option value="schemecodes">Scheme Codes</option>-->
<!--							<option value="userdetails">User Work Class Information</option>-->
<!--							<option value="branchifscdetails">Branch IFSC Codes</option>		 -->
						</select>
					</div>
				</div>
				</div>
				
				<div class="row">
				<div class="form-group required">
				  <div class="col-sm-3"></div>
				  <label for="functionality" class ="control-label col-sm-3">Unverified File</label>
					<div class="col-sm-3">
						<select class="form-control" id="unverifiedFile" name="unverifiedFile" ng-model="vm.cbsVerify.unverifiedFile" ng-dropdown required >
							<option  ng-selected= "{{y == vm.cbsVerify.unverifiedFile}}" ng-repeat="(x,y) in vm.unverifiedFileList" value="{{y}}">{{y}}</option> 
						</select>
					</div>
				</div>
				</div>
			
	 <div class="col-sm-offset-5 col-sm-8 form_submit">
		 <button type="submit" class="btn btn-default" id="cbsVerifySubmit"  
		 	ng-disabled="cbsVerifyForm.$invalid" 
		 	ui-sref="cbs_bulk_upload.delete_detail({functionality: vm.cbsVerify.functionality, file: vm.cbsVerify.unverifiedFile})" >Submit</button>
		 <button type="button" class="btn btn-cancel"  id="cancelButton" ng-click="vm.showCancelConfirmation('cbs_bulk_upload.list')">Cancel</button>
	   </div>
	   <div class="text-center">
			<notice-message-directive></notice-message-directive>
	   </div>
	</form>
</div>
