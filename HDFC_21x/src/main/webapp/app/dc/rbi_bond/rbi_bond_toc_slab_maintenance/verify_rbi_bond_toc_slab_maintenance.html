<div class="loader-new" ng-if="vm.loader"></div>
<dc-left-menu></dc-left-menu>
<div class="container from_wrapper new_form_wrapper">

    <h4 class="form_heading">RBI Bond TOC Slab Master Maintenance - Verify/Reject</h4>
    <sol-header></sol-header>
    <form name="tocSlabMaintenanceForm" role="form">

        <div class="row">
            <div class="form-group">
                <div class="col-sm-3"></div>
                <div class="col-sm-3">
                    <label for="moduleName" class="control-label">Name of the Module</label>
                </div>
                <div class="col-sm-5">
                    <label><b>RBI Bond</b></label>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="form-group required">
                <div class="col-sm-3"></div>
                <div class="col-sm-3">
                    <label for="moduleName" class="control-label">Name of the Bond Scheme </label>
                </div>
                <div class="col-sm-2">
                    <input type="text" class="form-control" id="moduleName" ng-model="vm.schemeName" readonly required>
                </div>
                <div class="col-sm-2">
                    <i class="glyphicon glyphicon-search cp" data-bs-toggle="modal" id="schemeNameSearcher" ng-click="vm.getschemeName('Verify'); vm.schemeCode = '';"></i>
                    <i class="glyphicon glyphicon-remove clear cp" ng-click="vm.schemeName='';vm.versionNo='';vm.effeFromDate=''"></i>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="form-group required">
                <div class="col-sm-3"></div>
                <div class="col-sm-3">
                    <label for="versionNo" class="control-label">Version No</label>
                </div>
                <div class="col-sm-2">
                    <input type="text" class="form-control" id="versionNo"
                           ng-model="vm.versionNo" readonly>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <div class="col-sm-3"></div>
                <div class="col-sm-3">
                    <label for="moduleName" class="control-label">Effective From Date</label>
                </div>
                <div class="col-sm-2">
                    <input type="text" class="form-control" ng-model="vm.effeFromDate" readonly>
                </div>
            </div>
        </div>


        <div class="text-center form_submit">
            <button type="submit" id="submitbutton" class="btn btn-default"
                    ui-sref="rbi_bond_toc_slab_maintenance.verify_detail({obj:{
                                    schemeCode: vm.schemeCode,
                                    versionNo: vm.versionNo,
                                    schemeName: vm.schemeName,
                                    effeFromDate: vm.effeFromDate

								}})"
                    ng-disabled="tocSlabMaintenanceForm.$invalid">Submit</button>
            <button type="button" class="btn btn-cancel" id="cancelButton"
                    onclick="window.location.href= '#!/rbi_bond_toc_slab_maintenance/action/inquiry';">Cancel
            </button>
        </div>

        <div class="text-center">
            <notice-message-directive></notice-message-directive>
        </div>
    </form>
</div>
<!-- Scheme name sneha -->
<!--Scheme Name-->
<div class="modal" id="schemeNameSearcherPopUp" role="dialog">
    <div class="modal-dialog">
        <!-- Modal content-->
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-bs-dismiss="modal">&times;</button>
                <h4 class="modal-title">Name of the bond scheme</h4>
            </div>
            <div class="modal-body">
                <div class="loader_popup"></div>
                <div class="list_wrapper" ng-if="vm.schemeNameList.length>0">
                    <div class="col-sm-8 form_submit">
                        <div class="form-group">
                            <div class="input-group">
                                <div class="input-group-addon">
                                    <i class="glyphicon glyphicon-search"></i>
                                </div>
                                <input type="text" class="form-control"  ng-model="vm.schemeCode" ng-init="vm.schemeCode = ''" placeholder="Search">
                            </div>
                        </div>
                    </div>
                    <div class="col-sm-4 form_submit"></div>
                    <div class="row">

                        <div class="col-sm-12">
                            <table class="table table-bordered list scroll">
                                <thead ng-init="reverseOrder = false; sortedColumn = 'schemeCode'">
                                <tr>
                                    <th class="modal-title title-case" ng-click="(sortedColumn == 'schemeName')?(reverseOrder=(!reverseOrder)): (reverseOrder = false);sortedColumn = 'schemeName';" ng-class="(sortedColumn == 'schemeName')?((reverseOrder)?('arrow-down') : ('arrow-up') ) : ('')">Scheme Name</th>
                                    <th class="modal-title title-case" ng-click="(sortedColumn == 'schemeStatus')?(reverseOrder=(!reverseOrder)): (reverseOrder = false);sortedColumn = 'schemeStatus';" ng-class="(sortedColumn == 'schemeStatus')?((reverseOrder)?('arrow-down') : ('arrow-up') ) : ('')">Scheme Status</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr class="cp"
                                    ng-repeat="x in vm.schemeNameList | filter:vm.schemeCode | orderBy:sortedColumn:reverseOrder"
                                    ng-click="vm.schemeCode=x.schemeCode;vm.schemeName=x.schemeName;vm.versionNo=x.versionNo;vm.effeFromDate=x.effeFromDate"  data-bs-dismiss="modal">
                                    <td>{{x.schemeName}}</td>
                                    <td>{{x.schemeStatus}}</td>
                                </tr>
                                <!--                                <tr class="cp" ng-repeat="x in vm.branchIdList" ng-click="vm.searchBranchId = x.branchId;vm.branchName = x.branchName;vm.crn.no=x.crn.no;" data-bs-dismiss="modal">-->
                                <!--                                    <td>{{x.branchId}}</td>-->
                                <!--                                    <td>{{x.branchName}}</td>-->
                                <!--                                </tr>-->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
                <div class="list_wrapper" ng-if="vm.schemeNameList.length==0">No records found to display.</div>
            </div>
        </div>
    </div>
</div>

<!-- Version Details Start-->
<div class="modal" id="versionNoModal" role="dialog">
    <div class="modal-dialog">
        <!-- Modal content-->
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-bs-dismiss="modal">&times;</button>
                <h4 class="modal-title">Version No</h4>
            </div>
            <div class="modal-body">
                <div class="loader_popup"></div>
                <div class="list_wrapper" ng-if="vm.versionNoList.length>0">
                    <div class="col-sm-8 form_submit">
                        <div class="form-group">
                            <div class="input-group">
                                <div class="input-group-addon">
                                    <i class="glyphicon glyphicon-search"></i>
                                </div>
                                <input type="text" class="form-control"
                                       ng-model="vm.searchSolId" ng-init="vm.searchSolId = ''"  placeholder="Search" chars="alpha-numeric"
                                      >


                            </div>
                        </div>
                    </div>
                    <div class="col-sm-4 form_submit"></div>
                    <div class="row">

                        <div class="col-sm-12">
                            <table class="table table-bordered list scroll sort">
                                <thead ng-init="reverseOrder=false;sortedColumn = 'effeFromDate'">
                                <tr>
                                    <th ng-click="(sortedColumn == 'versionNo')?(reverseOrder=(!reverseOrder)): (reverseOrder = false);sortedColumn = 'versionNo';" ng-class="(sortedColumn == 'versionNo')?((reverseOrder)?('arrow-down') : ('arrow-up') ) : ('')">Version no</th>
                                    <th ng-click="(sortedColumn == 'effeFromDate')?(reverseOrder=(!reverseOrder)): (reverseOrder = false);sortedColumn = 'effeFromDate';" ng-class="(sortedColumn == 'effeFromDate')?((reverseOrder)?('arrow-down') : ('arrow-up') ) : ('')">Effective From date</th>
                                    <!--                                    <th ng-click="(sortedColumn == 'verifiedStatus')?(reverseOrder=(!reverseOrder)): (reverseOrder = false);sortedColumn = 'verifiedStatus';" ng-class="(sortedColumn == 'verifiedStatus')?((reverseOrder)?('arrow-down') : ('arrow-up') ) : ('')">Verify Status</th>-->
                                </tr>
                                </thead>
                                <tbody>
                                <tr class="cp"
                                    ng-repeat="x in vm.versionNoList | filter:vm.searchSolId | orderBy:sortedColumn:reverseOrder"
                                    ng-click="vm.versionNo = x.versionNo; vm.effFromDate = x.effeFromDate;vm.versionNo=x.versionNo;vm.effFromDate = x.effFromDate" data-bs-dismiss="modal">
                                    <td>{{x.versionNo}}</td>
                                    <td>{{x.effeFromDate}}</td>
                                    <!--                                    <td>{{x.verifiedStatus}}</td>-->
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
                <div class="list_wrapper" ng-if="vm.versionNoList.length==0">No records found to display.</div>
            </div>

        </div>
    </div>
</div>
<!-- Version Details End-->
