<div class="loader-new" ng-if="vm.loader"></div>
<cbs-left-menu></cbs-left-menu>
<div class="container from_wrapper new_form_wrapper" ng-if="!vm.newValueDisplay">

	<h4 class="form_heading  feature-heading">List Of Transaction
		Codes - Modify</h4>

	<form name="cbsTransactionCodesListForm" role="form">
		<div class="row">
			<div class="form-group">
				<div class="col-sm-3"></div>
				<div class="col-sm-3 required">
					<label for="clgTranCode" class="control-label">Clearing
						Transaction Code</label>
				</div>
				<div class="col-sm-3">
					<input type="text" class="form-control" name="clgTranCode"
						id="clgTranCode" chars="alpha-numeric"
						ng-model="vm.cbsListOfTransactionCodes.clgTranCode" maxlength="5"
						required>
				</div>
			</div>
		</div>
		<div class="row">
			<div class="form-group">
				<div class="col-sm-3"></div>
				<div class="col-sm-3">
					<label for="schemeCode" class="control-label">Scheme
						Code</label>
				</div>
				<div class="col-sm-3">
					<input type="text" class="form-control" name="schemeCode"
						id="schemeCode" chars="alpha-numeric"
						ng-model="vm.cbsListOfTransactionCodes.schemeCode"
						maxlength="5">
				</div>
			</div>
		</div>
		<div class="row">
			<div class="form-group">
				<div class="col-sm-3"></div>
				<div class="col-sm-3">
					<label for="clgTranCodeDesc" class="control-label">Transaction
						Code Description</label>
				</div>
				<div class="col-sm-3">
					<input type="text" class="form-control" name="clgTranCodeDesc"
						id="clgTranCodeDesc" chars="alpha-numeric"
						ng-model="vm.cbsListOfTransactionCodes.clgTranCodeDesc"
						maxlength="40">
				</div>
			</div>
		</div>
		<div class="row">
			<div class="form-group">
				<div class="col-sm-3"></div>
				<div class="col-sm-3">
					<label for="instrumentType" class="control-label">Type of
						Instrument</label>
				</div>
				<div class="col-sm-3">
					<input type="text" class="form-control" name="instrumentType"
						id="instrumentType" chars="alpha-numeric"
						ng-model="vm.cbsListOfTransactionCodes.instrumentType"
						maxlength="5">
				</div>
			</div>
		</div>
		<div class="row">
			<div class="form-group">
				<div class="col-sm-3"></div>
				<div class="col-sm-3">
					<label for="addText1" class="control-label">Additional
						Text1</label>
				</div>
				<div class="col-sm-3">
					<input type="text" class="form-control" name="addText1"
						id="addText1" ng-model="vm.cbsListOfTransactionCodes.addText1"
						maxlength="40" chars="alpha-numeric">
				</div>
			</div>
		</div>
		<div class="row">
			<div class="form-group">
				<div class="col-sm-3"></div>
				<div class="col-sm-3">
					<label for="addText2" class="control-label">Additional
						Text2</label>
				</div>
				<div class="col-sm-3">
					<input type="text" class="form-control" name="addText2"
						id="addText2" ng-model="vm.cbsListOfTransactionCodes.addText2"
						maxlength="40" chars="alpha-numeric">
				</div>
			</div>
		</div>
		<div class="row">
			<div class="form-group">
				<div class="col-sm-3"></div>
				<div class="col-sm-3">
					<label for="addText3" class="control-label">Additional
						Text3</label>
				</div>
				<div class="col-sm-3">
					<input type="text" class="form-control" name="addText3"
						id="addText3" ng-model="vm.cbsListOfTransactionCodes.addText3"
						maxlength="40" chars="alpha-numeric">
				</div>
			</div>
		</div>
		
		<div class="row" >
			<div class="col-sm-7"></div>
			<label  ng-if="!vm.verified" class="control-label col-sm-5"><b>Verify Status : Y</b></label>
			<label  ng-if="vm.verified" class="control-label col-sm-5"><b>Verify Status : N</b></label>
		</div>
		
		<div class="row">
			<div class="text-center form_submit">
				<button type="submit" class="btn btn-default" id="submitButton"
					ng-disabled="cbsTransactionCodesListForm.$invalid"
					ng-click="vm.modify()">Update</button>
				<button type="button" class="btn btn-cancel" id="cancelButton"
					ng-click="vm.showCancelConfirmation('cbs_list_of_transaction_codes.modify');">Cancel</button>
			</div>
		</div>
		<div class="text-center">
			<notice-message-directive></notice-message-directive>
		</div>
	</form>

</div>
