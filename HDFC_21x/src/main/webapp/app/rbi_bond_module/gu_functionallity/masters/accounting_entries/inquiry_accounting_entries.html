<div class="loader-new" ng-if="vm.loader"></div>
<dc-left-menu></dc-left-menu>
<div class="container from_wrapper new_form_wrapper">

    <h4 class="form_heading">Accounting Entries - Inquiry</h4>
    <sol-header></sol-header>
    <form name="accountOpeningForm" role="form">
        <div class="row">
            <div class="form-group">
                <div class="col-sm-3"></div>
                <div class="col-sm-3">
                    <label class="control-label">Name of the Module</label>
                </div>
                <div class="col-sm-4">
                    <label><strong>RBI Bond</strong></label>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="form-group required">
                <div class="col-sm-3"></div>
                <div class="col-sm-3">
                    <label for="schemeCode" class="control-label">Name of the Bond Scheme</label>
                </div>
                <div class="col-sm-3">
                    <input type="text" class="form-control" id="schemeCode" ng-model="vm.schemeName" required>
                </div>
                <div class="col-sm-2">
                    <i class="glyphicon glyphicon-search cp" data-bs-toggle="schemeName" id="treasurySearcher"
                       ng-click="vm.getInquiryModuleName();"></i>
                    <i class="glyphicon glyphicon-remove clear cp"
                       ng-click="vm.schemeCode ='';vm.schemeName =''; vm.schemeStatus='';"></i>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="form-group required">
                <div class="col-sm-3"></div>
                <div class="col-sm-3">
                    <label for="versionNo" class="control-label">Version No</label>
                </div>
                <div class="col-sm-3">
                    <input type="text" class="form-control" id="versionNo" ng-model="vm.versionNo" required>
                </div>
                <div class="col-sm-2">
                    <i class="glyphicon glyphicon-search cp" data-bs-toggle="schemeName" id="versionNoSearcher"
                       ng-click="vm.getInquiryVersionNo();"></i>
                    <i class="glyphicon glyphicon-remove clear cp"
                       ng-click="vm.versionNo =''; vm.effectiveFromDate= '';"></i>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="form-group required">
                <div class="col-sm-3"></div>
                <div class="col-sm-3">
                    <label for="fromDate" class="control-label">Effective From Date</label>
                </div>
                <div class="col-sm-3">
                    <input type="text" class="form-control" id="fromDate" ng-model="vm.effectiveFromDate"
                           ng-init="vm.effectiveFromDate = '';" required>
                </div>
            </div>
        </div>

        <div class="text-center form_submit">
            <button type="submit" class="btn btn-default" id="submitButton" ui-sref="accounting_entries.inquiry_detail({obj:{
								schemeCode: vm.schemeCode,
								schemeName: vm.schemeName,
								effectiveFromDate: vm.effectiveFromDate,
								versionNo: vm.versionNo,
								}})" ng-disabled="accountOpeningForm.$invalid">Next
            </button>
            <button type="button" class="btn btn-cancel" id="cancelButton"
                    onclick="window.location.href= '#!/rbibond_gu_functionality';">Cancel
            </button>
        </div>
    </form>
</div>

<!--Scheme Modal-->
<div class="modal" id="schemeModel" role="dialog">
    <div class="modal-dialog">
        <!-- Modal content-->
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-bs-dismiss="modal" ng-click="vm.searchSolId=''">&times;</button>
                <h4 class="modal-title">Name of the Bond Scheme</h4>
            </div>
            <div class="modal-body">
                <div class="loader_popup"></div>
                <div class="list_wrapper" ng-if="vm.schemeList.length>0">
                    <div class="col-sm-8 form_submit">
                        <div class="form-group">
                            <div class="input-group">
                                <div class="input-group-addon">
                                    <span class="glyphicon glyphicon-search"></span>
                                </div>
                                <input type="text" class="form-control" ng-model="vm.searchSolId"
                                       ng-Byinit="vm.searchSolId = ''" placeholder="Search"
                                       oninput="this.value = this.value.replace(/^\s+/, '').replace(/\s{2,}/g, ' ')">
                            </div>
                        </div>
                    </div>
                    <div class="col-sm-4 form_submit"></div>
                    <div class="row">
                        <div class="col-sm-12">
                            <table class="table table-bordered list scroll sort" aria-label="">
                                <thead ng-init="reverseOrder=true;sortedColumn = 'blaAccNo'">
                                <tr>
                                    <th ng-click="(sortedColumn == 'bondType')?(reverseOrder=(!reverseOrder)): (reverseOrder = false);sortedColumn = 'bondType';"
                                        ng-class="(sortedColumn == 'bondType')?((reverseOrder)?('arrow-down') : ('arrow-up') ) : ('')"
                                        scope="">
                                        Name of the Bond Scheme
                                    </th>
                                    <th ng-click="(sortedColumn == 'bondType')?(reverseOrder=(!reverseOrder)): (reverseOrder = false);sortedColumn = 'bondType';"
                                        ng-class="(sortedColumn == 'bondType')?((reverseOrder)?('arrow-down') : ('arrow-up') ) : ('')"
                                        scope="">
                                        Scheme Status
                                    </th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr class="cp"
                                    ng-repeat="x in vm.schemeList | filter:vm.searchSolId | orderBy:sortedColumn:reverseOrder"
                                    ng-click="vm.schemeName = x.schemeName;vm.schemeCode = x.schemeCode;vm.schemeStatus = x.schemeStatus;vm.effectiveFromDate = x.effectiveFromDate;
                                    vm.parameterEffectiveFromDate= x.parameterEffectiveFromDate;vm.parameterEffectiveToDate= x.parameterEffectiveToDate;
                                    vm.bondSchemeEffectiveFromDate= x.bondSchemeEffectiveFromDate;vm.bondSchemeEffectiveToDate= x.bondSchemeEffectiveToDate;"
                                    data-bs-dismiss="modal">
                                    <td>{{x.schemeName}}</td>
                                    <td>{{x.schemeStatus}}</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
                <div class="list_wrapper" ng-if="vm.schemeList.length==0">No records found to display.</div>
            </div>
        </div>
    </div>
</div>

<!--Version Number Modal-->
<div class="modal" id="versionModel" role="dialog">
    <div class="modal-dialog">
        <!-- Modal content-->
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-bs-dismiss="modal">&times;</button>
                <h4 class="modal-title">Version No Model</h4>
            </div>
            <div class="modal-body">
                <div class="loader_popup"></div>
                <div class="list_wrapper" ng-if="vm.versionNoList.length>0">
                    <div class="col-sm-8 form_submit">
                        <div class="form-group">
                            <div class="input-group">
                                <div class="input-group-addon">
                                    <i class="glyphicon glyphicon-search"></i>
                                </div>
                                <input type="text" class="form-control" ng-model="vm.modalSearch"
                                       ng-init="vm.modalSearch = ''" placeholder="Search">
                            </div>
                        </div>
                    </div>
                    <div class="col-sm-4 form_submit"></div>
                    <div class="row">
                        <div class="col-sm-12">
                            <table class="table table-bordered list scroll sort" aria-label="">
                                <thead ng-init="reverseOrder=true;sortedColumn = 'schemeName'">
                                <tr>
                                    <!--                                    <th class="modal-title title-case" ng-show="false">Scheme Code</th>-->
                                    <th scope="col" class="modal-title title-case"
                                        ng-click="(sortedColumn == 'schemeName')?(reverseOrder=(!reverseOrder)): (reverseOrder = false);sortedColumn = 'schemeName';"
                                        ng-class="(sortedColumn == 'schemeName')?((reverseOrder)?('arrow-down') : ('arrow-up') ) : ('')">
                                        Version No
                                    </th>
                                    <th scope="col" class="modal-title title-case"
                                        ng-click="(sortedColumn == 'schemeStatus')?(reverseOrder=(!reverseOrder)): (reverseOrder = false);sortedColumn = 'schemeStatus';"
                                        ng-class="(sortedColumn == 'schemeStatus')?((reverseOrder)?('arrow-down') : ('arrow-up') ) : ('')">
                                        Effective From Date
                                    </th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr class="cp"
                                    ng-repeat="x in vm.versionNoList | filter:vm.modalSearch | orderBy:sortedColumn:reverseOrder"
                                    ng-click="vm.versionNo = x.versionNo; vm.effectiveFromDate = x.effectiveFromDate;"
                                    data-bs-dismiss="modal">
                                    <td>{{x.versionNo}}</td>
                                    <td>{{x.effectiveFromDate}}</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
                <div class="list_wrapper" ng-if="vm.versionNoList.length==0">No records found to display.</div>
            </div>
        </div>
    </div>
</div>
