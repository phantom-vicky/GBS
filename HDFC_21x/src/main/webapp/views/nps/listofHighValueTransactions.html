<div class="container from_wrapper">
	<left-menu-directive></left-menu-directive>
	<h4 class="form_heading">List of High Value Transactions (All POP - SPs) - Range of Date</h4>
	<form name="listofHighValueTransactionsForm" role="form" ng-submit="submitForm(listofHighValueTransactionsForm.$valid)" novalidate>
			 <div class="form-group required">
				 <div class="col-sm-2"></div>
						<label for="from_date" class ="control-label col-sm-4">From date (DD/MM/YYYY)</label>
						<div class="col-sm-3">
						  <input type="date" class="form-control" id="from_date" ng-model="listofHighValueTransactions.from_date" required>
						</div>
					 </div>
					 	
					<div class="form-group required">
					<div class="col-sm-2"></div>
						<label for="to_date" class ="control-label col-sm-4">To date (DD/MM/YYYY)</label>
						<div class="col-sm-3">
						  <input type="date" class="form-control" id="to_date" name="min_num_contr" ng-model="listofHighValueTransactions.to_date" required>
					    </div>	
					</div>
			       <div class="form-group required">
				<div class="col-sm-2"></div>
				  <label for="report" class ="control-label col-sm-4">Report For</label>
					<div class="col-sm-3">
			      	<select class="form-control" >
						  <option>Select the Report Type </option>
						  <option>Corporate</option>
						  <option>UOS</option>
						  <option>Lite</option>
					 	</select>
					</div>
				</div>
				<div class="form-group required">
				<div class="col-sm-2"></div>
				  <label for="tier" class ="control-label col-sm-4">Tier Type</label>
					<div class="col-sm-3">
			      	<select class="form-control"  >
						  <option>Select the Tier Type </option>
						  <option>Tier I</option>
						  <option>Tier II</option>
						  <option>Tier I and Tier II</option>
					 	</select>
					 	</select>
					</div>
				</div>
	        <div class="col-sm-offset-5 col-sm-8 form_submit">
		       <button type="submit" class="btn btn-default" ng-disabled="listofHighValueTransactionsForm.$invalid">Submit</button>
		       <button type="submit" class="btn btn-cancel">Cancel</button>
	       </div>
	   </form>
  </div>
