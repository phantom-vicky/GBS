<div class="loader-new" ng-if="vm.loader"></div>
<dc-left-menu></dc-left-menu>
<div class="container from_wrapper new_form_wrapper">

	<h4 class="form_heading">General Scheme Parameter Maintenance(Common) - Modify</h4>
			<form name="generalSchemeParameterMaintenanceForm" role="form"
			ng-submit="submitForm(generalSchemeParameterMaintenanceForm.$valid)"
			novalidate>

			<div class="row">
				<div class="form-group">
					<div class="col-sm-2"></div>
					<label for="schemeType" class="control-label col-sm-5">
						Scheme Type</label>
					<div class="col-sm-2">
						<select class="form-control" id="schemeTypeInput" name="schemeTypeInput"
							ng-model="vm.schemeTypeInput" ng-init="vm.getSchemeTypes();vm.schemeTypeInput='';">
							<option value="">SELECT</option>
							<option ng-repeat="item in vm.schemeTypeList" value="{{item.subCode}}">{{item.subCodeDescription}}</option>
						</select>
					</div>
				</div>
			</div>
			<div class="text-center form_submit">
			<button type="submit" class="btn btn-default" id="submitButton"
				ng-disabled="!vm.schemeTypeInput"
				ui-sref="general_scheme_parameter_maintenance.modify_form({obj: {schemeType: vm.schemeTypeInput}})">Submit</button>
			<button type="submit" class="btn btn-cancel" id="cancelButton"
				onclick="window.location.href = '#!/'">Cancel</button>
								
			</div>
		</form>
	</div>
