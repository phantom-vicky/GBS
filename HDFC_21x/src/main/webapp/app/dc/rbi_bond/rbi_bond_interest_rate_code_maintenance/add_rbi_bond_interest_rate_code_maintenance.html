<div class="loader-new" ng-if="vm.loader"></div>
<dc-left-menu></dc-left-menu>
<div class="container from_wrapper new_form_wrapper">

    <h4 class="form_heading">RBI Bond Interest Rate Code Maintenance - Add</h4>
    <sol-header></sol-header>
    <form name="rbiBondInterestMaintenanceForm" role="form" ng-submit="vm.addSubmitForm()">
        <div class="col-sm-6 col-sm-offset-3">


            <div class="row">
                <div class="form-group required">
                    <div class="col-sm-6">
                        <label  class="control-label">Name of the Module</label>
                    </div>
                    <div class="col-sm-4">
                        <label><b>RBI Bond</b></label>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="form-group required">
                    <div class="col-sm-6">
                        <label for="moduleName" class="control-label">Scheme Name</label>
                    </div>

                        <div class="col-sm-4">
                            <input type="text" class="form-control" id="moduleName"
                                   ng-model="vm.subCodeDescription"  readonly required>
                        </div>

                    <div class="col-sm-2">
                        <i class="glyphicon glyphicon-search cp" data-bs-toggle="modal"
                           id="schemeCodeSearch"
                           ng-click="vm.addSubmitForm('Y');"></i> <i
                            class="glyphicon glyphicon-remove clear cp"
                            ng-click="vm.subCodeDescription = '';vm.schemeCode"></i>
                    </div>
                </div>
            </div>


            <div class="row" >
                <div class="form-group required">
                    <div class="col-sm-6">
                        <label for="level" class="control-label">Interest Rate Code</label>
                    </div>
                    <div class="col-sm-4">

                        <input type="text" chars="alpha-numeric" class="form-control" id="level" name="noOfLevel"
                               ng-model="vm.interestRate" limit-to="5" oninput="this.value = this.value.replace(/[^\w\s]/g, '').replace(/\s+/g, '').replace(/^0+/, '')" required>
                    </div>
                </div>
            </div>
            <div class="row" >
                <div class="form-group required">
                    <div class="col-sm-6">
                        <label for="Interest_Rate_Code_Description"  class="control-label">Interest Rate Code Description</label>
                    </div>
                    <div class="col-sm-4">
                        <input type="text"  class="form-control" chars="alpha-numeric"  id="Interest_Rate_Code_Description" name="Interest_Rate_Code_Description"
                               ng-model="vm.interestRateCodeDes"   minlength="1"  maxlength="30" required ng-blur="vm.minValueOne($event,'interestRateCodeDes')" >
<!--                        <span class="alert-danger" ng-if="vm.levelCutOffErrMsg" ng-bind="vm.levelCutOffErrMsg"></span>-->

                    </div>
                </div>
            </div>


            <div class="row">
                <div class="form-group required">
                    <div class="col-sm-6">
                        <label for="version" class="control-label">Version</label>
                    </div>
                    <div class="col-sm-4">
                        <input type="text" class="form-control" id="version"
                               ng-init="vm.versionNo ='00001'" ng-model="vm.versionNo" maxlength="5" required readonly>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="form-group required">
                   <div class="col-sm-6">
                        <label class="control-label">Effective From Date (dd/mm/yyyy)</label>
                    </div>
                    <div class="col-sm-4">
                        <p class="input-group">
                            <input type="text" class="form-control" id="effFromDate"
                                   name="effFromDate"
                                   ng-model="vm.effectiveFromDateObj"
                                   uib-datepicker-popup="dd/MM/yyyy"
                                   datepicker-options="vm.effFromDateOptions"
                                   is-open="vm.effFromDateOptions.opened"
                                   close-text="Close" maxlength="10"
                                   ng-blur="vm.textableDatePicker('effFromDate',vm.effectiveFromDateObj)"
                                   ng-keyup="vm.autoslashing('effFromDate')" chars="numbers-slash"
                                   required >
                            <span class="input-group-btn">
                            <button type="button" class="btn btn-secondary"
                                    ng-click="vm.effFromDateOptions.opened = true"
                                    id="effFromDateOptions">
                                <i class="glyphicon glyphicon-calendar"></i>
                            </button>
                        </span>
                        </p>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="form-group required">
                    <div class="col-sm-6">
                        <label class="control-label">
                            Fixed Interest rate / Floating Interest Rate </label>
                    </div>
                    <div class="col-sm-4">
                        <input type="radio" id="fixedInterest" name="fixedFloatingInterest" ng-model="vm.fixedFloatingInterest" required value="Y">Fixed
                        <input type="radio" id="floatingInterest" name="fixedFloatingInterest" ng-model="vm.fixedFloatingInterest" required value="N">Floating
                    </div>
                </div>
            </div>




            <div class="row" ng-if="vm.fixedFloatingInterest == 'N'">
                <div class="form-group">
                    <div class="col-sm-6">
                        <label for="Interest_Rate_National" class="control-label">Interest Rate (%) on National Savings Certificate</label>
                    </div>
                    <div class="col-sm-4" ng-class="{ 'has-error': vm.errorMsg }">
                        <input type="text" class="form-control" id="Interest_Rate_National"
                               ng-keypress="vm.percentageCheck($event)" ng-change="vm.percentageCheckChange('Interest_Rate_National');vm.decimalConvertInterestRateNational(vm.Interest_Rate_National);"
                               ng-model="vm.Interest_Rate_National" oninput="this.value = this.value.replace(/[^0-9.]/g, '').replace(/(\..*)\./g, '$1')" required>

                    </div>
                </div>
            </div>


            <div class="row" ng-if="vm.fixedFloatingInterest == 'N'">
                <div class="form-group required">
                    <div class="col-sm-6">
                        <label for="spreadRate" class="control-label">Spread Rate (%)</label>
                    </div>
                    <div class="col-sm-4">
                        <input type="text" class="form-control" id="spreadRate" ng-change="vm.percentageCheckChange('spreadRate');vm.decimalConvertspreadRate(vm.spreadRate);"
                               ng-keypress="vm.percentageCheck($event)"
                               ng-model="vm.spreadRate" oninput="this.value = this.value.replace(/[^0-9.]/g, '').replace(/(\..*)\./g, '$1')" required>
                    </div>
                </div>
            </div>
            <div class="row" >
                <div class="form-group required">
                    <div class="col-sm-6">
                        <label for="couponRate" class="control-label">Coupon / Interest Rate for Bond (%)</label>
                    </div>
                    <div class="col-sm-4">
                        <label id="couponRate" ng-if="vm.fixedFloatingInterest == 'N'">{{vm.coupon}}</label>
                        <input type="text" class="form-control" id="coupon"
                               ng-keypress="vm.percentageCheck($event)"  ng-change="vm.percentageCheckChange('coupon')"   ng-model="vm.coupon"  ng-change="vm.decimalConvertsCoupon(vm.coupon);"   ng-if="vm.fixedFloatingInterest == 'Y'" oninput="this.value = this.value.replace(/[^0-9.]/g, '').replace(/(\..*)\./g, '$1')" required>
            </div>
         </div>
            </div>
            <div class="row" >
                <div class="form-group ">
                    <div class="col-sm-6">
                        <label for="remarks" class="control-label">Remarks</label>
                    </div>
                    <div class="col-sm-4">
                        <textarea class="form-control" chars="alpha-numeric" id="remarks" rows="3" maxlength="100"

                                   ng-model="vm.remarks"></textarea>

                    </div>
                </div>
            </div>
        <div class="text-center form_submit">
            <button type="submit" class="btn btn-default" id="submitButton"
                    ng-disabled="rbiBondInterestMaintenanceForm.$invalid || vm.errorMsg">Submit</button>
            <button type="button" class="btn btn-cancel" id="cancelButton"
                    onclick="window.location.href= '#!/rbi_bond_interest_rate_code_maintenance/action/inquiry';">Cancel</button>
        </div>
        <div class="text-center">
            <notice-message-directive></notice-message-directive>
        </div>
        </div>

    </form>
</div>

<!-- Scheme code Details -->



<div class="modal" id="branchIdSearcher" role="dialog">
    <div class="modal-dialog">
        <!-- Modal content-->
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-bs-dismiss="modal">&times;</button>
                <h4 class="modal-title">Scheme Code</h4>
            </div>
            <div class="modal-body">
                <div class="loader_popup"></div>
                <div class="list_wrapper" ng-if="vm.schemeList.length>0">
                    <div class="col-sm-8 form_submit">
                        <div class="form-group">
                            <div class="input-group">
                                <div class="input-group-addon">
                                    <i class="glyphicon glyphicon-search"></i>
                                </div>
                                <input type="text" class="form-control"
                                       ng-model="vm.modalSearch" ng-init="vm.modalSearch = ''"
                                       placeholder="Search">
                            </div>
                        </div>
                    </div>
                    <div class="col-sm-4 form_submit"></div>
                    <div class="row">

                        <div class="col-sm-12">

                            <table class="table table-bordered list scroll sort">

                                <thead ng-init="reverseOrder = false; sortedColumn = 'subCodeDescription'">
                                <tr>
<!--                                    <th class="modal-title title-case" ng-click="(sortedColumn == 'schemeCode')?(reverseOrder=(!reverseOrder)): (reverseOrder = false);sortedColumn = 'schemeCode';" ng-class="(sortedColumn == 'schemeCode')?((reverseOrder)?('arrow-down') : ('arrow-up') ) : ('')">Scheme Code</th>-->
                                    <th class="modal-title title-case" ng-show="false">Scheme Code</th>
                                    <th class="modal-title title-case" ng-click="(sortedColumn == 'subCodeDescription')?(reverseOrder=(!reverseOrder)): (reverseOrder = false);sortedColumn = 'subCodeDescription';" ng-class="(sortedColumn == 'subCodeDescription')?((reverseOrder)?('arrow-down') : ('arrow-up') ) : ('')">Scheme Description</th>

                                </tr>
                                </thead>
                                <tbody>
                                <tr class="cp"
                                    ng-repeat="x in vm.schemeList | filter:vm.modalSearch | orderBy:sortedColumn:reverseOrder"
                                    ng-click="vm.schemeCode = x.schemeCode; vm.subCodeDescription = x.subCodeDescription;"
                                    data-bs-dismiss="modal">
<!--                                    <td>{{x.schemeCode}}</td>-->
                                    <td style="display: none;">{{x.schemeCode}}</td>
                                    <td>{{x.subCodeDescription}}</td>

                                </tr>
                                </tbody>
                            </table>
                        </div>

                    </div>
                </div>
                <div class="list_wrapper" ng-if="vm.schemeList.length==0">No records found to display.</div>
            </div>

        </div>
    </div>
</div>
